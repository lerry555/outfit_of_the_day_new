name: Stylist conversation sanitized diagnostics
on:
  push:
    branches: [stylist-simple-agent]
    paths: [.github/workflows/_tmp-conversation-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read selected non-secret function status fields
        run: >-
          gcloud functions describe stylistSimpleAgentV1 --region us-east1
          --project outfitoftheday-4d401
          --format='json(name,status,environment,updateTime,versionId)'
      - name: Read sanitized diagnostics for the failed acceptance window
        run: >-
          gcloud logging read 'timestamp>="2026-09-02T12:01:48Z" AND (resource.labels.function_name="stylistSimpleAgentV1" OR resource.labels.service_name="stylistsimpleagentv1")'
          --project outfitoftheday-4d401 --limit=60
          --format='json(timestamp,severity,jsonPayload.message,jsonPayload.stage,jsonPayload.code,jsonPayload.attempt,jsonPayload.valid,jsonPayload.validationErrors,jsonPayload.errors,jsonPayload.providerStatus,jsonPayload.providerErrorType,jsonPayload.providerErrorCode,jsonPayload.providerResponseStatus,jsonPayload.providerIncompleteReason,jsonPayload.modelAttempt,jsonPayload.outputTokens,jsonPayload.reasoningTokens,jsonPayload.latencyMs)'
