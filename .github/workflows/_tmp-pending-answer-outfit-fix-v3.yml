name: Pending answer outfit fix one-shot v3

on:
  push:
    branches:
      - fix/stylist-pending-answer-outfit-20260913
    paths:
      - .github/workflows/_tmp-pending-answer-outfit-fix-v3.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/stylist-pending-answer-outfit-20260913

      - name: Guard production brain and work branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment fix/stylist-pending-answer-outfit-20260913 --no-tags
          test "$GITHUB_REF_NAME" = "fix/stylist-pending-answer-outfit-20260913"
          test "$(git rev-parse origin/stylist-simple-agent)" = "4f4aa19edb1ed415d660e23ab85bfdb804d31718"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fix/stylist-pending-answer-outfit-20260913)"
          test "$(git merge-base origin/stylist-simple-agent HEAD)" = "4f4aa19edb1ed415d660e23ab85bfdb804d31718"
          expected="$(printf '%s\n%s\n%s' '.github/workflows/_tmp-pending-answer-outfit-fix-v3.yml' '.github/workflows/_tmp-pending-answer-outfit-fix-v2.yml' '.github/workflows/_tmp-pending-answer-outfit-fix.yml')"
          test "$(git diff --name-only origin/stylist-simple-agent...HEAD | sort)" = "$(printf '%s\n' "$expected" | sort)"

      - name: Apply continuation contract and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, got {count}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          engine = "functions/stylist/v2/stylist_one_brain_engine_v2.js"
          model = "functions/stylist/v2/openai_one_brain_model_port_v2.js"
          tests = "functions/stylist/v2/stylist_one_brain_runtime_v2.test.js"

          replace_once(engine,
              '  const stylingSignal = /\\b(?:outfit|oblecen\\w*|obliec\\w*|na seba|tura|turistik\\w*|hiking|trek\\w*|vylet\\w*|dovolen\\w*|koncert\\w*|festival\\w*|svadb\\w*|pohovor\\w*|ples\\w*|lyz\\w*)\\b/.test(normalized);\n  if (!stylingSignal) return null;\n',
              '  const stylingSignal = /\\b(?:outfit|oblecen\\w*|obliec\\w*|na seba|tura|turistik\\w*|hiking|trek\\w*|vylet\\w*|dovolen\\w*|koncert\\w*|festival\\w*|svadb\\w*|pohovor\\w*|ples\\w*|lyz\\w*)\\b/.test(normalized);\n  if (!stylingSignal) return null;\n  const outfitRequestSignal = /\\b(?:outfit|oblecen\\w*|obliec\\w*|na seba|vyber mi|navrhni mi|zostav mi)\\b/.test(normalized);\n')

          replace_once(engine,
              '  const eventLike = /\\b(?:koncert\\w*|festival\\w*|svadb\\w*|pohovor\\w*|ples\\w*|ceremoni\\w*|oslava\\w*)\\b/.test(normalized);\n  return {query, targetField: eventLike ? "eventLocation" : "destination"};\n',
              '  const eventLike = /\\b(?:koncert\\w*|festival\\w*|svadb\\w*|pohovor\\w*|ples\\w*|ceremoni\\w*|oslava\\w*)\\b/.test(normalized);\n  return {\n    query,\n    targetField: eventLike ? "eventLocation" : "destination",\n    resumeAction: outfitRequestSignal ? "generate_outfit" : null,\n  };\n')

          replace_once(engine,
              '    next.conversationMemory.pendingQuestion = {\n      type: "question",\n      actionId: result.clarification.actionId,\n      field: result.clarification.field,\n      question: result.clarification.question,\n      acceptsYesNo: Boolean(result.clarification.acceptsYesNo),\n    };\n',
              '    next.conversationMemory.pendingQuestion = {\n      type: "question",\n      actionId: result.clarification.actionId,\n      field: result.clarification.field,\n      question: result.clarification.question,\n      acceptsYesNo: Boolean(result.clarification.acceptsYesNo),\n      resumeAction: ["generate_outfit", "edit_outfit"].includes(result.clarification.resumeAction) ?\n        result.clarification.resumeAction : null,\n    };\n')

          replace_once(engine,
              'function validateAnswerEnvelopeV2(envelope) {\n  if (envelope?.kind !== "final" || !envelope.result) {\n    throw new RepairableStructuralTurnError("one-brain answer stage must return one final result");\n  }\n  if (envelope.result.action === "clarify") {\n    throw new RepairableStructuralTurnError("one-brain answer stage cannot start another questionnaire round");\n  }\n}\n',
              'function validateAnswerEnvelopeV2(envelope, {requiredAction = null} = {}) {\n  if (envelope?.kind !== "final" || !envelope.result) {\n    throw new RepairableStructuralTurnError("one-brain answer stage must return one final result");\n  }\n  if (envelope.result.action === "clarify") {\n    throw new RepairableStructuralTurnError("one-brain answer stage cannot start another questionnaire round");\n  }\n  if (requiredAction && envelope.result.action !== requiredAction) {\n    throw new RepairableStructuralTurnError(`one-brain answer must complete pending continuation with ${requiredAction}`);\n  }\n}\n')

          replace_once(engine,
              'function broadLocationClarificationDecisionV2(locationRequest, toolResults) {\n',
              'function broadLocationClarificationDecisionV2(locationRequest, toolResults, resumeAction = null) {\n')

          replace_once(engine,
              '      actionId: `clarify_${targetField}_narrow`,\n      acceptsYesNo: false,\n',
              '      actionId: `clarify_${targetField}_narrow`,\n      acceptsYesNo: false,\n      resumeAction: ["generate_outfit", "edit_outfit"].includes(resumeAction) ? resumeAction : null,\n')

          replace_once(engine,
              '                  {tool: "location", query: explicitDestination.query, targetField: field},\n                  {resolvedLocations: [{targetField: field, location: resolvedExplicitDestination}]},\n                ),\n',
              '                  {tool: "location", query: explicitDestination.query, targetField: field},\n                  {resolvedLocations: [{targetField: field, location: resolvedExplicitDestination}]},\n                  explicitDestination.resumeAction,\n                ),\n')

          replace_once(engine,
              '      pendingReplyRequired: Boolean(pendingQuestionAtBrain),\n      pendingReplyField: pendingQuestionAtBrain?.field || null,\n      forcedClarificationField: forcedBroadClarification?.field || null,\n',
              '      pendingReplyRequired: Boolean(pendingQuestionAtBrain),\n      pendingReplyField: pendingQuestionAtBrain?.field || null,\n      pendingResumeAction: pendingQuestionAtBrain?.resumeAction || null,\n      forcedClarificationField: forcedBroadClarification?.field || null,\n')

          replace_once(engine,
              '      const answerConstraints = {\n        ...runtimeConstraints,\n        modelCallsRemaining: 1,\n        allowClarification: false,\n        cannotClarifyFields: cannotClarifyFieldsV2(workingState),\n      };\n      const answerEnvelope = await callBrainV2(stylistBrain,\n        brainInputV2(request, workingState, "answer", executed.toolResults, answerConstraints));\n      validateAnswerEnvelopeV2(answerEnvelope);\n',
              '      const terrain = workingState.context.terrain || {};\n      const explicitSafetyTerrain = ["wet", "muddy", "snow", "ice"].includes(terrain.condition) ||\n        ["steep", "technical"].includes(terrain.difficulty) || terrain.surface === "rock";\n      const requiredAnswerAction = runtimeConstraints.pendingResumeAction === "generate_outfit" &&\n        !explicitSafetyTerrain && Array.isArray(executed.toolResults.wardrobeItems) &&\n        executed.toolResults.wardrobeItems.length > 0 ? "generate_outfit" :\n        runtimeConstraints.pendingResumeAction === "edit_outfit" &&\n        executed.toolResults.authorizedEditScope && Array.isArray(executed.toolResults.wardrobeItems) &&\n        executed.toolResults.wardrobeItems.length > 0 ? "edit_outfit" : null;\n      const answerConstraints = {\n        ...runtimeConstraints,\n        modelCallsRemaining: 1,\n        allowClarification: false,\n        cannotClarifyFields: cannotClarifyFieldsV2(workingState),\n        requiredAnswerAction,\n      };\n      const answerEnvelope = await callBrainV2(stylistBrain,\n        brainInputV2(request, workingState, "answer", executed.toolResults, answerConstraints));\n      validateAnswerEnvelopeV2(answerEnvelope, {requiredAction: requiredAnswerAction});\n')

          replace_once(model,
              'function schemaForStageV2(stage, allowClarification) {\n  const schema = clone(stage === "answer" ? FINAL_SCHEMA : PLAN_SCHEMA);\n',
              'function schemaForStageV2(stage, allowClarification, requiredAnswerAction = null) {\n  const schema = clone(stage === "answer" ? FINAL_SCHEMA : PLAN_SCHEMA);\n')

          replace_once(model,
              '  if (allowClarification !== false) return schema;\n  const action = schema?.properties?.action;\n  if (Array.isArray(action?.enum)) {\n    action.enum = action.enum.filter((value) => value !== "clarify");\n  }\n  return schema;\n}\n',
              '  const action = schema?.properties?.action;\n  if (allowClarification === false && Array.isArray(action?.enum)) {\n    action.enum = action.enum.filter((value) => value !== "clarify");\n  }\n  if (stage === "answer" && ["generate_outfit", "edit_outfit"].includes(requiredAnswerAction) &&\n      Array.isArray(action?.enum) && action.enum.includes(requiredAnswerAction)) {\n    action.enum = [requiredAnswerAction];\n  }\n  return schema;\n}\n')

          replace_once(model,
              '    "Ak runtimeConstraints.structuralRepair existuje, predchádzajúci TOOL-DECISION výstup porušil uvedený štrukturálny kontrakt. Oprav presne túto chybu, zachovaj zámer používateľa a session fakty a neotváraj novú otázku navyše.",\n',
              '    "Ak runtimeConstraints.structuralRepair existuje, predchádzajúci TOOL-DECISION výstup porušil uvedený štrukturálny kontrakt. Oprav presne túto chybu, zachovaj zámer používateľa a session fakty a neotváraj novú otázku navyše.",\n    "Ak runtimeConstraints.requiredAnswerAction je generate_outfit alebo edit_outfit, odpovedáš už po jedinej potrebnej clarification a MUSÍŠ dokončiť pôvodnú požiadavku touto akciou. Obyčajný chat alebo stop nie je platné dokončenie.",\n')

          replace_once(model,
              '    "Ak ideálny kus chýba a nejde o objektívny safety hard-stop, dokonči najlepší dostupný outfit, označ kompromis a môžeš ponúknuť shopping.",\n',
              '    "Ak ideálny kus chýba a nejde o objektívny safety hard-stop, dokonči najlepší dostupný outfit, označ kompromis a môžeš ponúknuť shopping.",\n    "Pri bežnej turistike bez explicitne mokrého, blatistého, zasneženého, ľadového, skalnatého, strmého alebo technického terénu NIE JE absencia turistických topánok safety hard-stop. Vyber najpraktickejšie dostupné tenisky ako otvorene pomenovaný kompromis a ponúkni doplnenie turistickej obuvi namiesto odmietnutia outfitu.",\n')

          replace_once(model,
              '      const schema = schemaForStageV2(stage, allowClarification);\n',
              '      const schema = schemaForStageV2(\n        stage,\n        allowClarification,\n        input?.runtimeConstraints?.requiredAnswerAction || null,\n      );\n')

          replace_once(tests,
              '      clarification: {field: "destination", question: "Kam približne ideš?", actionId: "clarify_destination"},\n',
              '      clarification: {\n        field: "destination", question: "Kam približne ideš?", actionId: "clarify_destination",\n        resumeAction: "generate_outfit",\n      },\n')

          replace_once(tests,
              '  assert.equal(calls.weather || 0, 0);\n  assert.equal(calls.brainInputs.length, 1, "Brain parses the original scenario once; runtime still owns the deterministic broad-country clarification");\n});\n',
              '  assert.equal(calls.weather || 0, 0);\n  assert.equal(calls.brainInputs.length, 1, "Brain parses the original scenario once; runtime still owns the deterministic broad-country clarification");\n  const stored = await repository.get({uid: "u_country", chatId: "chat_country_hike"});\n  assert.equal(stored.state.conversationMemory.pendingQuestion.resumeAction, "generate_outfit");\n});\n')

          replace_once(tests,
              '  assert.equal(calls.brainInputs[1].runtimeConstraints.pendingReplyRequired, true);\n  assert.equal(calls.brainInputs[2].runtimeConstraints.allowClarification, false);\n});\n\ntest("One Brain model contract classifies pending replies and uses Terra medium", async () => {\n',
              '  assert.equal(calls.brainInputs[1].runtimeConstraints.pendingReplyRequired, true);\n  assert.equal(calls.brainInputs[2].runtimeConstraints.allowClarification, false);\n  assert.equal(calls.brainInputs[2].runtimeConstraints.requiredAnswerAction, "generate_outfit");\n});\n\ntest("One Brain model contract classifies pending replies and uses Terra medium", async () => {\n')

          replace_once(tests,
              '  assert.equal(envelope.pendingReplyDisposition, "unrelated");\n});\n\ntest("shopping need is the authoritative CTA signal even if offerShopping is false", () => {\n',
              '  assert.equal(envelope.pendingReplyDisposition, "unrelated");\n\n  await brain.brainTurn({\n    stage: "answer",\n    request: {chatId: "c", turnId: "t2", latestUserInput: "do Alp", explicitUiActionId: null, clientCapabilities: {}},\n    session: {\n      context: {terrain: {surface: null, difficulty: null, condition: null}},\n      currentOutfit: {itemIds: [], selectionReasonsByItemId: {}},\n      conversationMemory: {},\n    },\n    toolResults: {wardrobeItems: wardrobeItems(), authorizedEditScope: null},\n    runtimeConstraints: {allowClarification: false, requiredAnswerAction: "generate_outfit"},\n  });\n  assert.deepEqual(specs[1].schema.properties.action.enum, ["generate_outfit"]);\n  assert.match(specs[1].messages[0].content, /MUSÍŠ dokončiť pôvodnú požiadavku/);\n  assert.match(specs[1].messages[0].content, /absencia turistických topánok safety hard-stop/);\n});\n\ntest("shopping need is the authoritative CTA signal even if offerShopping is false", () => {\n')
          PY

      - name: Run focused Stylist regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test functions/stylist/v2/stylist_one_brain_runtime_v2.test.js
          git diff --check

      - name: Remove temporary workflows and commit product patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp-pending-answer-outfit-fix.yml
          rm -f .github/workflows/_tmp-pending-answer-outfit-fix-v2.yml
          rm -f .github/workflows/_tmp-pending-answer-outfit-fix-v3.yml
          git diff --check
          git config user.name "lerry555"
          git config user.email "132705754+lerry555@users.noreply.github.com"
          git add -A .github/workflows \
                     functions/stylist/v2/stylist_one_brain_engine_v2.js \
                     functions/stylist/v2/openai_one_brain_model_port_v2.js \
                     functions/stylist/v2/stylist_one_brain_runtime_v2.test.js
          git commit -m "fix: resume outfit generation after location clarification"
          git push origin HEAD:fix/stylist-pending-answer-outfit-20260913
