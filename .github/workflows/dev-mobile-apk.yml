name: Android DEV preview APK

on:
  push:
    branches:
      - experiment/dev-mobile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: true
      - name: Isolate DEV Android package and disable production Firebase configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          source = path.read_text()
          assert 'id("com.google.gms.google-services")' in source
          assert 'applicationId = "com.krist.outfitoftheday"' in source
          source = source.replace('    id("com.google.gms.google-services")\n', '')
          source = source.replace(
              'applicationId = "com.krist.outfitoftheday"',
              'applicationId = "com.krist.outfitoftheday.devpreview"'
          )
          path.write_text(source)
          # A DEV preview must never bundle the production google-services.json.
          Path('android/app/google-services.json').unlink(missing_ok=True)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Build offline DEV APK
        run: flutter build apk --debug --target lib/main_dev.dart
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: outfit-of-the-day-dev-preview-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
