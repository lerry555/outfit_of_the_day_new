name: Patch V2 acceptance expectation

on:
  push:
    branches:
      - fix/v2-chat-ux-latency-images-20260909
    paths:
      - '.github/workflows/patch-v2-acceptance-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2-chat-ux-latency-images-20260909
          fetch-depth: 0
      - name: Update deferred-weather acceptance expectation
        shell: python
        run: |
          from pathlib import Path
          path = Path('functions/stylist/v2/stylist_v2_phase0_acceptance.test.js')
          text = path.read_text(encoding='utf-8')
          old = '''  const weatherCalls = h.ledger.calls("weather", "getForecast");
          assert.equal(weatherCalls.length, 1);
          assert.equal(weatherCalls[0].args.location.providerId, "place:tatras");

          const third = await reopened.resolveTurn(request("chat-a", "a-3", 2, "Ľahká trasa."));
          assert.equal(third.action, "generate_outfit");
          assert.deepEqual(third.display.itemIds, third.resultingOutfit.itemIds);'''
          new = '''  let weatherCalls = h.ledger.calls("weather", "getForecast");
          // Do not spend a weather call while another material clarification is
          // still pending. The forecast is fetched only on the turn that can
          // actually proceed to final outfit selection.
          assert.equal(weatherCalls.length, 0);

          const third = await reopened.resolveTurn(request("chat-a", "a-3", 2, "Ľahká trasa."));
          assert.equal(third.action, "generate_outfit");
          assert.deepEqual(third.display.itemIds, third.resultingOutfit.itemIds);
          weatherCalls = h.ledger.calls("weather", "getForecast");
          assert.equal(weatherCalls.length, 1);
          assert.equal(weatherCalls[0].args.location.providerId, "place:tatras");'''
          if old not in text:
              raise SystemExit('expected acceptance block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/stylist/v2/stylist_v2_phase0_acceptance.test.js
          git commit -m "test: defer weather until final hiking turn"
          git push origin HEAD:fix/v2-chat-ux-latency-images-20260909
