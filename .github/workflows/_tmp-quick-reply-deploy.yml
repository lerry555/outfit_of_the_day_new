name: Stylist quick replies approved deployment

on:
  push:
    branches: [stylist-simple-agent]
    paths: [.github/workflows/_tmp-quick-reply-deploy.yml]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/stylist-cost-controls-ci.yml
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/stylist-simple-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard approved branch and protected baselines
        run: |
          git fetch origin stylist-simple-agent brain-v1-experiment master
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/stylist-simple-agent)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/master)" = "00bd52fa20f1e5b281d66850758c465dc2b00098"
          git merge-base --is-ancestor f6f1f5610e84b3bde5d6d1eac236ce43baba1e6b HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build source-of-truth artifacts required by function discovery
        run: |
          flutter pub get
          flutter test test/backend_clothing_kb_prior_artifact_export_test.dart --dart-define=UPDATE_CLOTHING_KB_PRIOR_ARTIFACT=true
          node functions/scripts/generate_deploy_taxonomy_artifacts.js
      - name: Install Function dependencies
        working-directory: functions
        run: npm ci --no-audit --no-fund
      - name: Authenticate with the existing project deployment identity
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Expose only the owner-approved stylist callable
        run: |
          cp functions/index.js functions/index.full.js
          cp functions/index.quick_reply_deploy.js functions/index.js
      - name: Recheck all three refs immediately before deployment
        run: |
          git fetch origin stylist-simple-agent brain-v1-experiment master
          test "$(git rev-parse origin/stylist-simple-agent)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/master)" = "00bd52fa20f1e5b281d66850758c465dc2b00098"
      - name: Deploy only stylistSimpleAgentV1
        run: npx --yes firebase-tools@14.22.0 deploy --only functions:stylistSimpleAgentV1 --project outfitoftheday-4d401 --non-interactive
      - name: Live quick-reply acceptance
        env:
          STYLIST_QA_UID: ZYag22IU3sbQOQEa9kTAbkaeSqb2
          STYLIST_QA_CURRENT_IDS: '["ArmAaE4A1gdAi2LZCIu4","uwgZnR7YOFZAxqk55FlJ","9ajGS1WO9jtRvCXKScLF","GqhLKcWpQAfaGgiGGhAl"]'
        run: node functions/stylist/simple_stylist_agent_live_smoke_v1.js --live --quick-replies
      - name: Live existing conversation regression
        env:
          STYLIST_QA_UID: ZYag22IU3sbQOQEa9kTAbkaeSqb2
          STYLIST_QA_CURRENT_IDS: '["ArmAaE4A1gdAi2LZCIu4","uwgZnR7YOFZAxqk55FlJ","9ajGS1WO9jtRvCXKScLF","GqhLKcWpQAfaGgiGGhAl"]'
        run: node functions/stylist/simple_stylist_agent_live_smoke_v1.js --live --conversation
      - name: Sanitized failure diagnostics
        if: failure()
        run: >-
          gcloud logging read 'resource.type="cloud_function" AND resource.labels.function_name="stylistSimpleAgentV1" AND jsonPayload.stage="callable"'
          --project outfitoftheday-4d401 --freshness=15m --limit=3
          --format='json(jsonPayload.code,jsonPayload.providerStatus,jsonPayload.providerErrorType,jsonPayload.providerErrorCode,jsonPayload.providerResponseStatus,jsonPayload.providerIncompleteReason,jsonPayload.validationErrors)'
