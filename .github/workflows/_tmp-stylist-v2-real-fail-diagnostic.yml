name: Stylist V2 real fail diagnostic

on:
  push:
    branches:
      - diagnostic/stylist-v2-real-followup-20260912
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Authenticate Firebase
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Fetch recent stylistChatV2 logs
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:log --only stylistChatV2 --project outfitoftheday-4d401 --lines 200 2>&1 | \
            grep -E 'STYLIST_V2_ONE_BRAIN_FAIL_CLOSED|STYLIST_V2_ONE_BRAIN_MODEL_LATENCY|STYLIST_V2_TURN_LATENCY|SESSION_|Repairable|Stale|stylistChatV2' | tail -n 160
