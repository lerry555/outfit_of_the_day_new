name: Stylist V2 real fail diagnostic

on:
  push:
    branches:
      - diagnostic/stylist-v2-real-followup-20260912
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: outfitoftheday-4d401

      - name: Fetch recent stylistChatV2 structured logs
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="stylistchatv2" AND timestamp>="2026-09-12T12:00:00Z"' \
            --project=outfitoftheday-4d401 \
            --limit=300 \
            --order=desc \
            --format=json > "$RUNNER_TEMP/stylist-logs.json"

          python - <<'PY'
          import json, os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'stylist-logs.json')
          data = json.load(open(path, encoding='utf-8'))
          needles = (
              'STYLIST_V2_ONE_BRAIN_FAIL_CLOSED',
              'STYLIST_V2_ONE_BRAIN_MODEL_LATENCY',
              'STYLIST_V2_TURN_LATENCY',
              'SESSION_',
              'Repairable',
              'Stale',
          )
          matched = 0
          for entry in reversed(data):
              text = json.dumps(entry, ensure_ascii=False, sort_keys=True)
              if any(n in text for n in needles):
                  print(text)
                  matched += 1
          print(f'DIAGNOSTIC_MATCHED={matched}')
          if matched == 0:
              print('NO_MATCHING_STYLIST_DIAGNOSTIC_LOGS')
          PY
