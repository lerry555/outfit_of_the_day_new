name: Stylist V2 real fail diagnostic

on:
  push:
    branches:
      - diagnostic/stylist-v2-real-followup-20260912
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: outfitoftheday-4d401

      - name: Describe deployed Stylist function
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions describe stylistChatV2 \
            --gen2 --region=us-east1 --project=outfitoftheday-4d401 \
            --format='value(name,state,serviceConfig.service,serviceConfig.uri)' || true

      - name: Fetch real fail-closed entries
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read \
            '"STYLIST_V2_ONE_BRAIN_FAIL_CLOSED" AND timestamp>="2026-09-12T12:40:00Z"' \
            --project=outfitoftheday-4d401 \
            --limit=50 --order=asc --format=json > "$RUNNER_TEMP/fails.json"

          python - <<'PY'
          import json, os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'fails.json')
          data = json.load(open(path, encoding='utf-8'))
          print(f'FAIL_ENTRY_COUNT={len(data)}')
          for e in data:
              jp = e.get('jsonPayload') or {}
              tp = e.get('textPayload') or ''
              labels = (e.get('resource') or {}).get('labels') or {}
              print(json.dumps({
                  'timestamp': e.get('timestamp'),
                  'message': jp.get('message') or tp,
                  'code': jp.get('code'),
                  'error': jp.get('error'),
                  'service_name': labels.get('service_name'),
                  'function_name': labels.get('function_name'),
                  'revision_name': labels.get('revision_name'),
              }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Fetch nearby One-Brain latency markers
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read \
            '"STYLIST_V2_ONE_BRAIN_MODEL_LATENCY" AND timestamp>="2026-09-12T12:40:00Z"' \
            --project=outfitoftheday-4d401 \
            --limit=80 --order=asc --format='value(timestamp,jsonPayload.stage,jsonPayload.durationMs,jsonPayload.model,jsonPayload.message,textPayload)' || true
