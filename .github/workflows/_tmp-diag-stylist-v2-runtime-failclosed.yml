name: Diagnose Stylist V2 runtime fail-closed

on:
  push:
    branches:
      - diag-stylist-v2-runtime-failclosed-20260909
    paths:
      - .github/workflows/_tmp-diag-stylist-v2-runtime-failclosed.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin diag-stylist-v2-runtime-failclosed-20260909 stylist-simple-agent brain-v1-experiment
          test "$GITHUB_REF_NAME" = "diag-stylist-v2-runtime-failclosed-20260909"
          test "$(git rev-parse origin/stylist-simple-agent)" = "b801cb220b63ce19542c34d5cef0c3e55b961107"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          changed="$(git diff --name-only origin/stylist-simple-agent HEAD)"
          test "$changed" = ".github/workflows/_tmp-diag-stylist-v2-runtime-failclosed.yml"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: outfitoftheday-4d401

      - name: Read only sanitized Stylist fail-closed diagnostics
        shell: bash
        run: |
          set -euo pipefail
          FILTER='resource.type="cloud_function" AND resource.labels.function_name="stylistChatV2" AND timestamp>="2026-09-09T14:15:00Z" AND timestamp<="2026-09-09T14:18:30Z" AND (jsonPayload.message="STYLIST_V2_FAIL_CLOSED" OR textPayload:"STYLIST_V2_FAIL_CLOSED")'
          gcloud logging read "$FILTER" --project outfitoftheday-4d401 --limit=20 --order=asc --format=json > /tmp/stylist_failclosed.json
          node <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/stylist_failclosed.json', 'utf8') || '[]');
          console.log(`DIAG_MATCHES=${rows.length}`);
          for (const row of rows) {
            const jp = row.jsonPayload && typeof row.jsonPayload === 'object' ? row.jsonPayload : {};
            let code = typeof jp.code === 'string' ? jp.code : '';
            if (!code && typeof row.textPayload === 'string') {
              const m = row.textPayload.match(/code\s*[:=]\s*['\"]?([A-Za-z0-9_.:-]+)/i);
              if (m) code = m[1];
            }
            code = String(code || 'NO_CODE').replace(/[^A-Za-z0-9_.:-]/g, '_').slice(0, 120);
            const keys = Object.keys(jp).sort().join(',').slice(0, 300);
            console.log(`DIAG timestamp=${row.timestamp || 'unknown'} severity=${row.severity || 'unknown'} code=${code} jsonKeys=${keys || 'none'}`);
          }
          NODE
