name: One-Brain bridge diagnostic

on:
  push:
    branches:
      - refactor/stylist-v2-one-brain-20260910

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        working-directory: functions
        run: npm ci --ignore-scripts
      - name: Reproduce production bridge fail-closed
        run: |
          node <<'NODE'
          const {createMemoryStylistSessionRepositoryV2} = require('./functions/stylist/v2/stylist_session_repository_v2');
          const {createStylistChatV2Handler} = require('./functions/stylist/v2/stylist_production_bridge_one_brain_v2');
          const NOW = Date.parse('2026-09-10T08:00:00.000Z');
          const repository = createMemoryStylistSessionRepositoryV2({now: () => NOW});
          let brainCalls = 0;
          const warnings = [];
          const handler = createStylistChatV2Handler({
            db: {},
            admin: {},
            logger: {
              warn(event, payload) { warnings.push({event, payload}); console.log('WARN', event, JSON.stringify(payload)); },
              info(event, payload) { console.log('INFO', event, JSON.stringify(payload)); },
            },
            resolveOpenAISecret: async () => 'unused',
            clock: () => NOW,
            sessionRepository: repository,
            brainFactory: () => ({
              async brainTurn(input) {
                brainCalls += 1;
                console.log('BRAIN_STAGE', input.stage);
                return {
                  kind: 'final',
                  statePatch: {},
                  result: {
                    action: 'chat',
                    assistantText: 'K modrej sa hodí biela, sivá aj béžová.',
                    display: {kind: 'none', itemIds: []},
                  },
                };
              },
            }),
            wardrobeToolFactory: () => ({
              async retrieve() { throw new Error('wardrobe_must_not_run'); },
              async materialize(ids, reasons) { console.log('MATERIALIZE', JSON.stringify({ids, reasons})); return []; },
            }),
            locationResolver: {async resolve() { throw new Error('location_must_not_run'); }},
            weatherTool: {async getForecast() { throw new Error('weather_must_not_run'); }},
            shoppingToolFactory: () => ({async search() { throw new Error('shopping_must_not_run'); }}),
          });
          (async () => {
            const response = await handler({
              v2SessionId: 'one_brain_chat',
              turnId: 'one_1',
              message: 'Aké farby sa hodia k modrej?',
              history: [],
              currentOutfitItemIds: [],
              currentSelectionReasons: [],
              shoppingEnabled: false,
              clientContext: {},
            }, {auth: {uid: 'u4'}});
            console.log('RESPONSE', JSON.stringify(response));
            console.log('BRAIN_CALLS', brainCalls);
            console.log('WARNINGS', JSON.stringify(warnings));
            console.log('REPOSITORY', JSON.stringify(repository.dump()));
          })().catch((error) => {
            console.error('UNCAUGHT', error && error.stack || error);
            process.exitCode = 1;
          });
          NODE
