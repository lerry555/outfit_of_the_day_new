name: Brain V1 quality patch runner

on:
  push:
    branches:
      - brain-v1-experiment
    paths:
      - .github/workflows/_tmp-brain-v1-quality-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: brain-v1-experiment
          fetch-depth: 0

      - name: Apply guarded patch
        run: python scripts/_tmp_brain_quality_patch.py

      - name: Verify diff
        run: git diff --check

      - name: Commit patch
        run: |
          git config user.name "lerry555"
          git config user.email "132705754+lerry555@users.noreply.github.com"
          git add lib functions/stylist test
          git commit -m "fix: polish local weather and outfit quality"
          git push origin HEAD:brain-v1-experiment
