name: Patch Stylist trusted explicit location once

on:
  push:
    branches:
      - stylist-simple-agent
    paths:
      - .github/workflows/patch-stylist-trusted-location-once.yml

permissions:
  contents: write

jobs:
  patch-fix-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard refs and checkout fix branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            stylist-simple-agent \
            brain-v1-experiment \
            hardening/stylist-deterministic-shell-20260913 \
            fix/stylist-trusted-explicit-location-through-tools-20260915
          test "$(git rev-parse origin/stylist-simple-agent)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/hardening/stylist-deterministic-shell-20260913)" = "035a65f45b782bf4cac023e3ff960f1fb1113bcf"
          test "$(git rev-parse origin/fix/stylist-trusted-explicit-location-through-tools-20260915)" = "8fc4ef315beb177eb07c150fac69c40c3d4edb2b"
          git checkout -B fix/stylist-trusted-explicit-location-through-tools-20260915 origin/fix/stylist-trusted-explicit-location-through-tools-20260915

      - name: Patch engine deterministically
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'functions/stylist/v2/stylist_one_brain_engine_v2.js';
          let source = fs.readFileSync(path, 'utf8');

          function replaceOnce(needle, replacement, label) {
            const first = source.indexOf(needle);
            if (first < 0 || source.indexOf(needle, first + needle.length) >= 0) {
              throw new Error(`expected exactly one ${label}`);
            }
            source = source.replace(needle, replacement);
          }
          function replaceLast(needle, replacement, label) {
            const index = source.lastIndexOf(needle);
            if (index < 0) throw new Error(`missing ${label}`);
            source = source.slice(0, index) + replacement + source.slice(index + needle.length);
          }

          replaceOnce(
            '  return next;\n}\n\nfunction semanticLocationFallbackV2(query, targetField) {',
            `  return next;\n}\n\nfunction restoreTrustedExplicitLocationV2(state, trustedExplicitLocation) {\n  const field = trustedExplicitLocation?.field;\n  const location = trustedExplicitLocation?.location;\n  const specific = ["destination", "eventLocation"].includes(field) && location &&\n    !locationIsTooBroadForWeatherV2(location) &&\n    Number.isFinite(Number(location.lat)) && Number.isFinite(Number(location.lng));\n  if (!specific) return state;\n\n  const next = clone(state);\n  next.context[field] = clone(location);\n  next.conversationMemory.answeredClarificationFields[field] = clone(location);\n\n  const candidateWeather = next.context.weather || trustedExplicitLocation?.weather || null;\n  const weatherMatches = candidateWeather &&\n    candidateWeather.locationProviderId === location.providerId &&\n    (!next.context.date || candidateWeather.dateKey === next.context.date.dateKey) &&\n    (!next.context.timeWindow || candidateWeather.timeWindowKey === next.context.timeWindow.key);\n  next.context.weather = weatherMatches ? clone(candidateWeather) : null;\n\n  if (next.context.date && next.context.timeWindow) {\n    next.context.groundingRequirements = {\n      ...(next.context.groundingRequirements || {}),\n      weatherRequired: true,\n      weatherLocationField: field,\n      terrainRequiredFields: [],\n    };\n  }\n  return next;\n}\n\nfunction semanticLocationFallbackV2(query, targetField) {`,
            'trusted explicit location helper',
          );

          replaceOnce(
            'async function executeRequestedToolsV2({envelope, state, wardrobeTool, locationResolver, weatherTool,\n  knownWardrobeItems = null}) {\n  let workingState = applyBrainStatePatchV2(state, envelope.statePatch);',
            'async function executeRequestedToolsV2({envelope, state, wardrobeTool, locationResolver, weatherTool,\n  knownWardrobeItems = null, trustedExplicitLocation = null}) {\n  let workingState = applyBrainStatePatchV2(state, envelope.statePatch);\n  workingState = restoreTrustedExplicitLocationV2(workingState, trustedExplicitLocation);',
            'executeRequestedToolsV2 signature',
          );

          replaceOnce(
            '      let forcedBroadClarification = null;\n      if (!pendingQuestionAtBrain && !bestEffortDirective) {',
            '      let forcedBroadClarification = null;\n      let trustedExplicitLocation = null;\n      if (!pendingQuestionAtBrain && !bestEffortDirective) {',
            'trusted explicit location variable',
          );

          replaceOnce(
            '            workingState.context[field] = clone(resolvedExplicitDestination);\n            workingState.conversationMemory.answeredClarificationFields[field] = clone(resolvedExplicitDestination);\n            if (locationIsTooBroadForWeatherV2(resolvedExplicitDestination)) {',
            '            workingState.context[field] = clone(resolvedExplicitDestination);\n            workingState.conversationMemory.answeredClarificationFields[field] = clone(resolvedExplicitDestination);\n            if (!locationIsTooBroadForWeatherV2(resolvedExplicitDestination) &&\n                Number.isFinite(Number(resolvedExplicitDestination.lat)) &&\n                Number.isFinite(Number(resolvedExplicitDestination.lng))) {\n              trustedExplicitLocation = {field, location: clone(resolvedExplicitDestination)};\n            }\n            if (locationIsTooBroadForWeatherV2(resolvedExplicitDestination)) {',
            'trusted explicit location capture',
          );

          replaceOnce(
            '    workingState = applyBrainStatePatchV2(workingState, effectiveToolEnvelope.statePatch);\n\n    if (effectiveToolEnvelope.kind === "final") {',
            '    workingState = applyBrainStatePatchV2(workingState, effectiveToolEnvelope.statePatch);\n    workingState = restoreTrustedExplicitLocationV2(workingState, trustedExplicitLocation);\n\n    if (effectiveToolEnvelope.kind === "final") {',
            'outer tool state restoration',
          );

          replaceOnce(
            '      const executed = await executeRequestedToolsV2({\n        envelope: effectiveToolEnvelope,\n        state: workingState,\n        wardrobeTool,\n        locationResolver,\n        weatherTool,\n      knownWardrobeItems,\n    });',
            '      const executed = await executeRequestedToolsV2({\n        envelope: effectiveToolEnvelope,\n        state: workingState,\n        wardrobeTool,\n        locationResolver,\n        weatherTool,\n        knownWardrobeItems,\n        trustedExplicitLocation,\n      });',
            'effective tool execution',
          );

          replaceOnce(
            '      workingState = executed.workingState;\n      const broadLocationRequest = effectiveToolEnvelope.requests.find((entry) => entry?.tool === "location");',
            '      workingState = executed.workingState;\n      if (trustedExplicitLocation && workingState.context.weather) {\n        trustedExplicitLocation = {\n          ...trustedExplicitLocation,\n          weather: clone(workingState.context.weather),\n        };\n      }\n      const broadLocationRequest = effectiveToolEnvelope.requests.find((entry) => entry?.tool === "location");',
            'trusted weather capture',
          );

          replaceLast(
            '      workingState = applyBrainStatePatchV2(workingState, answerEnvelope.statePatch);',
            '      workingState = applyBrainStatePatchV2(workingState, answerEnvelope.statePatch);\n      workingState = restoreTrustedExplicitLocationV2(workingState, trustedExplicitLocation);',
            'answer-stage trusted restoration',
          );

          replaceOnce(
            '  restoreTrustedBroadLocationV2,\n  selectKnownWardrobeV2,',
            '  restoreTrustedBroadLocationV2,\n  restoreTrustedExplicitLocationV2,\n  selectKnownWardrobeV2,',
            'trusted helper export',
          );

          fs.writeFileSync(path, source);
          NODE
          node --check functions/stylist/v2/stylist_one_brain_engine_v2.js
          grep -q 'restoreTrustedExplicitLocationV2' functions/stylist/v2/stylist_one_brain_engine_v2.js
          grep -q 'trustedExplicitLocation = {field, location' functions/stylist/v2/stylist_one_brain_engine_v2.js

      - name: Add exact regression
        shell: bash
        run: |
          set -euo pipefail
          cat > functions/stylist/v2/stylist_trusted_explicit_location_tools_v2.test.js <<'TEST'
          "use strict";

          const assert = require("node:assert/strict");
          const test = require("node:test");
          const {clone, createEmptySessionStateV2} = require("./stylist_session_state_v2");
          const {
            executeRequestedToolsV2,
            restoreTrustedExplicitLocationV2,
          } = require("./stylist_one_brain_engine_v2");

          const lyon = Object.freeze({
            providerId: "openmeteo:lyon",
            label: "Lyon, Auvergne-Rhône-Alpes, Francúzsko",
            lat: 45.74846,
            lng: 4.84671,
            source: "open-meteo-geocoding",
            granularity: "locality",
            countryCode: "FR",
          });

          function weddingState() {
            const state = clone(createEmptySessionStateV2("trusted-lyon"));
            state.context.eventLocation = clone(lyon);
            state.context.date = {dateKey: "2026-09-16", source: "deterministic_user_text"};
            state.context.timeWindow = {key: "day", label: "cez deň", source: "one_brain_default"};
            state.conversationMemory.answeredClarificationFields.eventLocation = clone(lyon);
            return state;
          }

          function newScenarioEnvelope() {
            return {
              kind: "tool_request",
              pendingReplyDisposition: "none",
              statePatch: {
                scenarioMode: "new",
                context: {
                  activity: {id: "wedding", label: "svadba", source: "user"},
                  date: {dateKey: "2026-09-16", source: "deterministic_user_text"},
                  timeWindow: {key: "day", label: "cez deň", source: "one_brain_default"},
                },
              },
              requests: [{tool: "wardrobe", scope: "full_relevant", category: null, editScope: null}],
            };
          }

          test("current-turn deterministic Lyon survives scenarioMode new and grounds weather", async () => {
            const weatherCalls = [];
            const executed = await executeRequestedToolsV2({
              envelope: newScenarioEnvelope(),
              state: weddingState(),
              wardrobeTool: {async retrieve() { throw new Error("preloaded wardrobe expected"); }},
              locationResolver: {async resolve() { throw new Error("location must not be re-geocoded"); }},
              weatherTool: {
                async getForecast({location, date, timeWindow}) {
                  weatherCalls.push({location: clone(location), date: clone(date), timeWindow: clone(timeWindow)});
                  return {
                    locationProviderId: location.providerId,
                    dateKey: date.dateKey,
                    timeWindowKey: timeWindow.key,
                    fetchedAt: "2026-09-15T18:00:00.000Z",
                    source: "test-weather",
                    snapshot: {representativeTempC: 18, minTempC: 13, maxTempC: 21},
                  };
                },
              },
              knownWardrobeItems: [{id: "blazer"}],
              trustedExplicitLocation: {field: "eventLocation", location: clone(lyon)},
            });

            assert.equal(executed.workingState.context.eventLocation.providerId, lyon.providerId);
            assert.match(executed.workingState.context.eventLocation.label, /Lyon/);
            assert.equal(executed.workingState.context.groundingRequirements.weatherRequired, true);
            assert.equal(executed.workingState.context.groundingRequirements.weatherLocationField, "eventLocation");
            assert.equal(executed.toolResults.weatherStatus, "resolved");
            assert.equal(executed.workingState.context.weather.locationProviderId, lyon.providerId);
            assert.equal(weatherCalls.length, 1);
            assert.equal(weatherCalls[0].location.countryCode, "FR");
          });

          test("scenarioMode new still clears a stale location when there is no current-turn trusted marker", async () => {
            let weatherCalls = 0;
            const executed = await executeRequestedToolsV2({
              envelope: newScenarioEnvelope(),
              state: weddingState(),
              wardrobeTool: {async retrieve() { throw new Error("preloaded wardrobe expected"); }},
              locationResolver: {async resolve() { throw new Error("no location request expected"); }},
              weatherTool: {async getForecast() { weatherCalls += 1; throw new Error("weather must not run"); }},
              knownWardrobeItems: [{id: "blazer"}],
            });

            assert.equal(executed.workingState.context.eventLocation, null);
            assert.equal(executed.workingState.context.weather, null);
            assert.equal(executed.toolResults.weatherStatus, "not_requested");
            assert.equal(weatherCalls, 0);
          });

          test("trusted weather is restored only when it still matches the trusted location/date/window", () => {
            const state = clone(createEmptySessionStateV2("trusted-weather"));
            state.context.date = {dateKey: "2026-09-16", source: "deterministic_user_text"};
            state.context.timeWindow = {key: "day", label: "cez deň", source: "one_brain_default"};
            const weather = {
              locationProviderId: lyon.providerId,
              dateKey: "2026-09-16",
              timeWindowKey: "day",
              fetchedAt: "2026-09-15T18:00:00.000Z",
              source: "test-weather",
              snapshot: {representativeTempC: 18},
            };
            const restored = restoreTrustedExplicitLocationV2(state, {
              field: "eventLocation",
              location: clone(lyon),
              weather,
            });
            assert.equal(restored.context.weather.locationProviderId, lyon.providerId);
            assert.equal(restored.context.groundingRequirements.weatherLocationField, "eventLocation");
          });
          TEST
          node --check functions/stylist/v2/stylist_trusted_explicit_location_tools_v2.test.js
          node --test functions/stylist/v2/stylist_trusted_explicit_location_tools_v2.test.js

      - name: Commit and push fix branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/hardening/stylist-deterministic-shell-20260913)" = "035a65f45b782bf4cac023e3ff960f1fb1113bcf"
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/stylist/v2/stylist_one_brain_engine_v2.js functions/stylist/v2/stylist_trusted_explicit_location_tools_v2.test.js
          git commit -m "fix: preserve current-turn explicit location through tool reset"
          git push origin HEAD:fix/stylist-trusted-explicit-location-through-tools-20260915
