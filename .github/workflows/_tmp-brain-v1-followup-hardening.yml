name: Brain V1 follow-up hardening one-shot

on:
  push:
    branches:
      - brain-v1-experiment
    paths:
      - .github/workflows/_tmp-brain-v1-followup-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: brain-v1-experiment
          fetch-depth: 0

      - name: Guard branch and master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin brain-v1-experiment master
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/brain-v1-experiment)"
          git merge-base --is-ancestor a84bfd07a68f4e28041dfd57e2b0954a2601d0c7 HEAD
          test "$(git rev-parse origin/master)" = "00bd52fa20f1e5b281d66850758c465dc2b00098"
          test -f tool/_tmp_brain_v1_followup_hardening.py

      - name: Apply guarded follow-up architecture patch
        run: python3 tool/_tmp_brain_v1_followup_hardening.py

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check functions/stylist/chat_prompts.js
          node --check functions/stylist/conversation_brain_v1.js
          node --check functions/stylist/frozen_stylist_authority_v1.js
          node --check functions/index.js
          grep -q "required_upper_layer" functions/stylist/chat_prompts.js
          grep -q "preserveCurrentOutfit" functions/index.js
          grep -q "locked_additive_layer" lib/Services/stylist_chat_outfit_service.dart
          grep -q "additive_layer_rejected" lib/screens/stylist_chat_screen.dart
          grep -q "loadRecentFullOutfitItemIdSets" lib/Services/stylist_chat_store.dart
          git status --short

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lerry555"
          git config user.email "132705754+lerry555@users.noreply.github.com"
          git add \
            functions/index.js \
            functions/stylist/chat_prompts.js \
            functions/stylist/chat_prompts.test.js \
            functions/stylist/conversation_brain_v1.js \
            functions/stylist/frozen_stylist_authority_v1.js \
            functions/stylist/frozen_stylist_authority_v1.test.js \
            lib/Services/stylist_chat_store.dart \
            lib/Services/stylist_chat_outfit_service.dart \
            lib/screens/stylist_chat_screen.dart \
            test/brain_v1_v2_offline_bundle_test.dart
          if git diff --cached --quiet; then
            echo "No product changes staged"
            exit 1
          fi
          git commit -m "fix: honor Stylist follow-up mutations and diversify outfits"
          git push origin HEAD:brain-v1-experiment
