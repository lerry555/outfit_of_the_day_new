name: Temporary Stylist smoke fixture patch

on:
  push:
    branches:
      - qa/stylist-v2-e2e-speed-polish-20260909
    paths:
      - .github/workflows/_tmp-stylist-candidate-smoke.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact candidate refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment qa/stylist-v2-e2e-speed-polish-20260909
          test "$(git rev-parse origin/stylist-simple-agent)" = "7acf9a1e2e033881025019829cb9d652c6df6c60"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/qa/stylist-v2-e2e-speed-polish-20260909)" = "$GITHUB_SHA"
          git merge-base --is-ancestor origin/stylist-simple-agent HEAD

      - name: Fix Slovak Tatier smoke fixture only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('functions/stylist/v2/stylist_live_smoke_v2.js')
          s = p.read_text()
          old = '''    locationResolver: {async resolve(query) {\n      return String(query || "").toLowerCase().includes("tatr") ?\n        {providerId: "live:tatry", label: "Vysoké Tatry", lat: 49.1667, lng: 20.1333,'''
          new = '''    locationResolver: {async resolve(query) {\n      const normalized = String(query || "").toLowerCase();\n      return (normalized.includes("tatr") || normalized.includes("tatier")) ?\n        {providerId: "live:tatry", label: "Vysoké Tatry", lat: 49.1667, lng: 20.1333,'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          node --check functions/stylist/v2/stylist_live_smoke_v2.js

      - name: Commit smoke fixture only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lerry555"
          git config user.email "132705754+lerry555@users.noreply.github.com"
          git add functions/stylist/v2/stylist_live_smoke_v2.js
          git diff --cached --check
          git commit -m "test: cover Slovak Tatier in live Stylist smoke"
          git push origin HEAD:qa/stylist-v2-e2e-speed-polish-20260909
