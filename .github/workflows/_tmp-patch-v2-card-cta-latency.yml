name: Patch V2 product cards CTA and latency

on:
  push:
    branches:
      - fix/v2-product-card-cta-latency-20260909
    paths:
      - '.github/workflows/_tmp-patch-v2-card-cta-latency.yml'
      - 'tool/patch_v2_card_cta_latency_temp.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2-product-card-cta-latency-20260909
          fetch-depth: 0

      - name: Guard exact source branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment fix/v2-product-card-cta-latency-20260909
          test "$(git rev-parse origin/stylist-simple-agent)" = "006c5aaca169d559b70ec7044de6c7b474c829e1"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          git merge-base --is-ancestor 006c5aaca169d559b70ec7044de6c7b474c829e1 HEAD

      - name: Align temporary patch with current CI file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tool/patch_v2_card_cta_latency_temp.py')
          s = p.read_text(encoding='utf-8')
          old = "      - 'firestore.rules' ''',"
          new = "      - 'firestore.rules'\n''',"
          if old not in s:
              raise SystemExit('temporary CI match guard not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply patch
        run: python tool/patch_v2_card_cta_latency_temp.py

      - name: Validate backend patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check functions/stylist/v2/firestore_wardrobe_tool_v2.js
          node --check functions/stylist/v2/openai_stylist_model_port_v2.js
          node --check functions/stylist/v2/stylist_production_bridge_v2.js
          node --test functions/stylist/v2/stylist_wardrobe_cache_v2.test.js
          node --test functions/stylist/v2/stylist_help_first_contract_v2.test.js
          node --test functions/stylist/v2/stylist_model_payload_efficiency_v2.test.js

      - name: Commit patch and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp-patch-v2-card-cta-latency.yml tool/patch_v2_card_cta_latency_temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: restore Stylist product cards CTA and reduce latency"
          git push origin HEAD:fix/v2-product-card-cta-latency-20260909
