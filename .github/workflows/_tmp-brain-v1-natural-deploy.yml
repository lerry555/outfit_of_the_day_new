name: Brain V1 natural Stylist deploy one-shot

on:
  push:
    branches:
      - brain-v1-experiment
    paths:
      - .github/workflows/_tmp-brain-v1-natural-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/brain-v1-experiment'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Verify experiment branch and master guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "brain-v1-experiment"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin master
          test "$(git rev-parse origin/master)" = "00bd52fa20f1e5b281d66850758c465dc2b00098"
          git merge-base --is-ancestor 32c763013838f777a0d1a5a16232e36701b9e899 HEAD

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Install Function dependencies
        working-directory: functions
        run: npm ci

      - name: Generate deploy taxonomy artifacts
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const g = require('./functions/scripts/generate_deploy_taxonomy_artifacts');
          const family = g.generateFamilyRegistry();
          const structured = g.generateStructuredTaxonomy();
          console.log(JSON.stringify({ok: true, family, structured}));
          NODE
          test -s functions/artifacts/vision_canonical_family_registry_v1.json
          test -s functions/artifacts/vision_canonical_family_registry_v1.manifest.json
          test -s functions/artifacts/canonical_resolver_structured_taxonomy_v1.json
          test -s functions/artifacts/canonical_resolver_structured_taxonomy_v1.manifest.json

      - name: Narrow Firebase discovery to Stylist functions
        shell: bash
        run: |
          set -euo pipefail
          cp functions/index.js functions/index.full.js
          cat > functions/index.js <<'NODE'
          "use strict";
          const full = require("./index.full");
          if (!full || !full.stylistChat || !full.resolveStylistFrozenCandidatesV1) {
            throw new Error("stylist_exports_missing");
          }
          exports.stylistChat = full.stylistChat;
          exports.resolveStylistFrozenCandidatesV1 = full.resolveStylistFrozenCandidatesV1;
          NODE

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Deploy natural Stylist backend
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --only functions:stylistChat,functions:resolveStylistFrozenCandidatesV1 \
            --project outfitoftheday-4d401 \
            --non-interactive
