name: Swap semantics patch

on:
  push:
    branches:
      - brain-v1-experiment
    paths:
      - .github/workflows/_tmp-swap-semantics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: brain-v1-experiment
          fetch-depth: 0

      - name: Apply guarded swap semantics patch
        run: python tool/_tmp_swap_semantics_patch.py

      - name: Verify diff
        run: git diff --check

      - name: Commit patch
        run: |
          git config user.name "lerry555"
          git config user.email "132705754+lerry555@users.noreply.github.com"
          git add lib test
          git commit -m "fix: understand garment rejection and thermal swaps"
          git push origin HEAD:brain-v1-experiment
