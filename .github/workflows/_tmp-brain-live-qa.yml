name: Brain V1 live QA one-shot

on:
  push:
    branches:
      - brain-v1-experiment
    paths:
      - .github/workflows/_tmp-brain-live-qa.yml

permissions:
  contents: read

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
      - name: Verify experiment branch and trigger HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "brain-v1-experiment"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Function dependencies
        working-directory: functions
        run: npm ci --ignore-scripts
      - name: Prepare live QA credentials
        id: auth
        shell: bash
        env:
          OPENAI_API_KEY_SECRET: ${{ secrets.OPENAI_API_KEY }}
          FIREBASE_TOKEN_SECRET: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY_SECRET:-}" ]; then
            echo "::add-mask::$OPENAI_API_KEY_SECRET"
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY_SECRET" >> "$GITHUB_ENV"
            echo "mode=direct_openai" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${FIREBASE_TOKEN_SECRET:-}" ]; then
            echo "::add-mask::$FIREBASE_TOKEN_SECRET"
            printf 'FIREBASE_TOKEN=%s\n' "$FIREBASE_TOKEN_SECRET" >> "$GITHUB_ENV"
            echo "mode=firebase" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          service_account="${FIREBASE_SERVICE_ACCOUNT:-}"
          if [ -z "$service_account" ]; then service_account="${FIREBASE_SERVICE_ACCOUNT_JSON:-}"; fi
          if [ -z "$service_account" ]; then service_account="${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}"; fi
          if [ -n "$service_account" ]; then
            credential_file="$RUNNER_TEMP/firebase-service-account.json"
            printf '%s' "$service_account" > "$credential_file"
            chmod 600 "$credential_file"
            printf 'GOOGLE_APPLICATION_CREDENTIALS=%s\n' "$credential_file" >> "$GITHUB_ENV"
            echo "mode=firebase" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "mode=deployed_callable" >> "$GITHUB_OUTPUT"
          echo "No Actions credential secret found; using ephemeral Firebase anonymous auth for deployed callable probe."
      - name: Run paid Brain V1 live QA suite from GitHub OpenAI secret
        if: steps.auth.outputs.mode == 'direct_openai'
        working-directory: functions
        env:
          BRAIN_LIVE_QA: '1'
        run: npm run qa:brain-live
      - name: Run paid Brain V1 live QA suite from Firebase secret
        if: steps.auth.outputs.mode == 'firebase'
        working-directory: functions
        env:
          BRAIN_LIVE_QA: '1'
        run: npm run qa:brain-live-firebase
      - name: Probe authenticated deployed Brain V1 callable end-to-end
        if: steps.auth.outputs.mode == 'deployed_callable'
        shell: bash
        env:
          FIREBASE_PROJECT_ID: outfitoftheday-4d401
          FIREBASE_WEB_API_KEY: AIzaSyDGtWcSl3qXooHZH2tESxE6HIkj2UZOzow
        run: |
          node <<'NODE'
          const projectId = process.env.FIREBASE_PROJECT_ID;
          const apiKey = process.env.FIREBASE_WEB_API_KEY;
          const endpoint = `https://us-east1-${projectId}.cloudfunctions.net/stylistChat`;
          const identityBase = 'https://identitytoolkit.googleapis.com/v1';
          const allowedActions = new Set(['chat', 'clarify', 'generate_outfit', 'show_items']);

          async function jsonRequest(url, options) {
            const response = await fetch(url, options);
            const text = await response.text();
            let json = null;
            try { json = JSON.parse(text); } catch (_) {}
            return {response, json};
          }

          async function createAnonymousAuth() {
            const {response, json} = await jsonRequest(
              `${identityBase}/accounts:signUp?key=${encodeURIComponent(apiKey)}`,
              {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({returnSecureToken: true}),
              },
            );
            if (!response.ok || !json?.idToken) {
              const code = String(json?.error?.message || response.status).slice(0, 160);
              throw new Error(`anonymous_auth_failed:${code}`);
            }
            console.log('Firebase anonymous auth | PASS');
            console.log(`::add-mask::${json.idToken}`);
            if (json.refreshToken) console.log(`::add-mask::${json.refreshToken}`);
            return {idToken: json.idToken, localId: String(json.localId || '')};
          }

          async function deleteAnonymousAuth(idToken) {
            try {
              await fetch(`${identityBase}/accounts:delete?key=${encodeURIComponent(apiKey)}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({idToken}),
              });
              console.log('Firebase anonymous auth cleanup | DONE');
            } catch (_) {
              console.log('Firebase anonymous auth cleanup | BEST_EFFORT_FAILED');
            }
          }

          async function callStylist(payload, idToken) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 110000);
            try {
              const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  Authorization: `Bearer ${idToken}`,
                },
                body: JSON.stringify({data: payload}),
                signal: controller.signal,
              });
              const text = await response.text();
              let envelope;
              try { envelope = JSON.parse(text); } catch (_) {
                throw new Error(`callable_non_json_http_${response.status}`);
              }
              if (!response.ok || envelope.error) {
                const code = String(envelope?.error?.status || envelope?.error?.message || response.status).slice(0, 160);
                throw new Error(`callable_error:${code}`);
              }
              const result = envelope.result ?? envelope.data;
              if (!result || typeof result !== 'object') throw new Error('callable_result_missing');
              return result;
            } finally {
              clearTimeout(timer);
            }
          }

          function payload(message, state, history = [], brain = true) {
            return {
              message,
              history,
              weatherContext: {},
              clientContext: {
                ...(brain ? {conversationBrainVersion: 'brain_v1'} : {}),
                timezone: 'Europe/Bratislava',
                nowIso: new Date().toISOString(),
              },
              outfitContextState: state,
              mode: 'chat',
              includeWardrobe: false,
            };
          }

          function summarize(data) {
            const reply = typeof data.reply === 'string' ? data.reply.trim() : '';
            const action = String(data.action || '').trim();
            const webResearch = data.webResearch && typeof data.webResearch === 'object' ? data.webResearch : null;
            return {
              reply,
              action,
              webResearch,
              webUsed: webResearch?.used === true,
              webCallCount: Number(webResearch?.callCount || 0),
            };
          }

          const simpleState = {groundingStatus: 'sufficient', unresolvedMaterialFields: []};
          const simpleMessage = 'Hodí sa biele tričko k tmavomodrým džínsom?';
          let auth = null;
          try {
            auth = await createAnonymousAuth();

            // Cheap diagnostic gate: prove the deployed callable works for the
            // settled legacy route before spending the rest of the Brain suite.
            const legacyStarted = Date.now();
            const legacy = summarize(await callStylist(payload(simpleMessage, simpleState, [], false), auth.idToken));
            console.log(
              `Brain deployed QA | legacy-baseline | PASS | action=${legacy.action || 'missing'} ` +
              `replyLen=${legacy.reply.length} durationMs=${Date.now() - legacyStarted}`,
            );
            if (!legacy.reply || !allowedActions.has(legacy.action)) {
              throw new Error('legacy_baseline_contract_failed');
            }

            const brainGateStarted = Date.now();
            const brainGate = summarize(await callStylist(payload(simpleMessage, simpleState, [], true), auth.idToken));
            console.log(
              `Brain deployed QA | brain-simple-gate | PASS | action=${brainGate.action || 'missing'} ` +
              `web=${brainGate.webUsed} calls=${brainGate.webCallCount} replyLen=${brainGate.reply.length} ` +
              `durationMs=${Date.now() - brainGateStarted}`,
            );
            if (!brainGate.reply || !allowedActions.has(brainGate.action) || brainGate.webUsed) {
              throw new Error('brain_simple_gate_contract_failed');
            }

            const scenarios = [
              {
                id: 'current-public-event-needs-web',
                turns: [{
                  message: 'O tri týždne idem do Michaloviec na koncert AC/DC. Čo si mám obliecť?',
                  state: {
                    activityLocationLabel: 'Michalovce', activityLocationKnown: true,
                    activityHint: 'concert', groundingStatus: 'sufficient', unresolvedMaterialFields: [],
                  },
                  expectWeb: true,
                }],
              },
              {
                id: 'unknown-public-term-needs-web-before-clarify',
                turns: [{
                  message: "Na pozvánke na verejné podujatie mám dress code 'Neo Alpine Formal 2026'. Čo to znamená pre outfit?",
                  state: {groundingStatus: 'needs_grounding', unresolvedMaterialFields: ['activity']},
                  expectWeb: true,
                }],
              },
              {
                id: 'private-shorthand-must-not-use-web',
                turns: [{
                  message: "S kamarátmi máme súkromnú skratku 'modrý režim'. Zajtra ideme na modrý režim, čo si mám obliecť?",
                  state: {groundingStatus: 'needs_grounding', unresolvedMaterialFields: ['activity', 'destination']},
                  expectWeb: false,
                  actions: ['clarify', 'chat'],
                }],
              },
              {
                id: 'private-place-must-not-use-web',
                turns: [{
                  message: 'Zajtra idem s Katkou na naše miesto. Čo si mám dať?',
                  state: {groundingStatus: 'needs_grounding', unresolvedMaterialFields: ['activity', 'destination']},
                  expectWeb: false,
                  actions: ['clarify', 'chat'],
                }],
              },
              {
                id: 'topic-switch-does-not-carry-stale-research',
                turns: [
                  {
                    message: 'O tri týždne idem do Michaloviec na koncert AC/DC. Čo si mám obliecť?',
                    state: {
                      activityLocationLabel: 'Michalovce', activityLocationKnown: true,
                      activityHint: 'concert', groundingStatus: 'sufficient', unresolvedMaterialFields: [],
                    },
                    expectWeb: true,
                  },
                  {
                    message: 'Inak nechaj koncert tak. Hodí sa všeobecne čierne tričko k sivým nohaviciam?',
                    state: {groundingStatus: 'sufficient', unresolvedMaterialFields: []},
                    expectWeb: false,
                    actions: ['chat'],
                    forbiddenReplyTerms: ['AC/DC', 'Michalov'],
                  },
                ],
              },
            ];

            let failed = false;
            let requestCount = 2; // legacy baseline + simple Brain gate
            for (const scenario of scenarios) {
              const history = [];
              for (let i = 0; i < scenario.turns.length; i += 1) {
                const turn = scenario.turns[i];
                requestCount += 1;
                const started = Date.now();
                try {
                  const result = summarize(await callStylist(payload(turn.message, turn.state, history, true), auth.idToken));
                  const failures = [];
                  if (!result.reply) failures.push('reply_missing');
                  if (!allowedActions.has(result.action)) failures.push(`action_invalid:${result.action || 'missing'}`);
                  if (result.webUsed !== turn.expectWeb) failures.push(`web_expected_${turn.expectWeb}_actual_${result.webUsed}`);
                  if (result.webCallCount < 0 || result.webCallCount > 3) failures.push(`web_call_count:${result.webCallCount}`);
                  if (Array.isArray(turn.actions) && !turn.actions.includes(result.action)) {
                    failures.push(`action_expected_${turn.actions.join('|')}_actual_${result.action}`);
                  }
                  for (const term of turn.forbiddenReplyTerms || []) {
                    if (result.reply.toLowerCase().includes(term.toLowerCase())) failures.push(`stale_reply_term:${term}`);
                  }
                  const publicKeys = Object.keys(result.webResearch?.publicContext || {});
                  console.log(
                    `Brain deployed QA | ${scenario.id}#${i + 1} | ${failures.length ? 'FAIL' : 'PASS'} | ` +
                    `action=${result.action || 'missing'} web=${result.webUsed} calls=${result.webCallCount} ` +
                    `replyLen=${result.reply.length} publicKeys=${publicKeys.join(',') || '-'} durationMs=${Date.now() - started}`,
                  );
                  if (failures.length) {
                    failed = true;
                    console.log(`  failures=${failures.join(',')}`);
                  }
                  history.push({role: 'user', content: turn.message});
                  history.push({role: 'assistant', content: result.reply});
                  if (history.length > 8) history.splice(0, history.length - 8);
                } catch (error) {
                  failed = true;
                  console.log(`Brain deployed QA | ${scenario.id}#${i + 1} | ERROR | ${String(error?.message || error).slice(0, 240)}`);
                }
              }
            }
            console.log(`Brain deployed QA | requests=${requestCount} | passed=${!failed}`);
            if (failed) process.exitCode = 1;
          } catch (error) {
            console.log(`Brain deployed QA | ABORT | ${String(error?.message || error).slice(0, 240)}`);
            process.exitCode = 1;
          } finally {
            if (auth?.idToken) await deleteAnonymousAuth(auth.idToken);
          }
          NODE
