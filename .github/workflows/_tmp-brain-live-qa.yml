name: Brain V1 live QA one-shot

on:
  push:
    branches:
      - brain-v1-experiment
    paths:
      - .github/workflows/_tmp-brain-live-qa.yml

permissions:
  contents: read

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
      - name: Verify experiment branch and trigger HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "brain-v1-experiment"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compare deployed legacy and Brain V1 routes anonymously
        shell: bash
        env:
          FIREBASE_PROJECT_ID: outfitoftheday-4d401
        run: |
          node <<'NODE'
          const endpoint = `https://us-east1-${process.env.FIREBASE_PROJECT_ID}.cloudfunctions.net/stylistChat`;
          const message = 'Hodí sa biele tričko k tmavomodrým džínsom?';
          const state = {groundingStatus: 'sufficient', unresolvedMaterialFields: []};

          function makePayload(brain) {
            return {
              message,
              history: [],
              weatherContext: {},
              clientContext: {
                ...(brain ? {conversationBrainVersion: 'brain_v1'} : {}),
                timezone: 'Europe/Bratislava',
                nowIso: new Date().toISOString(),
              },
              outfitContextState: state,
              mode: 'chat',
              includeWardrobe: false,
            };
          }

          async function call(label, brain) {
            const started = Date.now();
            try {
              const response = await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({data: makePayload(brain)}),
              });
              const text = await response.text();
              let envelope = null;
              try { envelope = JSON.parse(text); } catch (_) {}
              if (!response.ok || envelope?.error) {
                const error = String(
                  envelope?.error?.status || envelope?.error?.message || response.status,
                ).slice(0, 160);
                console.log(
                  `Deployed route A/B | ${label} | ERROR | ${error} | durationMs=${Date.now() - started}`,
                );
                return {ok: false, error};
              }
              const data = envelope?.result ?? envelope?.data;
              const reply = typeof data?.reply === 'string' ? data.reply.trim() : '';
              const action = String(data?.action || '').trim();
              const web = data?.webResearch?.used === true;
              const calls = Number(data?.webResearch?.callCount || 0);
              console.log(
                `Deployed route A/B | ${label} | PASS | action=${action || 'missing'} ` +
                `web=${web} calls=${calls} replyLen=${reply.length} durationMs=${Date.now() - started}`,
              );
              return {ok: Boolean(reply), action, web, calls};
            } catch (error) {
              const message = String(error?.message || error).slice(0, 160);
              console.log(
                `Deployed route A/B | ${label} | ERROR | ${message} | durationMs=${Date.now() - started}`,
              );
              return {ok: false, error: message};
            }
          }

          const legacy = await call('legacy', false);
          const brain = await call('brain_v1', true);
          console.log(
            `Deployed route A/B | summary | legacy=${legacy.ok ? 'PASS' : 'FAIL'} ` +
            `brain_v1=${brain.ok ? 'PASS' : 'FAIL'}`,
          );
          if (!legacy.ok || !brain.ok) process.exitCode = 1;
          NODE
