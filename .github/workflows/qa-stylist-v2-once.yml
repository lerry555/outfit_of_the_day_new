name: Deploy and QA Stylist V2 trusted explicit location fix once

on:
  push:
    branches:
      - stylist-simple-agent
    paths:
      - .github/workflows/qa-stylist-v2-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  deploy-smoke-focused-and-broad-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard production frozen refs and validated QA harness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            stylist-simple-agent \
            brain-v1-experiment \
            hardening/stylist-deterministic-shell-20260913 \
            qa/stylist-production-matrix-20260915
          test "$(git rev-parse origin/stylist-simple-agent)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/hardening/stylist-deterministic-shell-20260913)" = "035a65f45b782bf4cac023e3ff960f1fb1113bcf"
          test "$(git rev-parse origin/qa/stylist-production-matrix-20260915)" = "f4ac28d65dee20c00572b89745fe72aae0ebc427"
          git merge-base --is-ancestor 3fe4bd467eb2bf90a30d28835fead0c3e63b966f "${GITHUB_SHA}"

      - name: Checkout exact canonical runtime merge
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 3fe4bd467eb2bf90a30d28835fead0c3e63b966f
          test "$(git rev-parse HEAD)" = "3fe4bd467eb2bf90a30d28835fead0c3e63b966f"
          grep -q 'stylist_production_bridge_one_brain_v2' functions/index_v2.js
          grep -q 'module.exports.stylistChatV2' functions/index_v2.js
          grep -q 'const model = "gpt-5.6-terra"' functions/stylist/v2/openai_one_brain_model_port_v2.js
          grep -q 'const reasoningEffort = "medium"' functions/stylist/v2/openai_one_brain_model_port_v2.js
          grep -q 'params.countryCode = expectedCountryCode' functions/stylist/v2/guarded_location_resolver_v2.js
          grep -q 'embeddedCountryLocationScopeV2' functions/stylist/v2/guarded_location_resolver_v2.js
          grep -q 'countryScopedLocativeFallbackQueriesV2' functions/stylist/v2/guarded_location_resolver_v2.js
          grep -q 'restoreTrustedBroadLocationV2' functions/stylist/v2/stylist_one_brain_engine_v2.js
          grep -q 'restoreTrustedExplicitLocationV2' functions/stylist/v2/stylist_one_brain_engine_v2.js
          grep -q 'trustedExplicitLocation = {field, location' functions/stylist/v2/stylist_one_brain_engine_v2.js
          grep -q 'specificWeatherLocationFieldV2' functions/stylist/v2/stylist_production_bridge_one_brain_v2.js

      - name: Isolate V2 entrypoint for Firebase analysis
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'functions/index_v2.js';
          let source = fs.readFileSync(path, 'utf8');
          const legacyImport = 'const legacy = require("./index");\nmodule.exports = legacy;\n';
          if (!source.includes(legacyImport)) {
            throw new Error('expected legacy bridge not found in canonical index_v2.js');
          }
          source = source.replace(legacyImport, '');
          fs.writeFileSync(path, source);
          NODE
          ! grep -q 'require("./index")' functions/index_v2.js
          grep -q 'module.exports.stylistChatV2' functions/index_v2.js

      - name: Fingerprint canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "CANONICAL_TRUSTED_LOCATION_MERGE=$(git rev-parse HEAD)"
          sha256sum \
            functions/index_v2.js \
            functions/stylist/v2/stylist_production_bridge_one_brain_v2.js \
            functions/stylist/v2/guarded_location_resolver_v2.js \
            functions/stylist/v2/stylist_one_brain_engine_v2.js \
            functions/stylist/v2/openai_one_brain_model_port_v2.js

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Show active deploy principal
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'));console.log('DEPLOY_GCP_PRINCIPAL=' + (j.client_email || 'unknown'))"

      - name: Install Function dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy only stylistChatV2
        run: firebase deploy --only functions:stylistChatV2 --project outfitoftheday-4d401 --non-interactive

      - name: Describe deployed Firebase function
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project outfitoftheday-4d401 | grep stylistChatV2

      - name: Run baseline production callable smoke
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE_WEB_API_KEY="$(node -e "const j=require('./android/app/google-services.json');process.stdout.write(j.client[0].api_key[0].current_key)")"
          echo "::add-mask::$FIREBASE_WEB_API_KEY"
          export FIREBASE_WEB_API_KEY
          export GOOGLE_CLOUD_PROJECT=outfitoftheday-4d401
          export STYLIST_PROD_SMOKE_MAX_CALL_MS=30000
          export STYLIST_PROD_SMOKE_MAX_COST_USD=0.05
          node functions/stylist/v2/stylist_production_smoke_v2.js

      - name: Materialize CI-validated QA harness without switching branches
        shell: bash
        run: |
          set -euo pipefail
          git show f4ac28d65dee20c00572b89745fe72aae0ebc427:functions/stylist/v2/stylist_production_location_ambiguity_v2.js > functions/stylist/v2/stylist_production_location_ambiguity_v2.js
          git show f4ac28d65dee20c00572b89745fe72aae0ebc427:functions/stylist/v2/stylist_production_matrix_v2.js > functions/stylist/v2/stylist_production_matrix_v2.js
          node --check functions/stylist/v2/stylist_production_location_ambiguity_v2.js
          node --check functions/stylist/v2/stylist_production_matrix_v2.js
          echo "QA_HARNESS_SOURCE=f4ac28d65dee20c00572b89745fe72aae0ebc427"

      - name: Run focused ambiguous-location production QA
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE_WEB_API_KEY="$(node -e "const j=require('./android/app/google-services.json');process.stdout.write(j.client[0].api_key[0].current_key)")"
          echo "::add-mask::$FIREBASE_WEB_API_KEY"
          export FIREBASE_WEB_API_KEY
          export GOOGLE_CLOUD_PROJECT=outfitoftheday-4d401
          export STYLIST_MATRIX_CALL_TIMEOUT_MS=45000
          node functions/stylist/v2/stylist_production_location_ambiguity_v2.js

      - name: Run broad production callable matrix
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE_WEB_API_KEY="$(node -e "const j=require('./android/app/google-services.json');process.stdout.write(j.client[0].api_key[0].current_key)")"
          echo "::add-mask::$FIREBASE_WEB_API_KEY"
          export FIREBASE_WEB_API_KEY
          export GOOGLE_CLOUD_PROJECT=outfitoftheday-4d401
          export STYLIST_MATRIX_CALL_TIMEOUT_MS=45000
          node functions/stylist/v2/stylist_production_matrix_v2.js
