name: Deploy and QA Stylist V2 once

on:
  push:
    branches:
      - stylist-simple-agent
    paths:
      - .github/workflows/qa-stylist-v2-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  deploy-and-production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard frozen refs and canonical production merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            stylist-simple-agent \
            brain-v1-experiment \
            hardening/stylist-deterministic-shell-20260913
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/hardening/stylist-deterministic-shell-20260913)" = "035a65f45b782bf4cac023e3ff960f1fb1113bcf"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor e52f897f6002d4d42b777023d90ec969abfa977d "${GITHUB_SHA}"

      - name: Checkout canonical merge for deploy and QA
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach e52f897f6002d4d42b777023d90ec969abfa977d
          test "$(git rev-parse HEAD)" = "e52f897f6002d4d42b777023d90ec969abfa977d"

      - name: Isolate V2 entrypoint for Firebase analysis
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'functions/index_v2.js';
          let source = fs.readFileSync(path, 'utf8');
          const legacyImport = 'const legacy = require("./index");\nmodule.exports = legacy;\n';
          if (!source.includes(legacyImport)) {
            throw new Error('expected legacy bridge not found in canonical index_v2.js');
          }
          source = source.replace(legacyImport, '');
          fs.writeFileSync(path, source);
          NODE
          ! grep -q 'require("./index")' functions/index_v2.js
          grep -q 'module.exports.stylistChatV2' functions/index_v2.js
          grep -q 'createGuardedOpenMeteoLocationResolverV2' functions/index_v2.js

      - name: Fingerprint canonical runtime source
        shell: bash
        run: |
          set -euo pipefail
          echo "CANONICAL_MERGE=$(git rev-parse HEAD)"
          sha256sum \
            functions/index_v2.js \
            functions/stylist/v2/guarded_location_resolver_v2.js \
            functions/stylist/v2/stylist_production_bridge_one_brain_v2.js \
            functions/stylist/v2/stylist_one_brain_engine_v2.js \
            functions/stylist/v2/stylist_turn_coordinator_v2.js
          grep -n "createGuardedOpenMeteoLocationResolverV2" functions/index_v2.js
          grep -n "isActivityOnlyLocationQueryV2" functions/stylist/v2/guarded_location_resolver_v2.js
          grep -n "createDeterministicShellBrainV2" functions/stylist/v2/stylist_production_bridge_one_brain_v2.js
          grep -n "deterministicRemoteOutfitClarificationV2" functions/stylist/v2/stylist_production_bridge_one_brain_v2.js

      - name: Instrument safe first-turn smoke output
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'functions/stylist/v2/stylist_production_smoke_v2.js';
          let source = fs.readFileSync(path, 'utf8');
          const needle = '    const first = await callCallable(idToken, base(`t1_${stamp}`, "zajtra idem na túru potrebujem outfit"));\n';
          if (!source.includes(needle)) throw new Error('production smoke first turn not found');
          const diagnostic = needle + `    console.log("STYLIST_PRODUCTION_FIRST_TURN " + JSON.stringify({\n      action: first.result.action || null,\n      modelPath: first.result.modelPath || null,\n      sessionRevision: first.result.sessionRevision ?? null,\n      failClosed: first.result.failClosed ?? null,\n      reply: String(first.result.reply || "").slice(0, 240),\n      resolvedContext: first.result.resolvedContext || null,\n      resultingOutfitItemIds: Array.isArray(first.result.resultingOutfitItemIds) ? first.result.resultingOutfitItemIds : [],\n    }));\n`;
          source = source.replace(needle, diagnostic);
          fs.writeFileSync(path, source);
          NODE

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Show active QA principal
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'));console.log('QA_GCP_PRINCIPAL=' + (j.client_email || 'unknown'))"

      - name: Install Function dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy only stylistChatV2
        run: firebase deploy --only functions:stylistChatV2 --project outfitoftheday-4d401 --non-interactive

      - name: Describe deployed Firebase functions
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project outfitoftheday-4d401

      - name: Run production callable smoke
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE_WEB_API_KEY="$(node -e "const j=require('./android/app/google-services.json');process.stdout.write(j.client[0].api_key[0].current_key)")"
          echo "::add-mask::$FIREBASE_WEB_API_KEY"
          export FIREBASE_WEB_API_KEY
          export GOOGLE_CLOUD_PROJECT=outfitoftheday-4d401
          export STYLIST_PROD_SMOKE_MAX_CALL_MS=30000
          export STYLIST_PROD_SMOKE_MAX_COST_USD=0.05
          node functions/stylist/v2/stylist_production_smoke_v2.js
