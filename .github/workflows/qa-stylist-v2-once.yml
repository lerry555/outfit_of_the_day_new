name: QA Stylist V2 matrix once

on:
  push:
    branches:
      - stylist-simple-agent
    paths:
      - .github/workflows/qa-stylist-v2-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  production-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard frozen refs and matrix source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            stylist-simple-agent \
            brain-v1-experiment \
            hardening/stylist-deterministic-shell-20260913 \
            qa/stylist-production-matrix-20260915
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/hardening/stylist-deterministic-shell-20260913)" = "035a65f45b782bf4cac023e3ff960f1fb1113bcf"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/qa/stylist-production-matrix-20260915)" = "c406ea07803ff9d36761dca86588b4dbf755543a"
          git merge-base --is-ancestor c76c74ddad5c7d25b34a640cec853893e3017c8d "${GITHUB_SHA}"
          git merge-base --is-ancestor c76c74ddad5c7d25b34a640cec853893e3017c8d c406ea07803ff9d36761dca86588b4dbf755543a
          test "$(git diff --name-only c76c74ddad5c7d25b34a640cec853893e3017c8d c406ea07803ff9d36761dca86588b4dbf755543a)" = "functions/stylist/v2/stylist_production_matrix_v2.js"

      - name: Checkout validated matrix harness
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach c406ea07803ff9d36761dca86588b4dbf755543a
          test "$(git rev-parse HEAD)" = "c406ea07803ff9d36761dca86588b4dbf755543a"
          node --check functions/stylist/v2/stylist_production_matrix_v2.js
          echo "MATRIX_SOURCE=$(git rev-parse HEAD)"

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Show active QA principal
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'));console.log('QA_GCP_PRINCIPAL=' + (j.client_email || 'unknown'))"

      - name: Install Function dependencies
        working-directory: functions
        run: npm ci

      - name: Run broad production callable matrix
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE_WEB_API_KEY="$(node -e "const j=require('./android/app/google-services.json');process.stdout.write(j.client[0].api_key[0].current_key)")"
          echo "::add-mask::$FIREBASE_WEB_API_KEY"
          export FIREBASE_WEB_API_KEY
          export GOOGLE_CLOUD_PROJECT=outfitoftheday-4d401
          export STYLIST_MATRIX_CALL_TIMEOUT_MS=45000
          node functions/stylist/v2/stylist_production_matrix_v2.js
