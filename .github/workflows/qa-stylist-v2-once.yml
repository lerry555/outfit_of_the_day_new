name: QA Stylist V2 once

on:
  push:
    branches:
      - stylist-simple-agent
    paths:
      - .github/workflows/qa-stylist-v2-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard frozen refs and production merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            stylist-simple-agent \
            brain-v1-experiment \
            hardening/stylist-deterministic-shell-20260913
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/hardening/stylist-deterministic-shell-20260913)" = "035a65f45b782bf4cac023e3ff960f1fb1113bcf"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor d5bb3e82845d98ffd80fd54149b93ad3934fac8c "${GITHUB_SHA}"

      - name: Checkout corrected production smoke
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach d5bb3e82845d98ffd80fd54149b93ad3934fac8c
          test "$(git rev-parse HEAD)" = "d5bb3e82845d98ffd80fd54149b93ad3934fac8c"
          grep -q 'hashValue(\[uid, turnId, "one_brain"\])' functions/stylist/v2/stylist_production_smoke_v2.js
          echo "SMOKE_SOURCE=$(git rev-parse HEAD)"

      - name: Instrument safe smoke output
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'functions/stylist/v2/stylist_production_smoke_v2.js';
          let source = fs.readFileSync(path, 'utf8');

          const firstNeedle = '    const first = await callCallable(idToken, base(`t1_${stamp}`, "zajtra idem na túru potrebujem outfit"));\n';
          if (!source.includes(firstNeedle)) throw new Error('production smoke first turn not found');
          source = source.replace(firstNeedle, firstNeedle + `    console.log("STYLIST_PRODUCTION_FIRST_TURN " + JSON.stringify({\n      action: first.result.action || null,\n      sessionRevision: first.result.sessionRevision ?? null,\n      failClosed: first.result.failClosed ?? null,\n      reply: String(first.result.reply || "").slice(0, 240),\n      resolvedContext: first.result.resolvedContext || null,\n    }));\n`);

          const outfitNeedle = '    const outfit = await callCallable(idToken, base(`t3_${stamp}`, "do Tatier"));\n';
          if (!source.includes(outfitNeedle)) throw new Error('production smoke outfit turn not found');
          source = source.replace(outfitNeedle, outfitNeedle + `    console.log("STYLIST_PRODUCTION_OUTFIT_TURN " + JSON.stringify({\n      action: outfit.result.action || null,\n      sessionRevision: outfit.result.sessionRevision ?? null,\n      failClosed: outfit.result.failClosed ?? null,\n      stylistComment: String(outfit.result.stylistComment || "").slice(0, 500),\n      resultingOutfitItemIds: Array.isArray(outfit.result.resultingOutfitItemIds) ? outfit.result.resultingOutfitItemIds : [],\n      quickReplyMode: outfit.result.quickReplyMode || null,\n      quickReplyPrompt: outfit.result.quickReplyPrompt || null,\n      resolvedContext: outfit.result.resolvedContext || null,\n    }));\n`);

          const opinionNeedle = '    assert.equal(opinion.result.failClosed, false);\n';
          if (!source.includes(opinionNeedle)) throw new Error('production smoke opinion assertion not found');
          source = source.replace(opinionNeedle, `    console.log("STYLIST_PRODUCTION_OPINION_TURN " + JSON.stringify({\n      action: opinion.result.action || null,\n      sessionRevision: opinion.result.sessionRevision ?? null,\n      failClosed: opinion.result.failClosed ?? null,\n      outfitChanged: opinion.result.outfitChanged ?? null,\n      displayItemIds: Array.isArray(opinion.result.displayItemIds) ? opinion.result.displayItemIds : [],\n      stylistComment: String(opinion.result.stylistComment || "").slice(0, 400),\n    }));\n` + opinionNeedle);

          fs.writeFileSync(path, source);
          NODE

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Show active QA principal
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'));console.log('QA_GCP_PRINCIPAL=' + (j.client_email || 'unknown'))"

      - name: Install Function dependencies
        working-directory: functions
        run: npm ci

      - name: Run production callable smoke only
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE_WEB_API_KEY="$(node -e "const j=require('./android/app/google-services.json');process.stdout.write(j.client[0].api_key[0].current_key)")"
          echo "::add-mask::$FIREBASE_WEB_API_KEY"
          export FIREBASE_WEB_API_KEY
          export GOOGLE_CLOUD_PROJECT=outfitoftheday-4d401
          export STYLIST_PROD_SMOKE_MAX_CALL_MS=30000
          export STYLIST_PROD_SMOKE_MAX_COST_USD=0.05
          node functions/stylist/v2/stylist_production_smoke_v2.js
