name: Diagnose Stylist V2 country-scope session once

on:
  push:
    branches:
      - stylist-simple-agent
    paths:
      - .github/workflows/qa-stylist-v2-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  diagnose-country-scope-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard deployed runtime and frozen refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            stylist-simple-agent \
            brain-v1-experiment \
            hardening/stylist-deterministic-shell-20260913 \
            qa/stylist-production-matrix-20260915
          test "$(git rev-parse origin/stylist-simple-agent)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/hardening/stylist-deterministic-shell-20260913)" = "035a65f45b782bf4cac023e3ff960f1fb1113bcf"
          test "$(git rev-parse origin/qa/stylist-production-matrix-20260915)" = "f4ac28d65dee20c00572b89745fe72aae0ebc427"
          git merge-base --is-ancestor de9c99d04aeaf21c2f17c823483d2b5e878137e1 "${GITHUB_SHA}"

      - name: Materialize and instrument focused QA harness
        shell: bash
        run: |
          set -euo pipefail
          git show f4ac28d65dee20c00572b89745fe72aae0ebc427:functions/stylist/v2/stylist_production_location_ambiguity_v2.js > functions/stylist/v2/stylist_production_location_ambiguity_v2.js
          node <<'NODE'
          const fs = require('fs');
          const path = 'functions/stylist/v2/stylist_production_location_ambiguity_v2.js';
          let source = fs.readFileSync(path, 'utf8');
          const firstNeedle = '      assert.equal(first.resolvedContext?.weatherAvailable, false);\n\n      const second = await turn(chatId, place);';
          const firstInsert = `      assert.equal(first.resolvedContext?.weatherAvailable, false);\n\n      const beforeSecondSnap = await db.collection("stylistSessionsV2Server").doc(uid).collection("sessions").doc(chatId).get();\n      const beforeSecondState = beforeSecondSnap.data()?.state || null;\n      console.log(\`STYLIST_AMBIGUITY_SESSION_BEFORE_SECOND ${'${'}chatId} ${'${'}JSON.stringify({revision: beforeSecondState?.revision ?? null, destination: beforeSecondState?.context?.destination || null, eventLocation: beforeSecondState?.context?.eventLocation || null, pendingQuestion: beforeSecondState?.conversationMemory?.pendingQuestion || null})}\`);\n\n      const second = await turn(chatId, place);`;
          if (!source.includes(firstNeedle)) throw new Error('first diagnostic injection point missing');
          source = source.replace(firstNeedle, firstInsert);
          const secondNeedle = '      const second = await turn(chatId, place);\n      assertUnitedStatesWeather(second, place);';
          const secondInsert = `      const second = await turn(chatId, place);\n      const afterSecondSnap = await db.collection("stylistSessionsV2Server").doc(uid).collection("sessions").doc(chatId).get();\n      const afterSecondState = afterSecondSnap.data()?.state || null;\n      console.log(\`STYLIST_AMBIGUITY_SESSION_AFTER_SECOND ${'${'}chatId} ${'${'}JSON.stringify({revision: afterSecondState?.revision ?? null, destination: afterSecondState?.context?.destination || null, eventLocation: afterSecondState?.context?.eventLocation || null, pendingQuestion: afterSecondState?.conversationMemory?.pendingQuestion || null, weather: afterSecondState?.context?.weather ? {locationProviderId: afterSecondState.context.weather.locationProviderId, source: afterSecondState.context.weather.source} : null})}\`);\n      assertUnitedStatesWeather(second, place);`;
          if (!source.includes(secondNeedle)) throw new Error('second diagnostic injection point missing');
          source = source.replace(secondNeedle, secondInsert);
          fs.writeFileSync(path, source);
          NODE
          node --check functions/stylist/v2/stylist_production_location_ambiguity_v2.js

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Install Function dependencies
        working-directory: functions
        run: npm ci

      - name: Run instrumented focused production QA
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE_WEB_API_KEY="$(node -e "const j=require('./android/app/google-services.json');process.stdout.write(j.client[0].api_key[0].current_key)")"
          echo "::add-mask::$FIREBASE_WEB_API_KEY"
          export FIREBASE_WEB_API_KEY
          export GOOGLE_CLOUD_PROJECT=outfitoftheday-4d401
          export STYLIST_MATRIX_CALL_TIMEOUT_MS=45000
          node functions/stylist/v2/stylist_production_location_ambiguity_v2.js
