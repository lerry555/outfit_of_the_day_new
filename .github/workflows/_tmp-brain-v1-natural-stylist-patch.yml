name: Brain V1 natural Stylist patch one-shot

on:
  push:
    branches:
      - brain-v1-experiment

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: brain-v1-experiment
          fetch-depth: 0

      - name: Guard exact patch base and master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin brain-v1-experiment master
          test "$(git rev-parse HEAD)" = "a7c509da2c8108d5bbeb72a2ddb0f8e4e8a3975e"
          test "$(git rev-parse origin/brain-v1-experiment)" = "a7c509da2c8108d5bbeb72a2ddb0f8e4e8a3975e"
          test "$(git rev-parse origin/master)" = "00bd52fa20f1e5b281d66850758c465dc2b00098"

      - name: Apply guarded architecture patch
        run: python3 tool/_tmp_brain_v1_natural_stylist_patch.py

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          grep -q "outfitDirective" functions/stylist/chat_prompts.js
          grep -q "optionalUpperLayerRequested" lib/domain/wardrobe_v2/native_outfit_engine_v2.dart
          grep -q "brain_locked_swap" lib/screens/stylist_chat_screen.dart
          grep -q "targetMeanWarmth(weather.tempC)" lib/Services/stylist_chat_outfit_service.dart

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lerry555"
          git config user.email "132705754+lerry555@users.noreply.github.com"
          git add \
            functions/index.js \
            functions/stylist/chat_prompts.js \
            functions/stylist/conversation_brain_v1.js \
            functions/stylist/frozen_stylist_authority_v1.js \
            functions/stylist/frozen_stylist_authority_v1.test.js \
            lib/Services/stylist_frozen_candidate_decision_service.dart \
            lib/Services/stylist_chat_outfit_service.dart \
            lib/domain/wardrobe_v2/flexible_candidate_matrix_v2.dart \
            lib/domain/wardrobe_v2/native_outfit_engine_v2.dart \
            lib/screens/stylist_chat_screen.dart \
            test/brain_v1_v2_offline_bundle_test.dart
          git diff --cached --quiet && { echo "No product changes staged"; exit 1; } || true
          git commit -m "feat: make Brain own natural Stylist interaction"
          git push origin HEAD:brain-v1-experiment
