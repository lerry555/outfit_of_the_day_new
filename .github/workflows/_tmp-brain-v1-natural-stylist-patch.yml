name: Brain V1 natural Stylist patch one-shot

on:
  push:
    branches:
      - brain-v1-experiment

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: brain-v1-experiment
          fetch-depth: 0

      - name: Guard patch ancestry and master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin brain-v1-experiment master
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/brain-v1-experiment)"
          git merge-base --is-ancestor a7c509da2c8108d5bbeb72a2ddb0f8e4e8a3975e HEAD
          test "$(git rev-parse origin/master)" = "00bd52fa20f1e5b281d66850758c465dc2b00098"
          test -f tool/_tmp_brain_v1_natural_stylist_patch.py

      - name: Normalize generated patch anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tool/_tmp_brain_v1_natural_stylist_patch.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('# 1) Brain structured outfit directive.')
          end = s.index('# 2) Backend directive sanitize/forward + current recommendation metadata.')
          section = r'''# 1) Brain structured outfit directive.
          path = "functions/stylist/chat_prompts.js"
          s = read(path)
          s = replace_once(
              s,
              '  `"showItemIds":[],"eventContext":{},"excludeItemKeywords":[]}\\n` +',
              '  `"showItemIds":[],"eventContext":{},"excludeItemKeywords":[],` +\n'
              '  `"outfitDirective":{"scope":"none","slot":"none","family":"none",` +\n'
              '  `"preserveOtherSlots":true,"extraLayer":"none","presentation":"normal"}}\\n` +',
              "brain JSON output directive",
          )
          anchor = (
              '  `- generate_outfit použi iba keď používateľ významovo žiada zostaviť/odporučiť outfit alebo oblečenie, prijme ponuku na jeho zostavenie, prípadne explicitne mení už zobrazený outfit.\\n` +\n'
          )
          directive_rules = (
              anchor +
              '  `- OUTFIT DIRECTIVE je štruktúrovaný význam userovej poslednej požiadavky, nie módne rozhodnutie. Vždy ho vyplň.\\n` +\n' +
              '  `- scope=none pri obyčajnom rozhovore, vysvetlení alebo porovnaní („prečo rifle a nie kraťasy?“). Taká otázka NESMIE sama meniť outfit.\\n` +\n' +
              '  `- scope=full_outfit keď user žiada prvý/celý/nový outfit. presentation=normal pri prvom odporúčaní; presentation=concise_full keď už outfit vidí a chce ho iba znovu ukázať alebo zobraziť po úprave.\\n` +\n' +
              '  `- scope=single_slot keď user chce vybrať alebo vymeniť presne jeden slot („ktoré kraťasy?“, „iné topánky“, „zmeň tričko“). slot=top|bottom|shoes|outerwear, preserveOtherSlots=true, presentation=focused_item.\\n` +\n' +
              '  `- family používaj iba ak user rodinu naozaj určil: shorts|jeans|pants|joggers|sneakers|boots|sandals|formal_shoes; inak none.\\n` +\n' +
              '  `- extraLayer=optional_upper_layer iba keď user explicitne chce pridať záložnú vrstvu navrch/pre prípad chladu. Nevyvodzuj ju iba z večera alebo mesta.\\n` +\n' +
              '  `- Ak user povie „ukáž celý outfit a pridaj niečo navrch“, je to full_outfit + optional_upper_layer + concise_full, nie single-slot swap.\\n` +\n' +
              '  `- Ak user povie „ktoré kraťasy si mám dať?“, je to generate_outfit + single_slot(bottom, shorts) + focused_item. Odpoveď má znieť ako rada stylistu, nie ako interná operácia.\\n` +\n'
          )
          s = replace_once(s, anchor, directive_rules, "insert Brain directive rules")
          write(path, s)

          '''
          normalized = s[:start] + section + s[end:]
          normalized = normalized.replace(
              'Array.isArray(clientContext.currentOutfit)?',
              'Array.isArray(clientContext.currentOutfit) ?',
          )
          normalized = normalized.replace(
              'Array.isArray(parsed?.excludeItemKeywords)?',
              'Array.isArray(parsed?.excludeItemKeywords) ?',
          )
          old_helper = '''def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly 1 match, got {count}")
              return text.replace(old, new, 1)
          '''
          new_helper = '''def replace_once(text, old, new, label):
              count = text.count(old)
              if label == "service generation semantic params":
                  if count < 1:
                      raise RuntimeError(f"{label}: expected at least 1 match, got {count}")
                  return text.replace(old, new, 1)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly 1 match, got {count}")
              return text.replace(old, new, 1)
          '''
          if old_helper not in normalized:
              raise RuntimeError('replace_once helper anchor missing')
          normalized = normalized.replace(old_helper, new_helper, 1)
          p.write_text(normalized, encoding='utf-8')
          PY

      - name: Apply guarded architecture patch
        run: python3 tool/_tmp_brain_v1_natural_stylist_patch.py

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ['functions/stylist/frozen_stylist_authority_v1.test.js']:
              p = Path(name)
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
          git status --short
          grep -q "outfitDirective" functions/stylist/chat_prompts.js
          grep -q "optionalUpperLayerRequested" lib/domain/wardrobe_v2/native_outfit_engine_v2.dart
          grep -q "brain_locked_swap" lib/screens/stylist_chat_screen.dart
          grep -q "targetMeanWarmth(weather.tempC)" lib/Services/stylist_chat_outfit_service.dart

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lerry555"
          git config user.email "132705754+lerry555@users.noreply.github.com"
          git add \
            functions/index.js \
            functions/stylist/chat_prompts.js \
            functions/stylist/conversation_brain_v1.js \
            functions/stylist/frozen_stylist_authority_v1.js \
            functions/stylist/frozen_stylist_authority_v1.test.js \
            lib/Services/stylist_frozen_candidate_decision_service.dart \
            lib/Services/stylist_chat_outfit_service.dart \
            lib/domain/wardrobe_v2/flexible_candidate_matrix_v2.dart \
            lib/domain/wardrobe_v2/native_outfit_engine_v2.dart \
            lib/screens/stylist_chat_screen.dart \
            test/brain_v1_v2_offline_bundle_test.dart
          if git diff --cached --quiet; then
            echo "No product changes staged"
            exit 1
          fi
          git commit -m "feat: make Brain own natural Stylist interaction"
          git push origin HEAD:brain-v1-experiment
