name: Temporary Stylist adversarial fixes

on:
  push:
    branches:
      - qa/stylist-v2-e2e-speed-polish-20260909
    paths:
      - .github/workflows/_tmp-stylist-adversarial-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment qa/stylist-v2-e2e-speed-polish-20260909
          test "$(git rev-parse origin/stylist-simple-agent)" = "7acf9a1e2e033881025019829cb9d652c6df6c60"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/qa/stylist-v2-e2e-speed-polish-20260909)" = "$GITHUB_SHA"
          git merge-base --is-ancestor origin/stylist-simple-agent HEAD

      - name: Apply conversational pending-state fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('functions/stylist/v2/stylist_grounding_policy_v2.js')
          s = p.read_text()
          old = '''    const answered = next.conversationMemory?.answeredClarificationFields;\n    if (answered && typeof answered === "object") {\n      for (const key of ["destination", "eventLocation", "date", "timeWindow", "terrain.surface", "terrain.difficulty", "terrain.condition"]) delete answered[key];\n    }\n  }'''
          new = '''    const answered = next.conversationMemory?.answeredClarificationFields;\n    if (answered && typeof answered === "object") {\n      for (const key of ["destination", "eventLocation", "date", "timeWindow", "terrain.surface", "terrain.difficulty", "terrain.condition"]) delete answered[key];\n    }\n    // A clearly new style-only/event request supersedes a clarification from\n    // the previous task. Do not let stale pending state turn the new message\n    // into a location-parser input.\n    if (["style_only", "event"].includes(policy.scope)) {\n      next.conversationMemory.pendingQuestion = null;\n      next.conversationMemory.pendingAction = null;\n    }\n  }'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('functions/stylist/v2/stylist_turn_coordinator_v2.js')
          s = p.read_text()
          old = '''function pendingLocationReplyDispositionV2(value) {\n  const normalized = normalizeConversationTextV2(value);\n  if (!normalized) return "conversation";\n  if (/^(naco|preco|aky je dovod|na co|a naco|a preco)\\b/.test(normalized) ||\n      /\\b(naco ti to je|preco to potrebujes|na co ti to je)\\b/.test(normalized)) return "why";\n  if (/\\b(neviem|netusim|je mi to jedno|preskoc|preskocme|neries|bez pocasia|daj mi proste|proste mi daj|vyber proste)\\b/.test(normalized)) return "skip";\n  return "location";\n}'''
          new = '''function pendingLocationReplyDispositionV2(value) {\n  const normalized = normalizeConversationTextV2(value);\n  if (!normalized) return "conversation";\n  const explicitlySkipsWeather = /\\b(bez pocasia|neries pocasie|preskoc pocasie|pocasie neries)\\b/.test(normalized);\n  if (!explicitlySkipsWeather &&\n      /\\b(zatial to neries|neries to|nechaj to tak|nechaj tak|kasli na to|odlozme to|diky staci|dakujem staci)\\b/.test(normalized)) {\n    return "defer";\n  }\n  if (/^(naco|preco|aky je dovod|na co|a naco|a preco)\\b/.test(normalized) ||\n      /\\b(naco ti to je|preco to potrebujes|na co ti to je)\\b/.test(normalized)) return "why";\n  if (/\\b(neviem|netusim|je mi to jedno|preskoc|preskocme|neries|bez pocasia|daj mi proste|proste mi daj|vyber proste)\\b/.test(normalized)) return "skip";\n  return "location";\n}'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = '''function whyLocationClarificationDecision(field) {\n  const event = field === "eventLocation";\n  const question = event ?\n    "Pomôže mi to zohľadniť počasie priamo na mieste podujatia, nie tvoju aktuálnu polohu. Kde približne sa podujatie koná?" :\n    "Pomôže mi to zohľadniť počasie tam, kam ideš, namiesto tvojej aktuálnej polohy. Kam približne ideš?";\n  const actionId = event ? "clarify_event_location" : "clarify_destination";\n  return {action: "clarify", assistantText: question, clarification: {field, question, actionId}, display: {kind: "none", itemIds: []}};\n}\n'''
          addition = marker + '''\nfunction deferredPendingDecisionV2() {\n  return {\n    action: "chat",\n    assistantText: "Jasné, necháme to zatiaľ tak 🙂",\n    display: {kind: "none", itemIds: []},\n  };\n}\n'''
          assert marker in s
          s = s.replace(marker, addition, 1)

          old = '''        if (disposition === "why") {\n          decision = whyLocationClarificationDecision(pendingField);\n        } else if (disposition === "skip") {'''
          new = '''        if (disposition === "why") {\n          decision = whyLocationClarificationDecision(pendingField);\n        } else if (disposition === "defer") {\n          workingState.conversationMemory.pendingQuestion = null;\n          decision = deferredPendingDecisionV2();\n        } else if (disposition === "skip") {'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Verify adversarial and existing pending-state gates
        working-directory: functions
        run: |
          node --check stylist/v2/stylist_grounding_policy_v2.js
          node --check stylist/v2/stylist_turn_coordinator_v2.js
          node --test stylist/v2/stylist_adversarial_conversation_v2.test.js
          node --test stylist/v2/stylist_help_first_contract_v2.test.js
          node --test stylist/v2/stylist_pending_location_v2.test.js
          node --test stylist/v2/stylist_grounding_policy_v2.test.js
          node --test stylist/v2/stylist_release_gate_v2.test.js

      - name: Commit reviewed production fixes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lerry555"
          git config user.email "132705754+lerry555@users.noreply.github.com"
          git add \
            functions/stylist/v2/stylist_grounding_policy_v2.js \
            functions/stylist/v2/stylist_turn_coordinator_v2.js
          git diff --cached --check
          git commit -m "fix: let new intent supersede stale Stylist pending state"
          git push origin HEAD:qa/stylist-v2-e2e-speed-polish-20260909
