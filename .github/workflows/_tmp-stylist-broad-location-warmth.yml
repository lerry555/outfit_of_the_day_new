name: Stylist broad-location warmth patch one-shot

on:
  push:
    branches:
      - fix/stylist-broad-location-warmth-20260911
    paths:
      - .github/workflows/_tmp-stylist-broad-location-warmth.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard production brain and work branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment fix/stylist-broad-location-warmth-20260911 --no-tags
          test "$(git rev-parse origin/stylist-simple-agent)" = "85fb314ebd9f4eb36e88dc4efd2df5ddc18fffab"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fix/stylist-broad-location-warmth-20260911)"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Apply focused patch
        run: python .github/_tmp_stylist_broad_location_warmth_patch.py

      - name: Run focused One-Brain regression suite
        id: tests
        shell: bash
        run: |
          set +e
          node --test functions/stylist/v2/stylist_one_brain_runtime_v2.test.js > stylist-test-output.txt 2>&1
          code=$?
          cat stylist-test-output.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stylist-broad-location-test-output
          path: stylist-test-output.txt

      - name: Require tests to pass
        if: steps.tests.outputs.code != '0'
        run: exit 1

      - name: Diff hygiene
        run: git diff --check

      - name: Guard again and commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment fix/stylist-broad-location-warmth-20260911 --no-tags
          test "$(git rev-parse origin/stylist-simple-agent)" = "85fb314ebd9f4eb36e88dc4efd2df5ddc18fffab"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fix/stylist-broad-location-warmth-20260911)"
          git config user.name "lerry555"
          git config user.email "132705754+lerry555@users.noreply.github.com"
          git add functions/stylist/v2/stylist_one_brain_engine_v2.js functions/stylist/v2/openai_one_brain_model_port_v2.js functions/stylist/v2/stylist_one_brain_runtime_v2.test.js
          git commit -m "fix: narrow broad Stylist destinations before outfit"
          git push origin HEAD:fix/stylist-broad-location-warmth-20260911
