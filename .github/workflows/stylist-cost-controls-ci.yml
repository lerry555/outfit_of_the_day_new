name: Stylist cost controls checks

on:
  push:
    branches: [stylist-simple-agent]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'lib/Services/hourly_weather_service.dart'
      - 'lib/screens/stylist_chat_screen.dart'
      - 'test/stylist_simple_agent_v1_test.dart'
      - '.github/workflows/stylist-cost-controls-ci.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  cost-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Function dependencies
        working-directory: functions
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax and offline regressions
        run: |
          node --check functions/index.js
          node --test functions/stylist/simple_stylist_footwear_v1.test.js
          node --test functions/stylist/simple_stylist_conversation_v1.test.js
          node --test functions/costs/cost_controls_v1.test.js functions/stylist/simple_stylist_agent_v1.test.js functions/stylist/simple_stylist_choice_memory_v1.test.js functions/clothing_vision/clothing_analyzer_v2.test.js functions/clothing_vision/gemini_v2_request_snapshot.test.js functions/clothing_vision/gemini_wardrobe_analyzer_v2_transport.test.js functions/shopping/catalog_search_service.test.js functions/shopping/shopping_orchestration_service.test.js functions/stylist/home_final_review_preferences.test.js
          node functions/stylist/simple_stylist_cost_eval_v1.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Real Firestore transactions and private-collection rules (emulator only)
        run: npx --yes firebase-tools@14.22.0 emulators:exec --only firestore --project demo-ootd-cost-controls "node --test functions/costs/cost_controls_firestore_emulator.test.js"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate required vision test artifacts from their source of truth
        run: |
          flutter pub get
          flutter test test/backend_clothing_kb_prior_artifact_export_test.dart --dart-define=UPDATE_CLOTHING_KB_PRIOR_ARTIFACT=true
          node functions/scripts/generate_deploy_taxonomy_artifacts.js
      - name: Existing full clothing vision regression
        run: node --test functions/clothing_vision/clothing_vision.test.js
      - name: Simple-agent client contract and partial-outfit persistence
        run: flutter test test/stylist_simple_agent_v1_test.dart
