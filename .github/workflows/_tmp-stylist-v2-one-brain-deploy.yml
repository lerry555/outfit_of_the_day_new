name: AI Stylist V2 One-Brain one-shot deploy

on:
  push:
    branches:
      - deploy/stylist-v2-one-brain-20260910

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact source refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment
          canonical="$(git rev-parse origin/stylist-simple-agent)"
          brain="$(git rev-parse origin/brain-v1-experiment)"
          merge_base="$(git merge-base origin/stylist-simple-agent HEAD)"
          changed="$(git diff --name-only origin/stylist-simple-agent...HEAD)"
          echo "canonical=$canonical"
          echo "brain=$brain"
          echo "merge_base=$merge_base"
          echo "changed=$changed"
          test "$canonical" = "2e4a119eeac7c5422d585905a845333a8435b77e"
          test "$brain" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$merge_base" = "$canonical"
          test "$changed" = ".github/workflows/_tmp-stylist-v2-one-brain-deploy.yml"

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Install Function dependencies
        working-directory: functions
        run: npm ci --ignore-scripts

      - name: Syntax check One-Brain production seam
        run: |
          node --check functions/index_v2.js
          node --check functions/stylist/v2/openai_one_brain_model_port_v2.js
          node --check functions/stylist/v2/stylist_one_brain_engine_v2.js
          node --check functions/stylist/v2/stylist_production_bridge_one_brain_v2.js
          node --check functions/stylist/v2/stylist_one_brain_runtime_v2.test.js

      - name: Run full V2 backend contract suite
        run: >-
          node --test
          functions/stylist/v2/stylist_v2_phase0_acceptance.test.js
          functions/stylist/v2/stylist_v2_phase0_contracts.test.js
          functions/stylist/v2/stylist_session_repository_v2.test.js
          functions/stylist/v2/stylist_turn_engine_v2.test.js
          functions/stylist/v2/stylist_grounding_policy_v2.test.js
          functions/stylist/v2/stylist_v2_phase3_ports.test.js
          functions/stylist/v2/stylist_production_bridge_v2.test.js
          functions/stylist/v2/stylist_openai_schema_subset_v2.test.js
          functions/stylist/v2/stylist_pending_location_v2.test.js
          functions/stylist/v2/stylist_help_first_contract_v2.test.js
          functions/stylist/v2/stylist_wardrobe_cache_v2.test.js
          functions/stylist/v2/stylist_location_wardrobe_plan_efficiency_v2.test.js
          functions/stylist/v2/stylist_model_payload_efficiency_v2.test.js
          functions/stylist/v2/stylist_release_gate_v2.test.js
          functions/stylist/v2/stylist_adversarial_conversation_v2.test.js
          functions/stylist/v2/stylist_one_brain_runtime_v2.test.js

      - name: Existing Stylist backend regression
        run: node --test functions/stylist/*.test.js

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Deploy only stylistChatV2
        run: firebase deploy --only functions:stylistChatV2 --project outfitoftheday-4d401 --non-interactive
