name: Temporary Stylist release-gate patch

on:
  push:
    branches:
      - qa/stylist-v2-e2e-speed-polish-20260909
    paths:
      - .github/workflows/_tmp-qa-stylist-gate-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment qa/stylist-v2-e2e-speed-polish-20260909
          test "$(git rev-parse origin/stylist-simple-agent)" = "7acf9a1e2e033881025019829cb9d652c6df6c60"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          git merge-base --is-ancestor origin/stylist-simple-agent HEAD

      - name: Apply reviewed gate fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('functions/stylist/v2/stylist_turn_coordinator_v2.js')
          s = p.read_text()
          old = 'const GREETINGS = new Set(["ahoj", "čau", "cau", "dobrý deň", "dobry den"]);'
          new = 'const GREETINGS = new Set(["ahoj", "čau", "cau", "čauko", "cauko", "nazdar", "servus", "hello", "hi", "hey", "dobrý deň", "dobry den"]);'
          assert old in s
          s = s.replace(old, new, 1)
          old = '/^(ahoj|cau|nazdar|servus|hello|hi|hey)(?:\\s+(divocak|kamo|kamarat|stylista))?$/'
          new = '/^(ahoj|cau|cauko|nazdar|servus|hello|hi|hey)(?:\\s+(divocak|kamo|kamarat|stylista))?$/'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('functions/stylist/v2/stylist_grounding_policy_v2.js')
          s = p.read_text()
          old = r'const LOCAL_ROUTINE_TERMS = /\b(do prace|v praci|do skoly|v skole|do fitka|vo fitku|do posilnovne|v posilnovni|gym|work|school|na nakup|na nakupy|doma|home office)\b/;'
          new = r'const LOCAL_ROUTINE_TERMS = /\b(do prace|v praci|do skoly|v skole|do fitka|vo fitku|do posilnovne|v posilnovni|gym|work|school|na nakup|na nakupy|kino|cinema|do kina|v kine|doma|home office)\b/;'
          assert old in s
          s = s.replace(old, new, 1)
          old = 'return new Set(["ahoj", "cau", "nazdar", "dobry den", "servus", "hello", "hi", "hey"]).has(normalizeSemanticTextV2(value));'
          new = 'return new Set(["ahoj", "cau", "cauko", "nazdar", "dobry den", "servus", "hello", "hi", "hey"]).has(normalizeSemanticTextV2(value));'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('functions/stylist/v2/stylist_turn_contract_v2.js')
          s = p.read_text()
          old = '  "display", "shoppingResult", "quickReplies", "resultingSessionRevision",\n]);'
          new = '  "display", "shoppingResult", "quickReplies", "quickReplyPrompt", "resultingSessionRevision",\n]);'
          assert old in s
          s = s.replace(old, new, 1)
          old = '''  normalized.quickReplies = (normalized.quickReplies || []).map((reply) => ({\n    actionId: reply.actionId,\n    label: String(reply.label || reply.actionId || "").trim(),\n  })).sort((a, b) => a.actionId.localeCompare(b.actionId));'''
          new = '''  normalized.quickReplies = (normalized.quickReplies || []).map((reply) => ({\n    actionId: reply.actionId,\n    label: String(reply.label || reply.actionId || "").trim(),\n  })).sort((a, b) => a.actionId.localeCompare(b.actionId));\n  if (normalized.quickReplyPrompt != null) {\n    normalized.quickReplyPrompt = String(normalized.quickReplyPrompt).replace(/\\s+/g, " ").trim();\n  }'''
          assert old in s
          s = s.replace(old, new, 1)
          marker = '''  if (new Set(result.quickReplies.map((reply) => reply.actionId)).size !== result.quickReplies.length) {\n    throw new TypeError("quick reply action IDs must be unique");\n  }'''
          addition = marker + '''\n  if (result.quickReplyPrompt != null && (!result.quickReplyPrompt || result.quickReplies.length === 0)) {\n    throw new TypeError("quickReplyPrompt requires at least one typed quick reply");\n  }'''
          assert marker in s
          s = s.replace(marker, addition, 1)
          p.write_text(s)

          p = Path('functions/stylist/v2/stylist_release_gate_v2.test.js')
          s = p.read_text()
          old = 'patch: patchDefaults(),'
          new = '''patch: {\n      ...patchDefaults(),\n      activityId: "cinema",\n      activityLabel: "kino",\n      dateKey: "2026-09-10",\n      timeWindowKey: "day",\n      replaceGroundingRequirements: true,\n      weatherRequired: false,\n      weatherLocationField: "none",\n    },'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = 'const calls = {model: [], wardrobe: [], location: [], weather: [], cache: []};'
          new = 'const calls = {model: [], wardrobe: [], location: [], weather: [], cache: [], warnings: []};'
          assert old in s
          s = s.replace(old, new, 1)
          old = 'logger: {warn() {}, info() {}},'
          new = 'logger: {warn(message, data) { calls.warnings.push({message, data}); console.error("GATE_WARN", message, JSON.stringify(data || {})); }, info() {}},'
          assert old in s
          s = s.replace(old, new, 1)
          old = 'if (normalized.includes("tatr")) return TATRY;'
          new = 'if (normalized.includes("tatr") || normalized.includes("tatier")) return TATRY;'
          assert old in s
          s = s.replace(old, new, 1)
          old = '''async getForecast(request) {\n        calls.weather.push(JSON.parse(JSON.stringify(request || {})));\n        return {summary: "dry_mild", minTempC: 10, maxTempC: 17, precipitationMm: 0};\n      },'''
          new = '''async getForecast(request) {\n        calls.weather.push(JSON.parse(JSON.stringify(request || {})));\n        return {\n          summary: "dry_mild", minTempC: 10, maxTempC: 17, precipitationMm: 0,\n          locationProviderId: request.location.providerId,\n          dateKey: request.date.dateKey,\n          timeWindowKey: request.timeWindow.key,\n          fetchedAt: new Date(NOW).toISOString(),\n          source: "release_gate",\n        };\n      },'''
          assert old in s
          s = s.replace(old, new, 1)
          old = 'assert.equal(response.ok, true);\n  assert.equal(response.failClosed, false);'
          new = 'assert.equal(response.ok, true, `response=${JSON.stringify(response)}`);\n  assert.equal(response.failClosed, false, `response=${JSON.stringify(response)}`);'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('functions/stylist/v2/stylist_live_smoke_v2.js')
          s = p.read_text()
          old = '''weatherTool: {async getForecast() {\n      return {summary: "sucho a mierne", minTempC: 10, maxTempC: 17, precipitationMm: 0};\n    }},'''
          new = '''weatherTool: {async getForecast(request) {\n      return {\n        summary: "sucho a mierne", minTempC: 10, maxTempC: 17, precipitationMm: 0,\n        locationProviderId: request.location.providerId,\n        dateKey: request.date.dateKey,\n        timeWindowKey: request.timeWindow.key,\n        fetchedAt: new Date().toISOString(),\n        source: "live_smoke",\n      };\n    }},'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('functions/stylist/v2/stylist_production_smoke_v2.js')
          s = p.read_text()
          marker = 'function qualityCheck(text) {'
          helper = '''function bratislavaDateKeys() {\n  const parts = new Intl.DateTimeFormat("en-US", {\n    timeZone: "Europe/Bratislava", year: "numeric", month: "2-digit", day: "2-digit",\n  }).formatToParts(new Date());\n  const value = Object.fromEntries(parts.filter((part) => part.type !== "literal").map((part) => [part.type, part.value]));\n  const base = new Date(Date.UTC(Number(value.year), Number(value.month) - 1, Number(value.day)));\n  const key = (offset) => new Date(base.getTime() + offset * 86400000).toISOString().slice(0, 10);\n  return {todayDateKey: key(0), tomorrowDateKey: key(1)};\n}\n\n'''
          assert marker in s and 'function bratislavaDateKeys()' not in s
          s = s.replace(marker, helper + marker, 1)
          old = 'const stamp = Date.now();\n  const uid = `stylist_smoke_${stamp}`;'
          new = 'const stamp = Date.now();\n  const dates = bratislavaDateKeys();\n  const uid = `stylist_smoke_${stamp}`;'
          assert old in s
          s = s.replace(old, new, 1)
          old = 'clientContext: {todayDateKey: "2026-09-09", tomorrowDateKey: "2026-09-10", timezoneOffsetMinutes: 120},'
          new = 'clientContext: {...dates, timezoneOffsetMinutes: -new Date().getTimezoneOffset()},'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Verify deterministic release gate
        working-directory: functions
        run: |
          node --check stylist/v2/stylist_turn_coordinator_v2.js
          node --check stylist/v2/stylist_grounding_policy_v2.js
          node --check stylist/v2/stylist_turn_contract_v2.js
          node --check stylist/v2/stylist_release_gate_v2.test.js
          node --check stylist/v2/stylist_live_smoke_v2.js
          node --check stylist/v2/stylist_production_smoke_v2.js
          node --test stylist/v2/stylist_release_gate_v2.test.js
          node --test stylist/v2/stylist_help_first_contract_v2.test.js
          node --test stylist/v2/stylist_grounding_policy_v2.test.js
          node --test stylist/v2/stylist_v2_phase0_contracts.test.js

      - name: Commit only reviewed source/test changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lerry555"
          git config user.email "132705754+lerry555@users.noreply.github.com"
          git add \
            functions/stylist/v2/stylist_turn_coordinator_v2.js \
            functions/stylist/v2/stylist_grounding_policy_v2.js \
            functions/stylist/v2/stylist_turn_contract_v2.js \
            functions/stylist/v2/stylist_release_gate_v2.test.js \
            functions/stylist/v2/stylist_live_smoke_v2.js \
            functions/stylist/v2/stylist_production_smoke_v2.js
          git diff --cached --check
          git commit -m "fix: harden Stylist release gate findings"
          git push origin HEAD:qa/stylist-v2-e2e-speed-polish-20260909
