name: AI Stylist V2 checks

on:
  push:
    branches:
      - 'ai-stylist-v2-*'
  pull_request:
    branches:
      - stylist-simple-agent
    paths:
      - 'functions/stylist/v2/**'
      - 'functions/index_v2.js'
      - 'functions/package.json'
      - 'lib/Services/stylist_simple_agent_service_v1.dart'
      - 'lib/screens/stylist_chat_screen.dart'
      - 'lib/models/stylist_chat_progress.dart'
      - 'lib/widgets/stylist_quick_reply_buttons.dart'
      - 'lib/widgets/stylist_suggested_item_card.dart'
      - 'lib/utils/stylist_card_image_priority.dart'
      - 'test/stylist_simple_agent_v1_test.dart'
      - 'test/stylist_simple_agent_fast_path_test.dart'
      - 'test/stylist_quick_reply_contract_test.dart'
      - 'test/stylist_card_image_priority_test.dart'
      - 'test/stylist_chat_progress_test.dart'
      - 'firestore.rules'
      - '.github/workflows/stylist-v2-ci.yml'
      - '.github/workflows/stylist-v2-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Function dependencies
        working-directory: functions
        run: npm ci --ignore-scripts
      - name: Syntax check V2 production modules and smoke harnesses
        run: |
          node --check functions/index_v2.js
          node --check functions/stylist/v2/stylist_session_state_v2.js
          node --check functions/stylist/v2/stylist_turn_contract_v2.js
          node --check functions/stylist/v2/stylist_preflight_v2.js
          node --check functions/stylist/v2/stylist_grounding_policy_v2.js
          node --check functions/stylist/v2/stylist_turn_validator_v2.js
          node --check functions/stylist/v2/stylist_turn_coordinator_v2.js
          node --check functions/stylist/v2/stylist_session_repository_v2.js
          node --check functions/stylist/v2/stylist_turn_engine_v2.js
          node --check functions/stylist/v2/open_meteo_ports_v2.js
          node --check functions/stylist/v2/firestore_wardrobe_tool_v2.js
          node --check functions/stylist/v2/openai_stylist_model_port_v2.js
          node --check functions/stylist/v2/stylist_production_bridge_v2.js
          node --check functions/stylist/v2/openai_one_brain_model_port_v2.js
          node --check functions/stylist/v2/openai_outfit_selector_v2.js
          node --check functions/stylist/v2/openai_outfit_quality_judge_v2.js
          node --check functions/stylist/v2/openai_stylist_language_v2.js
          node --check functions/stylist/v2/stylist_one_brain_engine_v2.js
          node --check functions/stylist/v2/stylist_selection_context_v2.js
          node --check functions/stylist/v2/stylist_selection_pipeline_v2.js
          node --check functions/stylist/v2/stylist_production_bridge_one_brain_v2.js
          node --check functions/stylist/v2/wardrobe_integrity_projection_v2.js
          node --check functions/stylist/v2/stylist_deterministic_shell_v2.js
          node --check functions/stylist/v2/stylist_outfit_order_v2.js
          node --check functions/stylist/v2/stylist_live_smoke_v2.js
          node --check functions/stylist/v2/stylist_production_smoke_v2.js
      - name: Run every non-emulator Stylist V2 test
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=()
          for f in functions/stylist/v2/*.test.js; do
            case "$f" in
              *firestore_emulator.test.js) ;;
              *) files+=("$f") ;;
            esac
          done
          test "${#files[@]}" -gt 0
          echo "Running ${#files[@]} non-emulator V2 test files"
          node --test "${files[@]}"
      - name: Existing Stylist backend regression
        run: node --test functions/stylist/*.test.js

  v2-flutter-seam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze active V2 client seam
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/Services/stylist_simple_agent_service_v1.dart
          lib/screens/stylist_chat_screen.dart
          lib/models/stylist_chat_progress.dart
          lib/widgets/stylist_quick_reply_buttons.dart
          lib/widgets/stylist_suggested_item_card.dart
          lib/utils/stylist_card_image_priority.dart
      - name: V2 client service regressions
        run: >-
          flutter test
          test/stylist_simple_agent_v1_test.dart
          test/stylist_simple_agent_fast_path_test.dart
      - name: V2 CTA and product-card image regressions
        run: >-
          flutter test
          test/stylist_quick_reply_contract_test.dart
          test/stylist_card_image_priority_test.dart
      - name: Stylist progress polish regression
        run: flutter test test/stylist_chat_progress_test.dart

  v2-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Function dependencies
        working-directory: functions
        run: npm ci --ignore-scripts
      - name: V2 and existing Firestore rules emulator regressions
        run: >-
          npx --yes firebase-tools emulators:exec --only firestore
          --project demo-ootd-rules-9cr
          "node --test functions/stylist/v2/stylist_session_firestore_emulator.test.js &&
          node --test functions/wardrobe_firestore_rules_emulator.test.js &&
          node --test functions/shopping/catalog_firestore_rules_emulator.test.js &&
          node --test functions/shopping/shopping_session_firestore_emulator.test.js &&
          node --test functions/shopping/wishlist_v2_firestore_emulator.test.js"
