name: Brain V1 deploy one-shot

on:
  push:
    branches:
      - brain-v1-experiment
    paths:
      - .github/workflows/_tmp-brain-v1-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/brain-v1-experiment'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Verify experiment branch and trigger HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "brain-v1-experiment"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Install Function dependencies
        working-directory: functions
        run: npm ci

      - name: Generate deploy taxonomy artifacts
        shell: bash
        run: |
          set -euo pipefail
          node functions/scripts/generate_deploy_taxonomy_artifacts.js >/tmp/deploy-taxonomy-artifacts.json
          test -s functions/artifacts/vision_canonical_family_registry_v1.json
          test -s functions/artifacts/vision_canonical_family_registry_v1.manifest.json
          test -s functions/artifacts/canonical_resolver_structured_taxonomy_v1.json
          test -s functions/artifacts/canonical_resolver_structured_taxonomy_v1.manifest.json
          test -s functions/artifacts/clothing_knowledge_base_prior_v1.json
          test -s functions/artifacts/clothing_knowledge_base_prior_v1.manifest.json

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Deploy only stylistChat from experiment branch
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --only functions:stylistChat \
            --project outfitoftheday-4d401 \
            --non-interactive
