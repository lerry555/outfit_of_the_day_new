name: Brain V1 deploy one-shot

on:
  push:
    branches:
      - brain-v1-experiment
    paths:
      - .github/workflows/_tmp-brain-v1-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/brain-v1-experiment'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Verify experiment branch and trigger HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "brain-v1-experiment"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Ensure deploy identity can read secret metadata
        shell: bash
        run: |
          set -euo pipefail
          SA_EMAIL="$(python3 - <<'PY'
          import json, os
          with open(os.environ['GOOGLE_APPLICATION_CREDENTIALS'], encoding='utf-8') as f:
              print(json.load(f)['client_email'])
          PY
          )"
          gcloud projects add-iam-policy-binding outfitoftheday-4d401 \
            --member="serviceAccount:${SA_EMAIL}" \
            --role="roles/secretmanager.viewer" \
            --condition=None \
            --quiet >/dev/null

      - name: Install Function dependencies
        working-directory: functions
        run: npm ci

      - name: Generate deploy taxonomy artifacts
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const g = require('./functions/scripts/generate_deploy_taxonomy_artifacts');
          const family = g.generateFamilyRegistry();
          const structured = g.generateStructuredTaxonomy();
          console.log(JSON.stringify({ok: true, family, structured}));
          NODE
          test -s functions/artifacts/vision_canonical_family_registry_v1.json
          test -s functions/artifacts/vision_canonical_family_registry_v1.manifest.json
          test -s functions/artifacts/canonical_resolver_structured_taxonomy_v1.json
          test -s functions/artifacts/canonical_resolver_structured_taxonomy_v1.manifest.json

      - name: Narrow Firebase discovery to stylistChat
        shell: bash
        run: |
          set -euo pipefail
          cp functions/index.js functions/index.full.js
          cat > functions/index.js <<'NODE'
          "use strict";
          const full = require("./index.full");
          if (!full || !full.stylistChat) {
            throw new Error("stylistChat_export_missing");
          }
          exports.stylistChat = full.stylistChat;
          NODE

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Deploy only stylistChat from experiment branch
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --only functions:stylistChat \
            --project outfitoftheday-4d401 \
            --non-interactive
