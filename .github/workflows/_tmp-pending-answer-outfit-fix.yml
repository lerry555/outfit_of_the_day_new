          node --test functions/stylist/v2/stylist_one_brain_runtime_v2.test.js
          git diff --check

      - name: Remove one-shot workflow and commit product patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp-pending-answer-outfit-fix.yml
          git diff --check
          git config user.name "lerry555"
          git config user.email "132705754+lerry555@users.noreply.github.com"
          git add functions/stylist/v2/stylist_one_brain_engine_v2.js \
