name: Stylist V2 conversation deploy one-shot

on:
  push:
    branches:
      - deploy/stylist-v2-conversation-20260909
    paths:
      - .github/workflows/_tmp-stylist-v2-conversation-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/deploy/stylist-v2-conversation-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact deploy branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact merged Stylist target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment deploy/stylist-v2-conversation-20260909
          test "$GITHUB_REF_NAME" = "deploy/stylist-v2-conversation-20260909"
          git merge-base --is-ancestor 68d536a47624efb894beb4a0a59f76ee4f97f8fd HEAD
          test "$(git rev-parse origin/stylist-simple-agent)" = "68d536a47624efb894beb4a0a59f76ee4f97f8fd"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Install Function dependencies
        working-directory: functions
        run: npm ci --ignore-scripts

      - name: Run AI Stylist V2 backend regressions
        shell: bash
        run: >-
          node --test
          functions/stylist/v2/stylist_v2_phase0_acceptance.test.js
          functions/stylist/v2/stylist_v2_phase0_contracts.test.js
          functions/stylist/v2/stylist_session_repository_v2.test.js
          functions/stylist/v2/stylist_turn_engine_v2.test.js
          functions/stylist/v2/stylist_grounding_policy_v2.test.js
          functions/stylist/v2/stylist_v2_phase3_ports.test.js
          functions/stylist/v2/stylist_production_bridge_v2.test.js
          functions/stylist/v2/stylist_openai_schema_subset_v2.test.js
          functions/stylist/v2/stylist_pending_location_v2.test.js
          functions/stylist/v2/stylist_help_first_contract_v2.test.js
          functions/stylist/v2/stylist_wardrobe_cache_v2.test.js
          functions/stylist/v2/stylist_location_wardrobe_plan_efficiency_v2.test.js

      - name: Syntax check changed V2 production modules
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/index_v2.js
          node --check functions/stylist/v2/stylist_turn_coordinator_v2.js
          node --check functions/stylist/v2/open_meteo_ports_v2.js
          node --check functions/stylist/v2/stylist_production_bridge_v2.js
          node --check functions/stylist/v2/openai_stylist_model_port_v2.js

      - name: Narrow Firebase discovery to stylistChatV2
        shell: bash
        run: |
          set -euo pipefail
          cp functions/index.js functions/index.full.js
          cat > functions/index.js <<'NODE'
          "use strict";
          const full = require("./index.full");
          if (!full || !full.stylistChatV2) {
            throw new Error("stylistChatV2_export_missing");
          }
          exports.stylistChatV2 = full.stylistChatV2;
          NODE

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Deploy stylistChatV2 to production
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --only functions:stylistChatV2 \
            --project outfitoftheday-4d401 \
            --non-interactive
