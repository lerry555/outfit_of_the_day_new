          functions/stylist/v2/stylist_production_bridge_v2.test.js
          functions/stylist/v2/stylist_openai_schema_subset_v2.test.js
          functions/stylist/v2/stylist_pending_location_v2.test.js
          functions/stylist/v2/stylist_help_first_contract_v2.test.js
          functions/stylist/v2/stylist_wardrobe_cache_v2.test.js
          functions/stylist/v2/stylist_location_wardrobe_plan_efficiency_v2.test.js
