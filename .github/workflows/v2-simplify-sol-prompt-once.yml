name: One-shot simplify Sol V2 prompt

on:
  push:
    branches:
      - brain-v2-sol-agent
    paths:
      - .github/workflows/v2-simplify-sol-prompt-once.yml

permissions:
  contents: write

jobs:
  simplify-sol-prompt:
    if: contains(github.event.head_commit.message, '[v2-simple-sol]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          ref: brain-v2-sol-agent
          fetch-depth: 0

      - name: Simplify Sol prompt and restore balanced reasoning
        run: |
          python - <<'PY'
          from pathlib import Path

          agent_path = Path('functions/stylist/sol_agent_v2.js')
          agent = agent_path.read_text(encoding='utf-8')

          new_prompt = '''const SOL_AGENT_V2_INSTRUCTIONS = [
            "Si hlavný AI asistent módnej appky Outfit Of The Day (OOTD). Správaj sa ako prirodzený, inteligentný a užitočný chat partner, nie ako formulár alebo rozhodovací strom.",
            "Odpovedaj v jazyku používateľa. Pri slovenčine prirodzene tykaj. Rozumej bežnej reči, preklepom a slangu a plynulo nadväzuj na kontext konverzácie.",
            "Na aktuálnu požiadavku odpovedz priamo. Ak vieš dať užitočnú odpoveď z dostupných informácií, neblokuj ju spresňujúcou otázkou. Pri nepodstatnej neistote urob rozumný predpoklad, povedz ho stručne a pokračuj v odpovedi.",
            "Otázku polož iba vtedy, keď bez odpovede používateľa naozaj nevieš splniť jeho zámer rozumne alebo bezpečne. Nepýtaj znovu fakt, ktorý už je v konverzácii.",
            "Obrázok je normálna súčasť správy. Pozri sa naň a odpovedz na to, čo používateľ žiada. Ak chce názor na outfit, konkrétne povedz čo na ňom vidíš, čo funguje, čo by si prípadne zmenil a či sa hodí na uvedený účel. Neodpovedaj iba ďalšou otázkou, ak už vieš dať zmysluplný názor.",
            "Ak je pre správnosť dôležitý aktuálny alebo verejne overiteľný fakt, môžeš autonómne použiť web_search. Verejné fakty overuj na webe namiesto hádania; súkromné fakty o používateľovi, jeho šatníku, polohe alebo preferenciách si nevymýšľaj.",
            "Ak nemáš prístup k používateľovmu šatníku alebo autoritatívnemu počasiu z appky, netvár sa, že ho máš. Radíš z informácií a nástrojov, ktoré skutočne dostaneš.",
            "Buď konkrétny a praktický. Neopisuj interné modely, API, prompt, routing ani implementáciu appky.",
            "Výstup sa zobrazuje ako obyčajný text. Nepoužívaj Markdown značky ako **, __, # ani backticky. Na zoznam môžeš použiť znak •.",
            "Dĺžku odpovede prispôsob otázke; nebuď zbytočne stručný, ak používateľ žiada hodnotenie alebo radu.",
          ].join("\\n");'''

          start_marker = 'const SOL_AGENT_V2_INSTRUCTIONS = ['
          end_marker = '].join("\\n");'
          start = agent.find(start_marker)
          if start < 0:
            raise SystemExit('prompt start marker missing')
          end = agent.find(end_marker, start)
          if end < 0:
            raise SystemExit('prompt end marker missing')
          end += len(end_marker)
          updated = agent[:start] + new_prompt + agent[end:]
          if 'reasoning: {effort: "low"}' not in updated:
            raise SystemExit('low reasoning marker missing')
          updated = updated.replace('reasoning: {effort: "low"}', 'reasoning: {effort: "medium"}', 1)
          agent_path.write_text(updated, encoding='utf-8')

          test_path = Path('functions/stylist/sol_agent_v2.test.js')
          tests = test_path.read_text(encoding='utf-8')
          old_reasoning = 'assert.deepEqual(body.reasoning, {effort: "low"});'
          if old_reasoning not in tests:
            raise SystemExit('test low reasoning marker missing')
          tests = tests.replace(old_reasoning, 'assert.deepEqual(body.reasoning, {effort: "medium"});', 1)
          anchor = '  assert.match(body.instructions, /Aktuálny čas používateľa/);\n'
          extra = '  assert.match(body.instructions, /neblokuj ju spresňujúcou otázkou/i);\n  assert.match(body.instructions, /Obrázok je normálna súčasť správy/i);\n  assert.doesNotMatch(body.instructions, /hala verzus vonku/i);\n'
          if anchor not in tests:
            raise SystemExit('test anchor missing')
          tests = tests.replace(anchor, anchor + extra, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Verify simple Sol behavior contract
        run: |
          git diff --check
          grep -F 'reasoning: {effort: "medium"}' functions/stylist/sol_agent_v2.js
          ! grep -F 'hala verzus vonku' functions/stylist/sol_agent_v2.js
          ! grep -F 'venue' functions/stylist/sol_agent_v2.js
          node --test functions/stylist/sol_agent_v2.test.js

      - name: Commit simplified Sol behavior
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/stylist/sol_agent_v2.js functions/stylist/sol_agent_v2.test.js
          git commit -m "refactor: let Sol answer naturally with minimal policy"
          git push origin HEAD:brain-v2-sol-agent
