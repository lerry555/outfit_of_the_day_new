name: One-shot direct Sol V2 photo chat

on:
  push:
    branches:
      - brain-v2-sol-agent
    paths:
      - .github/workflows/v2-direct-photo-chat-once.yml

permissions:
  contents: write

jobs:
  patch-direct-photo-chat:
    if: contains(github.event.head_commit.message, '[v2-direct-photo]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          ref: brain-v2-sol-agent
          fetch-depth: 0

      - name: Make V2 photos normal Sol chat turns
        run: |
          python - <<'PY'
          from pathlib import Path

          screen_path = Path('lib/screens/stylist_chat_screen.dart')
          screen = screen_path.read_text(encoding='utf-8')

          old_branch = '''    // Brain V2: po úspešnom uploade odovzdáme fotku rovno Solu.\n    // Legacy lokálne otázky o zámere/mieste ostávajú iba ako rollback cesta.\n    if (StylistChatService.conversationBrainVersion == 'brain_v2_sol') {\n      _photoStage = _PhotoStage.awaitingContext;\n      await _runPhotoRating(text, wardrobeAccess: false);\n      return;\n    }\n'''
          new_branch = '''    // Brain V2: obrázok je normálny konverzačný turn. Žiadny legacy\n    // rate_photo state machine, lokálne clarify fázy ani wardrobe-consent flow.\n    if (StylistChatService.conversationBrainVersion == 'brain_v2_sol') {\n      await _runSolV2PhotoTurn(text);\n      return;\n    }\n'''
          if old_branch not in screen:
              raise SystemExit('V2 photo branch marker not found')
          screen = screen.replace(old_branch, new_branch, 1)

          marker = '''  /// Heuristika: rozpozná, či používateľ v texte k fotke už jasne žiada\n'''
          helper = '''  /// Brain V2 treats a photo exactly like a normal Sol chat message with an\n  /// additional native image input. No legacy photo state machine runs here.\n  Future<void> _runSolV2PhotoTurn(String text) async {\n    final imageUrl = _activePhotoUrl;\n    if (imageUrl == null || imageUrl.isEmpty) {\n      if (mounted) setState(() => _isSending = false);\n      return;\n    }\n\n    if (mounted) {\n      setState(() => _sendingStatusLabel = 'Stylista píše');\n    }\n\n    try {\n      final response = await _stylistChatService.sendMessage(\n        text,\n        history: _buildHistoryForBackend(),\n        clientContext: <String, dynamic>{\n          'now': DateTime.now().toIso8601String(),\n        },\n        mode: 'chat',\n        imageUrl: imageUrl,\n        chatId: _activeChatId,\n      );\n      if (!mounted) return;\n\n      final reply = _sanitizeStylistReplyForDisplay(\n        (response['reply'] ?? '').toString(),\n      ).trim();\n      final ok = response['ok'] == true && reply.isNotEmpty;\n\n      setState(() {\n        _messages.add(\n          StylistChatMessage(\n            text: ok ? reply : 'Niečo sa pokazilo 😅 Skús to prosím ešte raz.',\n            isUser: false,\n          ),\n        );\n        _photoStage = _PhotoStage.none;\n        _activePhotoUrl = null;\n        _photoImproveHint = null;\n        _isSending = false;\n      });\n      _scrollToBottom();\n    } catch (error) {\n      debugPrint('STYLIST SOL V2 photo turn error: $error');\n      if (!mounted) return;\n      setState(() {\n        _messages.add(\n          const StylistChatMessage(\n            text: 'Niečo sa pokazilo 😅 Skús to prosím ešte raz.',\n            isUser: false,\n          ),\n        );\n        _photoStage = _PhotoStage.none;\n        _activePhotoUrl = null;\n        _photoImproveHint = null;\n        _isSending = false;\n      });\n      _scrollToBottom();\n    }\n  }\n\n'''
          if helper not in screen:
              if marker not in screen:
                  raise SystemExit('photo helper insertion marker not found')
              screen = screen.replace(marker, helper + marker, 1)

          screen_path.write_text(screen, encoding='utf-8')

          agent_path = Path('functions/stylist/sol_agent_v2.js')
          agent = agent_path.read_text(encoding='utf-8')
          old_instructions = '''  const now = cleanText(clientNow, 120);\n  const imageTurnInstruction = imageUrl ? [\n    "TENTO TURN OBSAHUJE OBRÁZOK. Vizuálnu úlohu používateľa vybav hneď v tejto odpovedi.",\n    "Ak používateľ žiada zhodnotiť outfit, vhodnosť outfitu alebo čo zmeniť, odpoveď NESMIE byť iba spresňujúca otázka ani iba žiadosť o ďalší kontext.",\n    "Najprv musíš uviesť konkrétny vizuálny verdikt podľa obrázka: čo vidíš, či to funguje pre známy účel a čo by si zmenil. Až potom môžeš na konci položiť nanajvýš jednu doplňujúcu otázku, ak by odpoveď reálne zmenila ďalšiu radu.",\n    "Predchádzajúca otázka asistenta v konverzácii nie je dôvod odložiť aktuálne hodnotenie obrázka. Použi už známy kontext a pri neistote daj podmienenú radu typu 'ak je to vonku...'.",\n  ].join("\\n") : "";\n  const instructions = [\n    SOL_AGENT_V2_INSTRUCTIONS,\n    now ? `Aktuálny čas používateľa podľa appky: ${now}` : "",\n    imageTurnInstruction,\n  ].filter(Boolean).join("\\n\\n");\n'''
          new_instructions = '''  const now = cleanText(clientNow, 120);\n  const instructions = now ?\n    `${SOL_AGENT_V2_INSTRUCTIONS}\\n\\nAktuálny čas používateľa podľa appky: ${now}` :\n    SOL_AGENT_V2_INSTRUCTIONS;\n'''
          if old_instructions not in agent:
              raise SystemExit('dynamic image instruction block not found')
          agent = agent.replace(old_instructions, new_instructions, 1)
          agent_path.write_text(agent, encoding='utf-8')

          test_path = Path('functions/stylist/sol_agent_v2.test.js')
          tests = test_path.read_text(encoding='utf-8')
          old_test = '''test("Sol V2 photo instructions require verdict before secondary clarification", () => {\n  const body = buildSolAgentV2Request({\n    message: "Zhodnoť celý outfit. Hodí sa mi to na ten koncert?",\n    imageUrl: "https://example.com/outfit.jpg",\n    previousResponseId: "resp_previous_123",\n  });\n  assert.match(body.instructions, /najprv daj konkrétny verdikt/i);\n  assert.match(body.instructions, /Neodkladaj celé hodnotenie/i);\n  assert.match(body.instructions, /Nepýtaj znovu názov udalosti, miesto, zámer/i);\n  assert.match(body.instructions, /TENTO TURN OBSAHUJE OBRÁZOK/i);\n  assert.match(body.instructions, /NESMIE byť iba spresňujúca otázka/i);\n  assert.match(body.instructions, /Predchádzajúca otázka asistenta/i);\n  assert.equal(body.previous_response_id, "resp_previous_123");\n  assert.equal(body.input[0].content[1].type, "input_image");\n});\n'''
          new_test = '''test("Sol V2 photo turn stays a normal native conversation turn", () => {\n  const body = buildSolAgentV2Request({\n    message: "Zhodnoť celý outfit. Hodí sa mi to na ten koncert?",\n    imageUrl: "https://example.com/outfit.jpg",\n    previousResponseId: "resp_previous_123",\n  });\n  assert.equal(body.previous_response_id, "resp_previous_123");\n  assert.equal(body.input[0].role, "user");\n  assert.equal(body.input[0].content[0].type, "input_text");\n  assert.equal(body.input[0].content[1].type, "input_image");\n  assert.doesNotMatch(body.instructions, /TENTO TURN OBSAHUJE OBRÁZOK/i);\n});\n'''
          if old_test not in tests:
              raise SystemExit('photo instruction regression test block not found')
          tests = tests.replace(old_test, new_test, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Verify direct V2 path
        run: |
          git diff --check
          grep -F "await _runSolV2PhotoTurn(text);" lib/screens/stylist_chat_screen.dart
          grep -F "mode: 'chat'" lib/screens/stylist_chat_screen.dart
          grep -F "No legacy photo state machine runs here." lib/screens/stylist_chat_screen.dart
          ! grep -F "TENTO TURN OBSAHUJE OBRÁZOK" functions/stylist/sol_agent_v2.js
          node --test functions/stylist/sol_agent_v2.test.js

      - name: Commit direct photo chat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/stylist_chat_screen.dart functions/stylist/sol_agent_v2.js functions/stylist/sol_agent_v2.test.js
          git commit -m "refactor: make V2 photos normal Sol chat turns"
          git push origin HEAD:brain-v2-sol-agent
