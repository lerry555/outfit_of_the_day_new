name: AI Stylist V2 bootstrap reasons hotfix

on:
  push:
    branches:
      - ai-stylist-v2-bootstrap-reasons-hotfix
    paths:
      - .github/workflows/_tmp-stylist-v2-bootstrap-reasons-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard target refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment ai-stylist-v2-bootstrap-reasons-hotfix
          test "$(git rev-parse origin/stylist-simple-agent)" = "6a0c2715b6ea6f2e17723b193fda16e36190a137"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
      - name: Apply production typo fix and regression test
        shell: bash
        env:
          TEST_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os
          from pathlib import Path
          bridge = Path('functions/stylist/v2/stylist_production_bridge_v2.js')
          text = bridge.read_text(encoding='utf-8')
          old = '          persistedSelectionReasonsByItemId,\n'
          new = '          persistedSelectionReasonsByItemId: persistedReasonsByItemId,\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one bootstrap typo occurrence, found {text.count(old)}')
          bridge.write_text(text.replace(old, new), encoding='utf-8')
          Path('functions/stylist/v2/stylist_production_bridge_v2.test.js').write_bytes(base64.b64decode(os.environ['TEST_B64']))
          ci = Path('.github/workflows/stylist-v2-ci.yml')
          ci_text = ci.read_text(encoding='utf-8')
          needle = '          functions/stylist/v2/stylist_v2_phase3_ports.test.js\n'
          addition = needle + '          functions/stylist/v2/stylist_production_bridge_v2.test.js\n'
          if ci_text.count(needle) != 1:
              raise SystemExit('phase3 test anchor missing or duplicated')
          ci.write_text(ci_text.replace(needle, addition), encoding='utf-8')
          PY
      - name: Run focused regression before commit
        shell: bash
        run: |
          set -euo pipefail
          cd functions
          npm ci --ignore-scripts
          node --check stylist/v2/stylist_production_bridge_v2.js
          node --test stylist/v2/stylist_production_bridge_v2.test.js stylist/v2/stylist_grounding_policy_v2.test.js
      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lerry555"
          git config user.email "132705754+lerry555@users.noreply.github.com"
          git add functions/stylist/v2/stylist_production_bridge_v2.js functions/stylist/v2/stylist_production_bridge_v2.test.js .github/workflows/stylist-v2-ci.yml
          git commit -m "fix: bootstrap V2 selection reasons safely"
          git push origin HEAD:ai-stylist-v2-bootstrap-reasons-hotfix
