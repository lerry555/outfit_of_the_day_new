name: One-shot Sol V2 image-turn guard

on:
  push:
    branches:
      - brain-v2-sol-agent
    paths:
      - .github/workflows/v2-image-turn-guard-once.yml

permissions:
  contents: write

jobs:
  patch-image-turn-guard:
    if: contains(github.event.head_commit.message, '[v2-image-guard]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          ref: brain-v2-sol-agent
          fetch-depth: 0

      - name: Add hard per-image-turn instruction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('functions/stylist/sol_agent_v2.js')
          text = path.read_text(encoding='utf-8')
          old = '''  const now = cleanText(clientNow, 120);\n  const instructions = now ?\n    `${SOL_AGENT_V2_INSTRUCTIONS}\\n\\nAktuálny čas používateľa podľa appky: ${now}` :\n    SOL_AGENT_V2_INSTRUCTIONS;\n'''
          new = '''  const now = cleanText(clientNow, 120);\n  const imageTurnInstruction = imageUrl ? [\n    "TENTO TURN OBSAHUJE OBRÁZOK. Vizuálnu úlohu používateľa vybav hneď v tejto odpovedi.",\n    "Ak používateľ žiada zhodnotiť outfit, vhodnosť outfitu alebo čo zmeniť, odpoveď NESMIE byť iba spresňujúca otázka ani iba žiadosť o ďalší kontext.",\n    "Najprv musíš uviesť konkrétny vizuálny verdikt podľa obrázka: čo vidíš, či to funguje pre známy účel a čo by si zmenil. Až potom môžeš na konci položiť nanajvýš jednu doplňujúcu otázku, ak by odpoveď reálne zmenila ďalšiu radu.",\n    "Predchádzajúca otázka asistenta v konverzácii nie je dôvod odložiť aktuálne hodnotenie obrázka. Použi už známy kontext a pri neistote daj podmienenú radu typu 'ak je to vonku...'.",\n  ].join("\\n") : "";\n  const instructions = [\n    SOL_AGENT_V2_INSTRUCTIONS,\n    now ? `Aktuálny čas používateľa podľa appky: ${now}` : "",\n    imageTurnInstruction,\n  ].filter(Boolean).join("\\n\\n");\n'''
          if old not in text:
              raise SystemExit('request instruction block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('functions/stylist/sol_agent_v2.test.js')
          tests = test_path.read_text(encoding='utf-8')
          needle = '''  assert.match(body.instructions, /najprv daj konkrétny verdikt/i);\n  assert.match(body.instructions, /Neodkladaj celé hodnotenie/i);\n  assert.match(body.instructions, /Nepýtaj znovu názov udalosti, miesto, zámer/i);\n'''
          replacement = needle + '''  assert.match(body.instructions, /TENTO TURN OBSAHUJE OBRÁZOK/i);\n  assert.match(body.instructions, /NESMIE byť iba spresňujúca otázka/i);\n  assert.match(body.instructions, /Predchádzajúca otázka asistenta/i);\n'''
          if needle not in tests:
              raise SystemExit('photo test assertion block not found')
          tests = tests.replace(needle, replacement, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          git diff --check
          grep -F "TENTO TURN OBSAHUJE OBRÁZOK" functions/stylist/sol_agent_v2.js
          grep -F "NESMIE byť iba spresňujúca otázka" functions/stylist/sol_agent_v2.test.js
          cd functions
          node --test stylist/sol_agent_v2.test.js

      - name: Commit image-turn guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/stylist/sol_agent_v2.js functions/stylist/sol_agent_v2.test.js
          git commit -m "fix: force substantive Sol image verdicts"
          git push origin HEAD:brain-v2-sol-agent
