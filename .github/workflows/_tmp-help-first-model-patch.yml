name: Temporary help-first model patch

on:
  push:
    branches:
      - stylist-v2-help-first-contract
    paths:
      - '.github/workflows/_tmp-help-first-model-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: stylist-v2-help-first-contract
          fetch-depth: 1
      - name: Make explicit-location outfit requests one efficient tool phase
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          path = Path('functions/stylist/v2/openai_stylist_model_port_v2.js')
          text = path.read_text(encoding='utf-8')
          old = '''function enforceHighConfidenceGrounding(raw) {
            return raw;
          }'''.replace('          ', '')
          replacement_b64 = ''
          replacement = base64.b64decode(replacement_b64).decode('utf-8')
          if old not in text:
            raise SystemExit('expected compatibility function not found')
          path.write_text(text.replace(old, replacement, 1), encoding='utf-8')
          PY
      - name: Commit model patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp-help-first-model-patch.yml
          git add functions/stylist/v2/openai_stylist_model_port_v2.js
          git commit -m "perf: combine explicit location and wardrobe planning"
          git push origin HEAD:stylist-v2-help-first-contract
