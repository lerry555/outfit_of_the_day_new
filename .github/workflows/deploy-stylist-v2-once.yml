name: Deploy Stylist V2 once

on:
  push:
    branches:
      - stylist-simple-agent
    paths:
      - .github/workflows/deploy-stylist-v2-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard frozen refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            stylist-simple-agent \
            brain-v1-experiment \
            hardening/stylist-deterministic-shell-20260913
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/hardening/stylist-deterministic-shell-20260913)" = "035a65f45b782bf4cac023e3ff960f1fb1113bcf"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 5e1960221b2ba5779316f96035be07d232cdd547 "${GITHUB_SHA}"

      - name: Checkout canonical merge for deploy
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 5e1960221b2ba5779316f96035be07d232cdd547
          test "$(git rev-parse HEAD)" = "5e1960221b2ba5779316f96035be07d232cdd547"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy only stylistChatV2
        run: firebase deploy --only functions:stylistChatV2 --project outfitoftheday-4d401 --non-interactive
