name: Temporary help-first acceptance patch

on:
  push:
    branches:
      - stylist-v2-help-first-contract
    paths:
      - '.github/workflows/_tmp-help-first-acceptance-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: stylist-v2-help-first-contract
          fetch-depth: 1
      - name: Patch obsolete remote-event acceptance flow
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          path = Path('functions/stylist/v2/stylist_v2_phase0_acceptance.test.js')
          text = path.read_text(encoding='utf-8')
          start_marker = 'test("remote concert and wedding use their provider-resolved event location as generic weather authority", async () => {'
          end_marker = '\n\ntest("explicit destination candidate is resolved in the first hiking turn without a repeat question"'
          replacement_b64 = ''
          replacement = base64.b64decode(replacement_b64).decode('utf-8')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - name: Commit patched acceptance and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp-help-first-acceptance-patch.yml
          git add functions/stylist/v2/stylist_v2_phase0_acceptance.test.js
          git commit -m "test: align remote event acceptance with help-first flow"
          git push origin HEAD:stylist-v2-help-first-contract
