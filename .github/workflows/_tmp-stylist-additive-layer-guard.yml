name: Stylist additive layer guard one-shot

on:
  push:
    branches:
      - brain-v1-experiment
    paths:
      - .github/workflows/_tmp-stylist-additive-layer-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard experiment branch and master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin brain-v1-experiment master
          test "$GITHUB_REF_NAME" = "brain-v1-experiment"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/master)" = "00bd52fa20f1e5b281d66850758c465dc2b00098"
          git merge-base --is-ancestor 4a4a4636a55c2d227a93aaacd63b46d5c9080b53 HEAD

      - name: Apply product patch
        run: python .github/scripts/_tmp_stylist_additive_layer_guard.py

      - name: Verify diff
        run: git diff --check

      - name: Commit product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lerry555"
          git config user.email "132705754+lerry555@users.noreply.github.com"
          git add lib/utils/stylist_outfit_directive_guard.dart lib/screens/stylist_chat_screen.dart test/brain_v1_v2_offline_bundle_test.dart
          git diff --cached --quiet && { echo "No patch produced"; exit 1; }
          git commit -m "fix: honor additive Stylist layer requests"
          git push origin HEAD:brain-v1-experiment
