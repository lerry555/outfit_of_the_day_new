name: AI Stylist V2 help-first clarification one-shot

on:
  push:
    branches:
      - fix/stylist-v2-help-first-clarifications-20260910
    paths:
      - .github/workflows/_tmp-help-first-clarifications.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact source refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment fix/stylist-v2-help-first-clarifications-20260910
          test "$GITHUB_REF_NAME" = "fix/stylist-v2-help-first-clarifications-20260910"
          test "$(git rev-parse origin/stylist-simple-agent)" = "d66d926dce405f308f7c5855704898f89b225f3c"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/fix/stylist-v2-help-first-clarifications-20260910)" = "$GITHUB_SHA"
          changed="$(git diff --name-only origin/stylist-simple-agent HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/_tmp_apply_help_first_clarifications.py' \
            '.github/_tmp_update_help_first_expectations.py' \
            '.github/workflows/_tmp-help-first-clarifications.yml' | sort)"
          test "$changed" = "$expected"

      - name: Apply product patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/_tmp_apply_help_first_clarifications.py
          python3 .github/_tmp_update_help_first_expectations.py

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Function dependencies
        working-directory: functions
        run: npm ci

      - name: Run full Stylist V2 backend suite
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node --check index_v2.js
          node --check stylist/v2/stylist_turn_coordinator_v2.js
          node --check stylist/v2/stylist_grounding_policy_v2.js
          node --check stylist/v2/stylist_preflight_v2.js
          node --check stylist/v2/openai_stylist_model_port_v2.js
          tests="$(find stylist/v2 -maxdepth 1 -name '*.test.js' ! -name 'stylist_session_firestore_emulator.test.js' -print | sort)"
          node --test $tests

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter dependencies
        run: flutter pub get

      - name: Run Stylist Flutter regressions
        shell: bash
        run: |
          set -euo pipefail
          flutter test test/stylist_simple_agent_fast_path_test.dart
          flutter test test/stylist_quick_reply_contract_test.dart
          flutter test --dart-define=SHOPPING_UI_ENABLED=false --dart-define=SHOPPING_FIXTURE_MODE=false test/stylist_shopping_runtime_test.dart

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f functions/stylist/v2/stylist_help_first_torture_v2.test.js
          changed="$(git diff --name-only origin/stylist-simple-agent | sort)"
          expected="$(printf '%s\n' \
            '.github/_tmp_apply_help_first_clarifications.py' \
            '.github/_tmp_update_help_first_expectations.py' \
            '.github/workflows/_tmp-help-first-clarifications.yml' \
            'functions/stylist/v2/openai_stylist_model_port_v2.js' \
            'functions/stylist/v2/stylist_grounding_policy_v2.js' \
            'functions/stylist/v2/stylist_help_first_contract_v2.test.js' \
            'functions/stylist/v2/stylist_help_first_torture_v2.test.js' \
            'functions/stylist/v2/stylist_preflight_v2.js' \
            'functions/stylist/v2/stylist_release_gate_v2.test.js' \
            'functions/stylist/v2/stylist_turn_coordinator_v2.js' \
            'functions/stylist/v2/stylist_v2_phase0_acceptance.test.js' | sort)"
          test "$changed" = "$expected"

      - name: Re-guard refs and commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment fix/stylist-v2-help-first-clarifications-20260910
          test "$(git rev-parse origin/stylist-simple-agent)" = "d66d926dce405f308f7c5855704898f89b225f3c"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/fix/stylist-v2-help-first-clarifications-20260910)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            functions/stylist/v2/openai_stylist_model_port_v2.js \
            functions/stylist/v2/stylist_grounding_policy_v2.js \
            functions/stylist/v2/stylist_help_first_contract_v2.test.js \
            functions/stylist/v2/stylist_help_first_torture_v2.test.js \
            functions/stylist/v2/stylist_preflight_v2.js \
            functions/stylist/v2/stylist_release_gate_v2.test.js \
            functions/stylist/v2/stylist_turn_coordinator_v2.js \
            functions/stylist/v2/stylist_v2_phase0_acceptance.test.js
          git diff --cached --check
          git commit -m "fix: make Stylist clarifications help-first"
          git push origin HEAD:fix/stylist-v2-help-first-clarifications-20260910
