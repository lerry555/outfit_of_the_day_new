name: AI Stylist V2 Phase 3 one-shot deploy

on:
  push:
    branches:
      - deploy-stylist-v2-phase3
    paths:
      - .github/workflows/_tmp-stylist-v2-phase3-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/deploy-stylist-v2-phase3'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin deploy-stylist-v2-phase3 stylist-simple-agent brain-v1-experiment
          test "$GITHUB_REF_NAME" = "deploy-stylist-v2-phase3"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/deploy-stylist-v2-phase3)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/stylist-simple-agent)" = "a989d4539212be426648d21d939d001308c924ba"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          changed="$(git diff --name-only origin/stylist-simple-agent HEAD)"
          test "$changed" = ".github/workflows/_tmp-stylist-v2-phase3-deploy.yml"

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Install Function dependencies
        working-directory: functions
        run: npm ci

      - name: Generate deploy taxonomy artifacts
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const g = require('./functions/scripts/generate_deploy_taxonomy_artifacts');
          g.generateFamilyRegistry();
          g.generateStructuredTaxonomy();
          NODE
          test -s functions/artifacts/vision_canonical_family_registry_v1.json
          test -s functions/artifacts/canonical_resolver_structured_taxonomy_v1.json

      - name: Re-run focused V2 production tests
        working-directory: functions
        run: |
          node --check index_v2.js
          node --test stylist/v2/stylist_v2_phase3_ports.test.js

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Deploy V2 callable
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --only functions:stylistChatV2 \
            --project outfitoftheday-4d401 \
            --non-interactive
