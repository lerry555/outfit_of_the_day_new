name: Wardrobe live web preview
on:
  workflow_dispatch:
  push:
    branches: [experiment/dev-mobile]
    paths:
      - 'lib/main_web_wardrobe.dart'
      - 'lib/screens/wardrobe_read_only_cover_flow.dart'
      - 'lib/utils/wardrobe_image_url_priority.dart'
      - 'lib/utils/wardrobe_list_utils.dart'
      - '.github/workflows/wardrobe-web-preview.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: wardrobe-web-preview
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Firebase web configuration is supplied by WEB_FIREBASE_CONFIG.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: true
      - name: Prepare Firebase web config from existing GitHub secret
        env:
          FIREBASE_CONFIG: ${{ secrets.WEB_FIREBASE_CONFIG }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          raw = os.environ.get('FIREBASE_CONFIG', '')
          if not raw:
              raise SystemExit('Missing WEB_FIREBASE_CONFIG GitHub Actions secret')
          names = {
              'apiKey': 'WEB_FIREBASE_API_KEY',
              'appId': 'WEB_FIREBASE_APP_ID',
              'messagingSenderId': 'WEB_FIREBASE_MESSAGING_SENDER_ID',
              'projectId': 'WEB_FIREBASE_PROJECT_ID',
              'authDomain': 'WEB_FIREBASE_AUTH_DOMAIN',
              'storageBucket': 'WEB_FIREBASE_STORAGE_BUCKET',
          }
          values = {}
          for source, target in names.items():
              match = re.search(r'\b' + source + r'\s*:\s*"([^"]+)"', raw)
              if not match:
                  raise SystemExit('Firebase config missing field: ' + source)
              values[target] = match.group(1)
          if values['WEB_FIREBASE_PROJECT_ID'] != 'outfitoftheday-4d401':
              raise SystemExit('Firebase project ID mismatch')
          Path('/tmp/wardrobe-web-defines.json').write_text(json.dumps(values))
          PY
      - name: Build real Wardrobe web preview
        run: |
          flutter pub get
          flutter build web --release --target lib/main_web_wardrobe.dart \
            --base-href /outfit_of_the_day_new/ \
            --dart-define-from-file=/tmp/wardrobe-web-defines.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
