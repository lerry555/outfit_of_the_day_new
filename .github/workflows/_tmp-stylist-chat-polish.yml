name: Temporary Stylist chat polish runner

on:
  push:
    branches:
      - fix/stylist-chat-polish-images-20260911
    paths:
      - .github/workflows/_tmp-stylist-chat-polish.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout guarded work branch
        uses: actions/checkout@v4
        with:
          ref: fix/stylist-chat-polish-images-20260911
          fetch-depth: 0

      - name: Use Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Apply focused product patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count} for {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Zero-token, rotating local welcome prompts. Legacy "Ahoj :)" is
          # recognized only so old chats do not keep sending it back to Brain.
