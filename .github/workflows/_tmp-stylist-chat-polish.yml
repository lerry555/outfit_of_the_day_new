name: Temporary Stylist chat polish runner

on:
  push:
    branches:
      - fix/stylist-chat-polish-images-20260911
    paths:
      - '.github/workflows/_tmp-stylist-chat-polish.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout guarded work branch
        uses: actions/checkout@v4
        with:
          ref: fix/stylist-chat-polish-images-20260911
          fetch-depth: 0

      - name: Use Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Apply focused product patch
        run: python3 .github/scripts/_tmp_stylist_chat_polish.py

      - name: Format focused Dart files
        run: >-
          dart format
          lib/utils/stylist_welcome_message.dart
          lib/widgets/stylist_suggested_item_card.dart
          lib/Services/stylist_simple_agent_service_v1.dart
          test/stylist_simple_agent_fast_path_test.dart
          test/stylist_card_image_priority_test.dart

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Install function dependencies
        working-directory: functions
        run: npm ci --ignore-scripts

      - name: Static checks
        run: |
          git diff --check
          node --check functions/stylist/v2/openai_one_brain_model_port_v2.js
          node --check functions/stylist/v2/stylist_one_brain_runtime_v2.test.js
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/Services/stylist_simple_agent_service_v1.dart \
            lib/screens/stylist_chat_screen.dart \
            lib/widgets/stylist_suggested_item_card.dart \
            lib/utils/stylist_card_image_priority.dart \
            lib/utils/stylist_welcome_message.dart

      - name: Targeted Flutter regressions
        run: >-
          flutter test
          test/stylist_simple_agent_fast_path_test.dart
          test/stylist_card_image_priority_test.dart
          test/stylist_quick_reply_contract_test.dart
          test/stylist_chat_progress_test.dart

      - name: One-Brain regression
        run: node --test functions/stylist/v2/stylist_one_brain_runtime_v2.test.js

      - name: Guard canonical heads before product commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment fix/stylist-chat-polish-images-20260911
          PROD="$(git rev-parse origin/stylist-simple-agent)"
          BRAIN="$(git rev-parse origin/brain-v1-experiment)"
          WORK="$(git rev-parse origin/fix/stylist-chat-polish-images-20260911)"
          echo "production=$PROD"
          echo "brain=$BRAIN"
          echo "work=$WORK"
          test "$PROD" = "eaae833afdc0fd9f9b166467c2e002c5050c5045"
          test "$BRAIN" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$WORK" = "$GITHUB_SHA"

      - name: Commit tested product and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp-stylist-chat-polish.yml
          git rm .github/scripts/_tmp_stylist_chat_polish.py
          git add \
            lib/utils/stylist_welcome_message.dart \
            lib/screens/stylist_chat_screen.dart \
            lib/widgets/stylist_suggested_item_card.dart \
            lib/Services/stylist_simple_agent_service_v1.dart \
            functions/stylist/v2/openai_one_brain_model_port_v2.js \
            functions/stylist/v2/stylist_one_brain_runtime_v2.test.js \
            test/stylist_simple_agent_fast_path_test.dart \
            test/stylist_card_image_priority_test.dart
          git diff --cached --check
          git commit -m "feat: polish Stylist welcome tone and wardrobe images"

          # Required fresh guard immediately before the branch write.
          git fetch origin stylist-simple-agent brain-v1-experiment fix/stylist-chat-polish-images-20260911
          test "$(git rev-parse origin/stylist-simple-agent)" = "eaae833afdc0fd9f9b166467c2e002c5050c5045"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/fix/stylist-chat-polish-images-20260911)" = "$GITHUB_SHA"
          git push origin HEAD:fix/stylist-chat-polish-images-20260911
