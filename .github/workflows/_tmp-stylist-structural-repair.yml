name: Stylist structural repair patch

on:
  push:
    branches:
      - fix/stylist-v2-structural-repair-20260912
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stylist-v2-structural-repair-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply focused patch
        run: python tools/_tmp_structural_repair_patch.py
      - name: Syntax checks
        run: |
          node --check functions/stylist/v2/stylist_one_brain_engine_v2.js
          node --check functions/stylist/v2/openai_one_brain_model_port_v2.js
          node --check functions/stylist/v2/stylist_structural_repair_followup_v2.test.js
      - name: Exact real-flow regression
        run: node --test functions/stylist/v2/stylist_structural_repair_followup_v2.test.js
      - name: One-Brain runtime regression
        run: node --test functions/stylist/v2/stylist_one_brain_runtime_v2.test.js
      - name: Related location regressions
        run: |
          node --test functions/stylist/v2/stylist_pending_location_v2.test.js
          node --test functions/stylist/v2/stylist_general_location_layering_v2.test.js
          node --test functions/stylist/v2/stylist_help_first_contract_v2.test.js
      - name: Commit tested product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/stylist/v2/stylist_one_brain_engine_v2.js
          git add functions/stylist/v2/openai_one_brain_model_port_v2.js
          git add functions/stylist/v2/stylist_structural_repair_followup_v2.test.js
          git rm .github/workflows/_tmp-stylist-structural-repair.yml
          git rm tools/_tmp_structural_repair_patch.py
          git commit -m 'fix: repair one structural One-Brain tool decision'
          git push origin HEAD:fix/stylist-v2-structural-repair-20260912
