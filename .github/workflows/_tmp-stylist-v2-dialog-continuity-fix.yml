name: _tmp Stylist V2 dialog continuity fix

on:
  push:
    branches:
      - fix/stylist-v2-dialog-continuity-20260909
    paths:
      - .github/workflows/_tmp-stylist-v2-dialog-continuity-fix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stylist-v2-dialog-continuity-20260909
          fetch-depth: 0

      - name: Guard refs and isolated branch
        shell: bash
        run: |
          set -euo pipefail
          expected_target="0dc7ea2c3096c100d1277b1d2a7fe5c22ce83533"
          expected_brain="7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          git fetch origin stylist-simple-agent brain-v1-experiment
          test "$(git rev-parse origin/stylist-simple-agent)" = "$expected_target"
          test "$(git rev-parse origin/brain-v1-experiment)" = "$expected_brain"
          git merge-base --is-ancestor "$expected_target" HEAD
          changed="$(git diff --name-only "$expected_target"...HEAD)"
          test "$changed" = ".github/workflows/_tmp-stylist-v2-dialog-continuity-fix.yml"

      - name: Apply scoped dialog fixes and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          agent = Path('functions/stylist/simple_stylist_agent_v1.js')
          text = agent.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 anchor, found {count}')
