          replace_once(
              '    quickReplyMode: value.quickReplyMode,\n    selectionReasons: value.selectionReasons,',
              '    quickReplyMode: value.quickReplyMode,\n'
              '    ...(quickReplyPresentation.quickReplyPrompt ? {quickReplyPrompt: quickReplyPresentation.quickReplyPrompt} : {}),\n'
              '    selectionReasons: value.selectionReasons,',
              'materializer quickReplyPrompt field',
          )

          replace_once(
              '  validateAgentResultV1,\n  materializeResultV1,',
              '  validateAgentResultV1,\n  quickReplyPresentationV1,\n  materializeResultV1,',
