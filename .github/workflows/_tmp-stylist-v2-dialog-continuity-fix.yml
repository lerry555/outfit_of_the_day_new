name: _tmp Stylist V2 scenario memory fix

on:
  push:
    branches:
      - fix/stylist-v2-dialog-continuity-20260909
    paths:
      - .github/workflows/_tmp-stylist-v2-dialog-continuity-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stylist-v2-dialog-continuity-20260909
          fetch-depth: 0

      - name: Guard refs before patch
        shell: bash
        run: |
          set -euo pipefail
          expected_target="0dc7ea2c3096c100d1277b1d2a7fe5c22ce83533"
          expected_brain="7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          expected_work="${{ github.sha }}"
          git fetch origin stylist-simple-agent brain-v1-experiment fix/stylist-v2-dialog-continuity-20260909
          test "$(git rev-parse origin/stylist-simple-agent)" = "$expected_target"
          test "$(git rev-parse origin/brain-v1-experiment)" = "$expected_brain"
          test "$(git rev-parse origin/fix/stylist-v2-dialog-continuity-20260909)" = "$expected_work"
          git merge-base --is-ancestor "$expected_target" HEAD
          changed="$(git diff --name-only "$expected_target"...HEAD)"
          expected_changed="$(printf '%s\n%s' '.github/_tmp_apply_stylist_v2_fix.py' '.github/workflows/_tmp-stylist-v2-dialog-continuity-fix.yml')"
          test "$changed" = "$expected_changed"

      - name: Apply global V2 scenario-memory fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.github/_tmp_apply_stylist_v2_fix.py')
          text = p.read_text(encoding='utf-8')
          start = text.index("old_cta = '''")
          marker = 'replace_once(path, old_cta, new_cta, "shopping CTA")'
          end = text.index(marker, start) + len(marker)
          replacement = """replace_once(path, '    return \"Chceš, aby som ti vybral vhodnejšie turistické topánky?\";\\n', '    return \"Chceš, aby som ti pozrel vhodné topánky v obchodoch?\";\\n', 'shopping CTA hiking')
replace_once(path, '    return \"Chceš, aby som ti vybral vhodnejšie topánky?\";\\n', '    return \"Chceš, aby som ti pozrel vhodné topánky v obchodoch?\";\\n', 'shopping CTA footwear')
replace_once(path, '  return \"Chceš, aby som ti vybral vhodnejší kúsok do šatníka?\";\\n', '  return \"Chceš, aby som ti pozrel možnosti v obchodoch?\";\\n', 'shopping CTA generic')"""
          p.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

          python3 .github/_tmp_apply_stylist_v2_fix.py

          python3 - <<'PY'
          from pathlib import Path

          p = Path("functions/stylist/v2/stylist_scenario_memory_v2.js")
          text = p.read_text(encoding="utf-8")
          old = "  next.scenarioMemory.activeScenarioId = null;"
          new = "  next.scenarioMemory = next.scenarioMemory || {activeScenarioId: null, snapshots: []};\n  next.scenarioMemory.activeScenarioId = null;"
          if text.count(old) != 1:
              raise SystemExit("scenarioMemory bootstrap hotfix anchor mismatch")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")

          p = Path("functions/stylist/v2/openai_stylist_model_port_v2.js")
          text = p.read_text(encoding="utf-8")
          old = r"\bdazd|\bprsi|\bsneh|\bsnezi|\bvietor|\bfuka"
          new = r"\bdazd|dážď|\bprsi|prší|\bsneh|\bsnezi|sneží|\bvietor|\bfuka|fúka"
          if text.count(old) != 1:
              raise SystemExit("indoor weather diacritics hotfix anchor mismatch")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Run V2 backend regressions
        shell: bash
        run: |
          set -euo pipefail
          tests="$(find functions/stylist/v2 -maxdepth 1 -name '*.test.js' ! -name 'stylist_session_firestore_emulator.test.js' -print | sort)"
          node --test $tests

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Run Flutter Stylist regressions
        run: |
          flutter test test/stylist_simple_agent_fast_path_test.dart
          flutter test test/stylist_quick_reply_contract_test.dart
          flutter test test/stylist_shopping_runtime_test.dart

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test -f functions/stylist/v2/stylist_scenario_memory_v2.js
          test -f functions/stylist/v2/stylist_dialog_continuity_v2.test.js

      - name: Re-guard refs before product commit
        shell: bash
        run: |
          set -euo pipefail
          expected_target="0dc7ea2c3096c100d1277b1d2a7fe5c22ce83533"
          expected_brain="7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          expected_work="${{ github.sha }}"
          git fetch origin stylist-simple-agent brain-v1-experiment fix/stylist-v2-dialog-continuity-20260909
          test "$(git rev-parse origin/stylist-simple-agent)" = "$expected_target"
          test "$(git rev-parse origin/brain-v1-experiment)" = "$expected_brain"
          test "$(git rev-parse origin/fix/stylist-v2-dialog-continuity-20260909)" = "$expected_work"

      - name: Commit tested product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/stylist/v2/stylist_session_state_v2.js functions/stylist/v2/stylist_scenario_memory_v2.js functions/stylist/v2/stylist_grounding_policy_v2.js functions/stylist/v2/openai_stylist_model_port_v2.js functions/stylist/v2/stylist_turn_coordinator_v2.js functions/stylist/v2/stylist_dialog_continuity_v2.test.js lib/Services/stylist_simple_agent_service_v1.dart test/stylist_simple_agent_fast_path_test.dart
          git diff --cached --check
          git commit -m "fix: preserve AI Stylist scenario continuity"
          git push origin HEAD:fix/stylist-v2-dialog-continuity-20260909
