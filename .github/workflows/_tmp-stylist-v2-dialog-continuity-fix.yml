              '    "Ak návrat k skoršiemu scenáru zároveň žiada outfit zobraziť, vytvoriť alebo zmeniť, nastav outfitRequested=true. Rekonštruuj vhodný outfit pre odkazovaný scenár z wardrobeV2 a recentConversationHistory namiesto opakovanej otázky na už známe miesto alebo čas.",',
              'backreference prompt',
          )

          replace_once(
              '    "weatherContextKey urči podľa celej konverzácie: today alebo tomorrow pre daný deň, current pre aktívny/event kontext, none ak počasie nie je relevantné.",',
              '    "weatherContextKey urči podľa celej konverzácie: today alebo tomorrow pre daný deň, current pre aktívny/event kontext, none ak počasie nie je relevantné.",\n'
              '    "Pri indoor udalosti alebo cieli (kino, divadlo, reštaurácia, kancelária či iný interiér) je vonkajšia predpoveď iba kontext na cestu, pobyt vonku a prípadnú vrchnú vrstvu. Nikdy nehovor, že v kine, divadle, reštaurácii alebo kancelárii je podľa vonkajšej predpovede napríklad 23–31 °C, teplo, sucho či daždivo. Ak počasie spomenieš, jasne povedz \'vonku\' alebo \'na cestu\'; vnútornú teplotu nepoznáš. Klimatizáciu môžeš uviesť ako možnosť, nie ako fakt.",',
              'indoor weather prompt',
          )

          replace_once(
              '      "Keď v NOVOM návrhu sám prvýkrát pomenuješ skutočne chýbajúci vhodný kúpiteľný kus, MUSÍ po obmedzení nasledovať presná záverečná otázka \'Chceš, aby som pozrel možnosti v obchodoch?\' a quickReplyMode=yes_no. Platí to aj pri conditional kompromise, keď sám pomenuješ chýbajúci vhodnejší pár. Skráť opis outfitu, aby sa otázka zmestila do 500 znakov. Neopakuj ju, ak už zaznela alebo ju používateľ odmietol, a nepripájaj ju k nesúvisiacej otázke." :',
              '      "Keď v NOVOM návrhu sám prvýkrát pomenuješ skutočne chýbajúci vhodný kúpiteľný kus, MUSÍ po obmedzení nasledovať záverečná nákupná otázka a quickReplyMode=yes_no. Ak ide o chýbajúcu alebo iba kompromisnú obuv, použi presne \'Chceš, aby som ti pozrel vhodné topánky v obchodoch?\'. Pri inom kuse použi \'Chceš, aby som pozrel možnosti v obchodoch?\'. Skráť opis outfitu, aby sa otázka zmestila do 500 znakov. Neopakuj ju, ak už zaznela alebo ju používateľ odmietol, a nepripájaj ju k nesúvisiacej otázke." :',
              'shopping CTA prompt',
          )

          old_materialize = '''function materializeResultV1(validated, request) {
            const value = validated.value;
            const publicById = new Map();'''
          new_materialize = '''function quickReplyPresentationV1(stylistComment, quickReplyMode, request, footwearAssessment) {
            const original = cleanText(stylistComment, 500);
            if (quickReplyMode !== "yes_no" || !original) {
              return Object.freeze({stylistComment: original, quickReplyPrompt: null});
            }
            const questionMark = original.lastIndexOf("?");
            if (questionMark < 0) {
              return Object.freeze({stylistComment: original, quickReplyPrompt: null});
            }
            let questionStart = 0;
            for (let i = questionMark - 1; i >= 0; i -= 1) {
              if (original[i] === "." || original[i] === "!" || original[i] === "?" || original[i] === "\\n") {
                questionStart = i + 1;
                break;
              }
            }
            const prefix = original.slice(0, questionStart).trimEnd();
            let prompt = original.slice(questionStart).trim();
            let normalizedComment = original;
            const footwearShopping = request?.shoppingEnabled === true &&
              ["conditional", "missing"].includes(footwearAssessment?.status) &&
              footwearAssessment?.use !== "none";
            if (footwearShopping) {
              prompt = "Chceš, aby som ti pozrel vhodné topánky v obchodoch?";
              normalizedComment = prefix ? `${prefix} ${prompt}` : prompt;
            }
            return Object.freeze({stylistComment: normalizedComment, quickReplyPrompt: prompt || null});
          }

          function materializeResultV1(validated, request) {
            const value = validated.value;
            const publicById = new Map();'''
          replace_once(old_materialize, new_materialize, 'quick reply materializer helper')

          replace_once(
              '  const stylistComment = value.stylistComment || fallbackStylistCommentV1(value);\n  return Object.freeze({',
              '  const baseStylistComment = value.stylistComment || fallbackStylistCommentV1(value);\n'
              '  const quickReplyPresentation = quickReplyPresentationV1(\n'
