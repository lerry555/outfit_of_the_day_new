name: _tmp Stylist V2 dialog continuity fix

on:
  push:
    branches:
      - fix/stylist-v2-dialog-continuity-20260909
    paths:
      - .github/workflows/_tmp-stylist-v2-dialog-continuity-fix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stylist-v2-dialog-continuity-20260909
          fetch-depth: 0

      - name: Guard refs and isolated branch
        shell: bash
        run: |
          set -euo pipefail
          expected_target="0dc7ea2c3096c100d1277b1d2a7fe5c22ce83533"
          expected_brain="7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          git fetch origin stylist-simple-agent brain-v1-experiment
          test "$(git rev-parse origin/stylist-simple-agent)" = "$expected_target"
          test "$(git rev-parse origin/brain-v1-experiment)" = "$expected_brain"
          git merge-base --is-ancestor "$expected_target" HEAD
          changed="$(git diff --name-only "$expected_target"...HEAD)"
          test "$changed" = ".github/workflows/_tmp-stylist-v2-dialog-continuity-fix.yml"

      - name: Apply scoped dialog fixes and regression tests
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/stylist_dialog_patch.py
          python3 /tmp/stylist_dialog_patch.py
          git diff --check
          git diff --stat

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Run Stylist backend regressions
        run: |
          node --test \
            functions/stylist/simple_stylist_dialog_continuity_v1.test.js \
            functions/stylist/simple_stylist_agent_v1.test.js \
            functions/stylist/stylist_fast_chat_v2.test.js \
            functions/stylist/stylist_production_bridge_v2.test.js \
            functions/stylist/stylist_release_gate_v2.test.js

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run quick-reply Flutter regression
        run: |
          flutter pub get
          flutter test test/stylist_quick_reply_prompt_test.dart

      - name: Commit scoped fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            functions/stylist/simple_stylist_agent_v1.js \
            functions/stylist/simple_stylist_dialog_continuity_v1.test.js \
            lib/widgets/stylist_quick_reply_buttons.dart \
            lib/screens/stylist_chat_screen.dart \
            test/stylist_quick_reply_prompt_test.dart
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix: preserve Stylist scenario context and shopping CTA"
          git push origin HEAD:fix/stylist-v2-dialog-continuity-20260909
