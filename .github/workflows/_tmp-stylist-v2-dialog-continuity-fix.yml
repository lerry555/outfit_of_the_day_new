          widget_anchor = "import 'package:flutter/material.dart';\n\n"
          helper = '''import 'package:flutter/material.dart';

String stylistBubbleTextWithoutQuickReplyPrompt({
  required String text,
  String? prompt,
}) {
  final full = text.trim();
  final quickPrompt = (prompt ?? '').trim();
  if (quickPrompt.isEmpty || !full.endsWith(quickPrompt)) return full;
  return full.substring(0, full.length - quickPrompt.length).trimRight();
}

'''
          if widget_text.count(widget_anchor) != 1:
              raise SystemExit('quick reply widget import anchor mismatch')
          widget.write_text(widget_text.replace(widget_anchor, helper, 1), encoding='utf-8')

          screen = Path('lib/screens/stylist_chat_screen.dart')
          screen_text = screen.read_text(encoding='utf-8')
          old = '    final hasText = message.text.trim().isNotEmpty;'
          new = '''    final displayText = stylistBubbleTextWithoutQuickReplyPrompt(
      text: message.text,
      prompt: message.quickReplyPrompt,
    );
    final hasText = displayText.isNotEmpty;'''
          if screen_text.count(old) != 1:
              raise SystemExit(f'screen hasText anchor mismatch: {screen_text.count(old)}')
          screen_text = screen_text.replace(old, new, 1)
          old = '''                    Text(
                      message.text,
                      style: TextStyle('''
          new = '''                    Text(
                      displayText,
                      style: TextStyle('''
          if screen_text.count(old) != 1:
              raise SystemExit(f'screen Text anchor mismatch: {screen_text.count(old)}')
          screen.write_text(screen_text.replace(old, new, 1), encoding='utf-8')

          node_test = Path('functions/stylist/simple_stylist_dialog_continuity_v1.test.js')
          node_test.write_text(r'''"use strict";

const test = require("node:test");
const assert = require("node:assert/strict");
const {
  createSimpleStylistAgentV1,
  quickReplyPresentationV1,
} = require("./simple_stylist_agent_v1");

test("dialog prompt preserves resolved backreferences and scopes weather outside indoor venues", async () => {
  let captured;
  const agent = createSimpleStylistAgentV1({
    executeModel: async (input) => {
      captured = input;
      return {
        stylistComment: "Jasné.",
        resultingOutfitItemIds: [],
        displayItemIds: [],
        outfitChanged: false,
        outfitRequested: false,
        quickReplyMode: "none",
        weatherContextKey: "none",
        hardRequirementEvidence: [],
        commentGroundingEvidence: [],
        selectionReasons: [],
        footwearAssessment: {
          use: "none",
          weatherWindow: "unknown",
          status: "not_applicable",
          message: "",
        },
      };
    },
    logger: {info() {}, warn() {}},
  });
  await agent.resolve({
    message: "mohol by si mi ukázať outfit na tú túru ale s iným tričkom?",
    history: [
      {role: "user", content: "zajtra idem na túru a potrebujem outfit"},
      {role: "assistant", content: "Kam približne ideš?"},
      {role: "user", content: "do tatier"},
      {role: "assistant", content: "Na zajtrajšiu túru v Tatrách vyberám vrstvenie."},
      {role: "user", content: "dobre a dnes do kina?"},
      {role: "assistant", content: "Vonku je teplo; do kina stačí ľahký outfit."},
    ],
    currentOutfitItemIds: [],
    wardrobeItems: [],
    weatherContext: {},
    clientContext: {},
    shoppingEnabled: true,
  });
  assert.ok(captured);
  const system = captured.messages[0].content;
  assert.match(system, /skorší plán/);
  assert.match(system, /Nepýtaj sa znova na údaj/);
  assert.match(system, /indoor udalosti alebo cieli/);
  assert.match(system, /vonkajšia predpoveď iba kontext na cestu/);
  assert.match(system, /Chceš, aby som ti pozrel vhodné topánky v obchodoch\?/);
});

test("footwear shopping quick reply gets a specific prompt while preserving it in stored assistant text", () => {
  const result = quickReplyPresentationV1(
    "Tenisky sú iba kompromis do ľahkého suchého terénu. Chceš, aby som pozrel možnosti v obchodoch?",
    "yes_no",
    {shoppingEnabled: true},
    {status: "conditional", use: "terrain"},
  );
  assert.equal(result.quickReplyPrompt, "Chceš, aby som ti pozrel vhodné topánky v obchodoch?");
  assert.equal(
    result.stylistComment,
    "Tenisky sú iba kompromis do ľahkého suchého terénu. Chceš, aby som ti pozrel vhodné topánky v obchodoch?",
  );
});

test("ordinary yes-no prompt is extracted without changing assistant history text", () => {
  const text = "Táto mikina funguje. Chceš skúsiť inú farbu?";
  const result = quickReplyPresentationV1(text, "yes_no", {shoppingEnabled: false}, {
    status: "not_applicable", use: "none",
  });
  assert.equal(result.stylistComment, text);
  assert.equal(result.quickReplyPrompt, "Chceš skúsiť inú farbu?");
});
''', encoding='utf-8')

          dart_test = Path('test/stylist_quick_reply_prompt_test.dart')
          dart_test.write_text(r'''import 'package:flutter_test/flutter_test.dart';
import 'package:outfitofTheDay/widgets/stylist_quick_reply_buttons.dart';

void main() {
