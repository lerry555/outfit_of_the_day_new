name: Brain V1 exact runtime log read

on:
  push:
    branches:
      - brain-v1-experiment
    paths:
      - .github/workflows/_tmp-brain-v1-deployed-qa.yml

permissions:
  contents: read

jobs:
  runtime-log-read:
    if: github.ref == 'refs/heads/brain-v1-experiment'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Verify experiment branch and trigger HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "brain-v1-experiment"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Read exact failed Brain execution
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read \
            'resource.type="cloud_function" AND resource.labels.function_name="stylistChat" AND resource.labels.region="us-east1" AND labels.execution_id="y2ji2cwjc8kn"' \
            --project outfitoftheday-4d401 \
            --order=asc \
            --limit=100 \
            --format=json
