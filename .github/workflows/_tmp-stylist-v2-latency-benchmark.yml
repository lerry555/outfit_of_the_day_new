name: AI Stylist V2 latency benchmark

on:
  push:
    branches:
      - perf/stylist-v2-latency-20260909
    paths:
      - .github/workflows/_tmp-stylist-v2-latency-benchmark.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact benchmark candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment perf/stylist-v2-latency-20260909
          TARGET="$(git rev-parse origin/stylist-simple-agent)"
          BRAIN="$(git rev-parse origin/brain-v1-experiment)"
          WORK="$(git rev-parse origin/perf/stylist-v2-latency-20260909)"
          test "$TARGET" = "35a64f19ced603841e6eaeadb7f1a04e3a62b2ee"
          test "$BRAIN" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$WORK" = "$GITHUB_SHA"
          test "$(git merge-base origin/stylist-simple-agent HEAD)" = "$TARGET"
          test "$(git diff --name-only origin/stylist-simple-agent...HEAD)" = ".github/workflows/_tmp-stylist-v2-latency-benchmark.yml"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Install function dependencies
        working-directory: functions
        run: npm ci --ignore-scripts

      - name: Run 3-call production benchmark
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE_WEB_API_KEY="$(node -e "const j=require('./android/app/google-services.json');process.stdout.write(j.client[0].api_key[0].current_key)")"
          echo "::add-mask::$FIREBASE_WEB_API_KEY"
          export FIREBASE_WEB_API_KEY
          export GOOGLE_CLOUD_PROJECT=outfitoftheday-4d401
          cd functions
          node <<'NODE'
          "use strict";
          const assert = require("node:assert/strict");
          const admin = require("firebase-admin");
          const projectId = process.env.GOOGLE_CLOUD_PROJECT;
          const apiKey = process.env.FIREBASE_WEB_API_KEY;
          const uid = "stylist_prod_latency_benchmark";

          function dateKeys() {
            const parts = new Intl.DateTimeFormat("en-US", {timeZone: "Europe/Bratislava", year: "numeric", month: "2-digit", day: "2-digit"}).formatToParts(new Date());
            const v = Object.fromEntries(parts.filter((p) => p.type !== "literal").map((p) => [p.type, p.value]));
            const base = new Date(Date.UTC(Number(v.year), Number(v.month) - 1, Number(v.day)));
            const key = (offset) => new Date(base.getTime() + offset * 86400000).toISOString().slice(0, 10);
            return {todayDateKey: key(0), tomorrowDateKey: key(1)};
          }

          async function exchange(customToken) {
            const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${encodeURIComponent(apiKey)}`, {
              method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({token: customToken, returnSecureToken: true}),
            });
            const json = await response.json();
            if (!response.ok) throw new Error(`token_exchange_failed:${response.status}:${json?.error?.message || "unknown"}`);
            return json.idToken;
          }

          async function deleteOwnUser(idToken) {
            await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:delete?key=${encodeURIComponent(apiKey)}`, {
              method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({idToken}),
            }).catch(() => {});
          }

          async function oneCall(idToken, index) {
            const stamp = Date.now();
            const started = Date.now();
            const response = await fetch(`https://us-east1-${projectId}.cloudfunctions.net/stylistChatV2`, {
              method:"POST",
              headers:{"Content-Type":"application/json", Authorization:`Bearer ${idToken}`},
              body:JSON.stringify({data:{
                v2SessionId:`latency_chat_${index}_${stamp}`,
                turnId:`latency_turn_${index}_${stamp}`,
                message:"Aké farby sa hodia k modrej?",
                history:[], currentOutfitItemIds:[], currentSelectionReasons:[], shoppingEnabled:false,
                clientContext:{...dateKeys(), timezoneOffsetMinutes:-new Date().getTimezoneOffset()},
              }}),
            });
            const latencyMs = Date.now() - started;
            const json = await response.json().catch(() => ({}));
            if (!response.ok || !json.result) throw new Error(`callable_failed:${response.status}:${JSON.stringify(json).slice(0,300)}`);
            assert.equal(json.result.failClosed, false, JSON.stringify(json.result));
            assert.equal(json.result.action, "chat", JSON.stringify(json.result));
            return {index, latencyMs, replyLength:String(json.result.reply || "").length};
          }

          (async () => {
            if (!admin.apps.length) admin.initializeApp({projectId});
            const idToken = await exchange(await admin.auth().createCustomToken(uid));
            try {
              const results=[];
              for (let i=1;i<=3;i++) {
                results.push(await oneCall(idToken, i));
                await new Promise((r)=>setTimeout(r, 500));
              }
              const sorted=results.map((x)=>x.latencyMs).sort((a,b)=>a-b);
              console.log("STYLIST_LATENCY_BENCHMARK", JSON.stringify({results, minMs:sorted[0], medianMs:sorted[1], maxMs:sorted[2]}));
            } finally { await deleteOwnUser(idToken); }
          })().catch((error)=>{ console.error("STYLIST_LATENCY_BENCHMARK_FAILED", error?.message || error); process.exitCode=1; });
          NODE
