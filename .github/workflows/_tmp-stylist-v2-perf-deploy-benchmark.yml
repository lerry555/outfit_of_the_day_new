name: Stylist V2 performance deploy benchmark one-shot

on:
  push:
    branches:
      - deploy/stylist-v2-perf-20260909
    paths:
      - .github/workflows/_tmp-stylist-v2-perf-deploy-benchmark.yml

permissions:
  contents: read

jobs:
  deploy-benchmark:
    if: github.ref == 'refs/heads/deploy/stylist-v2-perf-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated deploy branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard target, brain and deploy ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment perf/stylist-v2-latency-20260909 deploy/stylist-v2-perf-20260909
          test "$GITHUB_REF_NAME" = "deploy/stylist-v2-perf-20260909"
          test "$(git rev-parse origin/stylist-simple-agent)" = "0dc7ea2c3096c100d1277b1d2a7fe5c22ce83533"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/perf/stylist-v2-latency-20260909)" = "dca3e3ee752fcb2e47aee3afe75258a7e41b86eb"
          git merge-base --is-ancestor 0dc7ea2c3096c100d1277b1d2a7fe5c22ce83533 HEAD
          CHANGED="$(git diff --name-only 0dc7ea2c3096c100d1277b1d2a7fe5c22ce83533..HEAD)"
          test "$CHANGED" = ".github/workflows/_tmp-stylist-v2-perf-deploy-benchmark.yml"

      - name: Use Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Export Flutter clothing KB prior artifact
        run: flutter test --dart-define=UPDATE_CLOTHING_KB_PRIOR_ARTIFACT=true test/backend_clothing_kb_prior_artifact_export_test.dart

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Function dependencies
        working-directory: functions
        run: npm ci

      - name: Generate deploy taxonomy artifacts with SHA guards
        shell: bash
        run: |
          set -euo pipefail
          node functions/scripts/generate_deploy_taxonomy_artifacts.js
          test -s functions/artifacts/vision_canonical_family_registry_v1.json
          test -s functions/artifacts/vision_canonical_family_registry_v1.manifest.json
          test -s functions/artifacts/canonical_resolver_structured_taxonomy_v1.json
          test -s functions/artifacts/canonical_resolver_structured_taxonomy_v1.manifest.json

      - name: Critical Stylist V2 backend regressions
        run: >-
          node --test
          functions/stylist/v2/stylist_fast_chat_v2.test.js
          functions/stylist/v2/stylist_production_bridge_v2.test.js
          functions/stylist/v2/stylist_release_gate_v2.test.js
          functions/stylist/v2/stylist_model_payload_efficiency_v2.test.js
          functions/stylist/v2/stylist_adversarial_conversation_v2.test.js

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: outfitoftheday-4d401

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Deploy only production stylistChatV2
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --only functions:stylistChatV2 \
            --project outfitoftheday-4d401 \
            --non-interactive

      - name: Production 3-call fast-chat benchmark
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE_WEB_API_KEY="$(node -e "const j=require('./android/app/google-services.json');process.stdout.write(j.client[0].api_key[0].current_key)")"
          echo "::add-mask::$FIREBASE_WEB_API_KEY"
          export FIREBASE_WEB_API_KEY
          export GOOGLE_CLOUD_PROJECT=outfitoftheday-4d401
          cd functions
          node - <<'NODE'
          "use strict";
          const assert = require("node:assert/strict");
          const admin = require("firebase-admin");
          const {hashValue} = require("./costs/ai_usage_v1");
          const PROJECT_ID = "outfitoftheday-4d401";
          const API_KEY = String(process.env.FIREBASE_WEB_API_KEY || "").trim();
          const QUESTION = "Aké farby sa hodia k modrej?";
          const EXPECTED_PATH = "stylist_v2_fast_chat";

          async function exchangeCustomToken(customToken) {
            assert.ok(API_KEY, "FIREBASE_WEB_API_KEY is required");
            const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${encodeURIComponent(API_KEY)}`, {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({token: customToken, returnSecureToken: true}),
            });
            const json = await response.json();
            if (!response.ok) throw new Error(`firebase_token_exchange_failed:${response.status}:${json?.error?.message || "unknown"}`);
            assert.ok(json.idToken);
            return json.idToken;
          }

          async function callCallable(idToken, data) {
            const started = Date.now();
            const response = await fetch(`https://us-east1-${PROJECT_ID}.cloudfunctions.net/stylistChatV2`, {
              method: "POST",
              headers: {"Content-Type": "application/json", Authorization: `Bearer ${idToken}`},
              body: JSON.stringify({data}),
            });
            const latencyMs = Date.now() - started;
            const json = await response.json().catch(() => ({}));
            if (!response.ok || !json.result) {
              throw new Error(`callable_failed:${response.status}:${JSON.stringify(json).slice(0, 500)}`);
            }
            return {result: json.result, latencyMs};
          }

          async function main() {
            if (!admin.apps.length) admin.initializeApp({projectId: PROJECT_ID});
            const auth = admin.auth();
            const db = admin.firestore();
            const stamp = Date.now();
            const uid = `stylist_perf_bench_${stamp}`;
            const chatId = `perf_chat_${stamp}`;
            const turnIds = [];
            try {
              const customToken = await auth.createCustomToken(uid);
              const idToken = await exchangeCustomToken(customToken);
              const latencies = [];
              const responseSummary = [];
              for (let i = 1; i <= 3; i += 1) {
                const turnId = `perf_${i}_${stamp}`;
                turnIds.push(turnId);
                const {result, latencyMs} = await callCallable(idToken, {
                  v2SessionId: chatId,
                  turnId,
                  message: QUESTION,
                  history: [],
                  currentOutfitItemIds: [],
                  currentSelectionReasons: [],
                  shoppingEnabled: false,
                  clientContext: {},
                });
                assert.equal(result.failClosed, false, `call_${i}_fail_closed`);
                assert.equal(result.action, "chat", `call_${i}_action`);
                assert.equal(result.modelPath, EXPECTED_PATH, `call_${i}_model_path`);
                assert.ok(String(result.reply || result.stylistComment || "").length >= 20, `call_${i}_reply_too_short`);
                latencies.push(latencyMs);
                responseSummary.push({call: i, latencyMs, action: result.action, modelPath: result.modelPath});
              }

              await new Promise((resolve) => setTimeout(resolve, 1500));
              const models = [];
              for (const turnId of turnIds) {
                const requestKey = hashValue([uid, turnId, "v2"]);
                const snap = await db.collection("aiUsageEventsV1").where("requestKey", "==", requestKey).get();
                for (const doc of snap.docs) {
                  const data = doc.data() || {};
                  if (data.model) models.push(String(data.model));
                }
              }
              assert.equal(models.length, 3, `expected_three_model_events:${models.length}`);
              assert.ok(models.every((model) => model.startsWith("gpt-5.6-luna")), `non_luna_model_used:${models.join(",")}`);

              const sorted = [...latencies].sort((a, b) => a - b);
              const medianMs = sorted[1];
              console.log(`STYLIST_V2_PROD_BENCHMARK ${JSON.stringify({
                question: QUESTION,
                calls: responseSummary,
                latenciesMs: latencies,
                medianMs,
                models,
                before: {latenciesMs: [9024, 6456, 7371], medianMs: 7371},
              })}`);
            } finally {
              await auth.deleteUser(uid).catch(() => {});
            }
          }

          main().catch((error) => {
            console.error(`STYLIST_V2_PROD_BENCHMARK_FAILED ${error?.stack || error}`);
            process.exitCode = 1;
          });
          NODE

      - name: Read recent latency telemetry
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="stylistchatv2"' \
            --project=outfitoftheday-4d401 \
            --freshness=10m \
            --limit=120 \
            --format=json > /tmp/stylist-v2-logs.json
          node - <<'NODE'
          const fs = require("node:fs");
          const entries = JSON.parse(fs.readFileSync("/tmp/stylist-v2-logs.json", "utf8"));
          const hits = [];
          for (const entry of entries) {
            const text = JSON.stringify(entry);
            if (text.includes("STYLIST_V2_TURN_LATENCY")) hits.push(entry);
          }
          console.log(`STYLIST_V2_RECENT_LATENCY_LOGS ${JSON.stringify(hits.slice(0, 12))}`);
          NODE
