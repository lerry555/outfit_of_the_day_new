name: Stylist deterministic country guard one-shot

on:
  push:
    branches:
      - fix/stylist-deterministic-country-guard-20260912
    paths:
      - .github/workflows/_tmp-stylist-deterministic-country-guard.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: fix/stylist-deterministic-country-guard-20260912
          fetch-depth: 0

      - name: Guard production brain and work HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment fix/stylist-deterministic-country-guard-20260912 --no-tags
          test "$(git rev-parse origin/stylist-simple-agent)" = "054dfca610edec0eaac5836e6628b47b8a3e248f"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fix/stylist-deterministic-country-guard-20260912)"

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Function dependencies
        working-directory: functions
        run: npm ci

      - name: Apply deterministic country guard patch
        run: python3 .github/scripts/_tmp_patch_country_guard.py

      - name: Syntax and focused regression tests
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node --check stylist/v2/open_meteo_ports_v2.js
          node --check stylist/v2/stylist_one_brain_engine_v2.js
          node --test stylist/v2/stylist_general_location_layering_v2.test.js stylist/v2/stylist_one_brain_runtime_v2.test.js

      - name: Commit tested product fix
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' functions/stylist/v2/open_meteo_ports_v2.js functions/stylist/v2/stylist_general_location_layering_v2.test.js functions/stylist/v2/stylist_one_brain_engine_v2.js | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin stylist-simple-agent brain-v1-experiment fix/stylist-deterministic-country-guard-20260912 --no-tags
          test "$(git rev-parse origin/stylist-simple-agent)" = "054dfca610edec0eaac5836e6628b47b8a3e248f"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          remote_before=$(git rev-parse origin/fix/stylist-deterministic-country-guard-20260912)
          test "$(git rev-parse HEAD)" = "$remote_before"

          git add functions/stylist/v2/open_meteo_ports_v2.js functions/stylist/v2/stylist_general_location_layering_v2.test.js functions/stylist/v2/stylist_one_brain_engine_v2.js
          git commit -m "fix: make broad-country Stylist clarification deterministic"

          git fetch origin stylist-simple-agent brain-v1-experiment fix/stylist-deterministic-country-guard-20260912 --no-tags
          test "$(git rev-parse origin/stylist-simple-agent)" = "054dfca610edec0eaac5836e6628b47b8a3e248f"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/fix/stylist-deterministic-country-guard-20260912)" = "$remote_before"
          git push origin HEAD:fix/stylist-deterministic-country-guard-20260912

      - name: Cleanup temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment fix/stylist-deterministic-country-guard-20260912 --no-tags
          test "$(git rev-parse origin/stylist-simple-agent)" = "054dfca610edec0eaac5836e6628b47b8a3e248f"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          remote_product=$(git rev-parse origin/fix/stylist-deterministic-country-guard-20260912)
          test "$(git rev-parse HEAD)" = "$remote_product"

          git rm .github/workflows/_tmp-stylist-deterministic-country-guard.yml .github/scripts/_tmp_patch_country_guard.py
          git commit -m "chore: remove temporary country-guard helpers"

          git fetch origin stylist-simple-agent brain-v1-experiment fix/stylist-deterministic-country-guard-20260912 --no-tags
          test "$(git rev-parse origin/stylist-simple-agent)" = "054dfca610edec0eaac5836e6628b47b8a3e248f"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/fix/stylist-deterministic-country-guard-20260912)" = "$remote_product"
          git push origin HEAD:fix/stylist-deterministic-country-guard-20260912

          diff_names=$(git diff --name-only origin/stylist-simple-agent...HEAD | sort)
          expected=$(printf '%s\n' functions/stylist/v2/open_meteo_ports_v2.js functions/stylist/v2/stylist_general_location_layering_v2.test.js functions/stylist/v2/stylist_one_brain_engine_v2.js | sort)
          test "$diff_names" = "$expected"
