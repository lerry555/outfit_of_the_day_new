name: Live Stylist pending-answer outfit one-shot

on:
  push:
    branches:
      - qa/live-stylist-pending-answer-outfit-20260913
    paths:
      - .github/workflows/_tmp-live-stylist-pending-answer-outfit.yml

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard production brain work and QA diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment fix/stylist-pending-answer-outfit-20260913 qa/live-stylist-pending-answer-outfit-20260913 --no-tags
          test "$GITHUB_REF_NAME" = "qa/live-stylist-pending-answer-outfit-20260913"
          test "$(git rev-parse origin/stylist-simple-agent)" = "d45d3d388ff6b178579483f6d75d7751d30e4544"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse origin/fix/stylist-pending-answer-outfit-20260913)" = "1e94b82188d5f9222b941f2d563a0568224d7d37"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/qa/live-stylist-pending-answer-outfit-20260913)"
          test "$(git merge-base origin/stylist-simple-agent HEAD)" = "d45d3d388ff6b178579483f6d75d7751d30e4544"
          expected="$(printf '%s\n%s' '.github/workflows/_tmp-live-stylist-pending-answer-outfit.yml' 'functions/stylist/v2/_tmp_live_switzerland_alps_smoke_v2.js')"
          test "$(git diff --name-only origin/stylist-simple-agent...HEAD)" = "$expected"

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Install Function dependencies
        working-directory: functions
        run: npm ci --ignore-scripts

      - name: Run exact live Switzerland to Alps flow against deployed callable
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE_WEB_API_KEY="$(node -e "const j=require('./android/app/google-services.json');process.stdout.write(j.client[0].api_key[0].current_key)")"
          echo "::add-mask::$FIREBASE_WEB_API_KEY"
          export FIREBASE_WEB_API_KEY
          export GOOGLE_CLOUD_PROJECT=outfitoftheday-4d401
          node functions/stylist/v2/_tmp_live_switzerland_alps_smoke_v2.js
