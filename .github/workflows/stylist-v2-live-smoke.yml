name: AI Stylist V2 live smoke

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Smoke target
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - production

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: outfitoftheday-4d401

      - name: Install Function dependencies
        working-directory: functions
        run: npm ci --ignore-scripts

      - name: Candidate live smoke - Luna only, strict call/cost/latency budget
        if: inputs.mode == 'candidate'
        shell: bash
        run: |
          set -euo pipefail
          OPENAI_API_KEY="$(gcloud secrets versions access latest --secret=OPENAI_API_KEY --project=outfitoftheday-4d401)"
          echo "::add-mask::$OPENAI_API_KEY"
          export OPENAI_API_KEY
          export STYLIST_SMOKE_MAX_CALLS=3
          export STYLIST_SMOKE_MAX_PROVIDER_MS=12000
          export STYLIST_SMOKE_MAX_COST_USD=0.01
          node functions/stylist/v2/stylist_live_smoke_v2.js

      - name: Production callable smoke - isolated QA user, Luna only
        if: inputs.mode == 'production'
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE_WEB_API_KEY="$(node -e "const j=require('./android/app/google-services.json');process.stdout.write(j.client[0].api_key[0].current_key)")"
          echo "::add-mask::$FIREBASE_WEB_API_KEY"
          export FIREBASE_WEB_API_KEY
          export GOOGLE_CLOUD_PROJECT=outfitoftheday-4d401
          export STYLIST_PROD_SMOKE_MAX_CALL_MS=20000
          export STYLIST_PROD_SMOKE_MAX_COST_USD=0.02
          node functions/stylist/v2/stylist_production_smoke_v2.js
