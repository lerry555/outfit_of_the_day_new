name: Stylist pending-location context fix one-shot

on:
  push:
    branches:
      - fix/stylist-pending-location-context-20260911
    paths:
      - .github/workflows/_tmp-stylist-pending-location-context-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard canonical branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment fix/stylist-pending-location-context-20260911 --no-tags
          test "$(git rev-parse origin/stylist-simple-agent)" = "2024cd7e9e71fd1738f293a969849c0f33bdd7f1"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fix/stylist-pending-location-context-20260911)"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Patch runtime and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          engine = Path('functions/stylist/v2/stylist_one_brain_engine_v2.js')
          text = engine.read_text()

          old = '''function userExplicitlyRequestsBestEffortV2(value) {
            return EXPLICIT_BEST_EFFORT_RE.test(normalizeConversationTextV2(value));
          }

          function explicitStylingDestinationCandidateV2(value) {'''
          new = '''function userExplicitlyRequestsBestEffortV2(value) {
            return EXPLICIT_BEST_EFFORT_RE.test(normalizeConversationTextV2(value));
          }

          function pendingLocationQueryV2(value) {
            return String(value || "")
              .trim()
              .replace(/\\s*[:;]-?[dDpP)]+\\s*$/u, "")
              .trim()
              .slice(0, 160);
          }

          function explicitStylingDestinationCandidateV2(value) {'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''      // Resolve an explicitly named travel destination before the model. This is
                // deliberately semantic and country-agnostic: the geocoder decides whether
                // the user's phrase is a country, region, city or POI. A country is too broad
                // for weather-sensitive remote styling, so ask the single useful location
                // question before spending a Brain call or reading the wardrobe.
                if (!pendingQuestionAtBrain && !bestEffortDirective) {
                  const explicitDestination = explicitStylingDestinationCandidateV2(request.latestUserInput);
                  if (explicitDestination) {
                    let resolvedExplicitDestination = null;
                    try {
                      resolvedExplicitDestination = await locationResolver.resolve(explicitDestination.query);
                    } catch (_) {
                      resolvedExplicitDestination = null;
                    }
                    if (resolvedExplicitDestination) {
                      const field = explicitDestination.targetField;
                      workingState.context[field] = clone(resolvedExplicitDestination);
                      workingState.conversationMemory.answeredClarificationFields[field] = clone(resolvedExplicitDestination);
                      if (locationIsTooBroadForWeatherV2(resolvedExplicitDestination)) {
                        const decision = broadLocationClarificationDecisionV2(
                          {tool: "location", query: explicitDestination.query, targetField: field},
                          {resolvedLocations: [{targetField: field, location: resolvedExplicitDestination}]},
                        );
                        return commitResultV2({
                          durableRepository, uid, request, originalState, workingState, decision,
                          wardrobeItems: [], authorizedEditScope: null,
                        });
                      }
                    }
                  }
                }

                const runtimeConstraints = {'''
          new = '''      // Resolve an explicitly named travel destination before the model. The
                // geocoder still decides country/region/locality semantically, but a broad
                // country clarification must not throw away the rest of the user's scenario.
                // We therefore let the Brain parse explicit activity/date/environment into
                // statePatch, then deterministically commit the one useful location question.
                let forcedBroadClarification = null;
                if (!pendingQuestionAtBrain && !bestEffortDirective) {
                  const explicitDestination = explicitStylingDestinationCandidateV2(request.latestUserInput);
                  if (explicitDestination) {
                    let resolvedExplicitDestination = null;
                    try {
                      resolvedExplicitDestination = await locationResolver.resolve(explicitDestination.query);
                    } catch (_) {
                      resolvedExplicitDestination = null;
                    }
                    if (resolvedExplicitDestination) {
                      const field = explicitDestination.targetField;
                      workingState.context[field] = clone(resolvedExplicitDestination);
                      workingState.conversationMemory.answeredClarificationFields[field] = clone(resolvedExplicitDestination);
                      if (locationIsTooBroadForWeatherV2(resolvedExplicitDestination)) {
                        forcedBroadClarification = {
                          field,
                          decision: broadLocationClarificationDecisionV2(
                            {tool: "location", query: explicitDestination.query, targetField: field},
                            {resolvedLocations: [{targetField: field, location: resolvedExplicitDestination}]},
                          ),
                        };
                      }
                    }
                  }
                }

                const runtimeConstraints = {'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        pendingReplyField: pendingQuestionAtBrain?.field || null,
                noAutomaticGroundingQuestions: true,'''
          new = '''        pendingReplyField: pendingQuestionAtBrain?.field || null,
                forcedClarificationField: forcedBroadClarification?.field || null,
                noAutomaticGroundingQuestions: true,'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''      validateToolDecisionEnvelopeV2(toolEnvelope, {...runtimeConstraints, pendingQuestion: pendingQuestionAtBrain});
              const pendingDisposition = pendingReplyDispositionV2(toolEnvelope, pendingQuestionAtBrain);
              let preservePendingQuestion = false;
              if (pendingQuestionAtBrain) {'''
          new = '''      validateToolDecisionEnvelopeV2(toolEnvelope, {...runtimeConstraints, pendingQuestion: pendingQuestionAtBrain});
              const pendingDisposition = pendingReplyDispositionV2(toolEnvelope, pendingQuestionAtBrain);

              // A country preflight must preserve all explicit scenario facts parsed from
              // the original message before we stop for the one location clarification.
              if (forcedBroadClarification) {
                workingState = applyBrainStatePatchV2(workingState, toolEnvelope.statePatch);
                return commitResultV2({
                  durableRepository, uid, request, originalState, workingState,
                  decision: forcedBroadClarification.decision,
                  wardrobeItems: [], authorizedEditScope: null,
                });
              }

              // If the Brain correctly classifies a pending destination reply as an answer
              // but tries to finish with a bare acknowledgement (for example "Rozumiem."),
              // runtime completes the missing location + wardrobe tool step instead of
              // accepting the dead-end chat response. Classification remains semantic;
              // runtime only guarantees continuation after an acknowledged location answer.
              let effectiveToolEnvelope = toolEnvelope;
              if (pendingQuestionAtBrain && pendingDisposition === "answer" &&
                  ["destination", "eventLocation"].includes(pendingQuestionAtBrain.field)) {
                const requests = Array.isArray(toolEnvelope.requests) ? clone(toolEnvelope.requests) : [];
                if (!requests.some((entry) => entry?.tool === "location" &&
                    entry.targetField === pendingQuestionAtBrain.field)) {
                  requests.push({
                    tool: "location",
                    query: pendingLocationQueryV2(request.latestUserInput),
                    targetField: pendingQuestionAtBrain.field,
                  });
                }
                if (!requests.some((entry) => entry?.tool === "wardrobe") && !Array.isArray(knownWardrobeItems)) {
                  requests.push({tool: "wardrobe", scope: "full_relevant", category: null, editScope: null});
                }
                effectiveToolEnvelope = {...toolEnvelope, kind: "tool_request", requests,
                  pendingReplyDisposition: pendingDisposition};
                validateToolDecisionEnvelopeV2(effectiveToolEnvelope,
                  {...runtimeConstraints, pendingQuestion: pendingQuestionAtBrain});
              }

              let preservePendingQuestion = false;
              if (pendingQuestionAtBrain) {'''
          assert old in text
          text = text.replace(old, new, 1)

          text = text.replace(
            '    workingState = applyBrainStatePatchV2(workingState, toolEnvelope.statePatch);\n\n    if (toolEnvelope.kind === "final") {',
            '    workingState = applyBrainStatePatchV2(workingState, effectiveToolEnvelope.statePatch);\n\n    if (effectiveToolEnvelope.kind === "final") {',
            1,
          )
          text = text.replace('        decision: toolEnvelope.result,', '        decision: effectiveToolEnvelope.result,', 1)
          text = text.replace('        envelope: toolEnvelope,', '        envelope: effectiveToolEnvelope,', 1)
          text = text.replace(
            '      const broadLocationRequest = toolEnvelope.requests.find((entry) => entry?.tool === "location");',
            '      const broadLocationRequest = effectiveToolEnvelope.requests.find((entry) => entry?.tool === "location");',
            1,
          )
          text = text.replace(
            '  explicitStylingDestinationCandidateV2,\n  pendingReplyDispositionV2,',
            '  explicitStylingDestinationCandidateV2,\n  pendingLocationQueryV2,\n  pendingReplyDispositionV2,',
            1,
          )
          engine.write_text(text)

          prompt = Path('functions/stylist/v2/openai_one_brain_model_port_v2.js')
          p = prompt.read_text()
          anchor = '    "Ak runtimeConstraints.pendingReplyRequired=false, pendingReplyDisposition nastav na none. Ak je true, klasifikácia pending odpovede je povinná pred akýmkoľvek tool requestom.",\n'
          addition = anchor + '    "Ak runtimeConstraints.forcedClarificationField nie je null, zachyť do statePatch všetky explicitné fakty z aktuálnej správy (najmä aktivitu, dátum, prostredie a grounding), ale runtime po tomto kroku autoritatívne položí jednu location otázku. Nestrácaj kontext pôvodnej požiadavky.",\n'
          assert anchor in p
          p = p.replace(anchor, addition, 1)
          prompt.write_text(p)

          geo = Path('functions/stylist/v2/open_meteo_ports_v2.js')
          g = geo.read_text()
          anchor = '  "budapesti": "Budapešť",\n'
          addition = anchor + '  "alp": "Alpy",\n  "alpy": "Alpy",\n  "alpach": "Alpy",\n'
          assert anchor in g
          g = g.replace(anchor, addition, 1)
          geo.write_text(g)

          testf = Path('functions/stylist/v2/stylist_general_location_layering_v2.test.js')
          t = testf.read_text()
          t = t.replace(
            'function request(message) {\n  return {\n    chatId: "chat_general_location",\n    turnId: "t1",\n    expectedSessionRevision: 0,',
            'function request(message, {turnId = "t1", revision = 0} = {}) {\n  return {\n    chatId: "chat_general_location",\n    turnId,\n    expectedSessionRevision: revision,',
            1,
          )
          oldbrain = '''    stylistBrain: {
      async brainTurn() {
        calls.brain += 1;
        throw new Error("Brain must not run before broad-country clarification");
      },
    },'''
          newbrain = '''    stylistBrain: {
      async brainTurn() {
        calls.brain += 1;
        return {
          kind: "final",
          pendingReplyDisposition: "none",
          statePatch: {
            scenarioMode: "current",
            context: {
              activity: {key: "hiking", label: "turistika", source: "user"},
              date: {dateKey: "2026-09-17", label: "budúci štvrtok", source: "user"},
              timeWindow: {key: "day", label: "cez deň", source: "one_brain_default"},
              environment: "outdoor",
              groundingRequirements: {
                weatherRequired: true,
                weatherLocationField: "destination",
                terrainRequiredFields: [],
              },
            },
          },
          result: {action: "chat", assistantText: "placeholder", display: {kind: "none", itemIds: []}},
        };
      },
    },'''
          assert oldbrain in t
          t = t.replace(oldbrain, newbrain, 1)
          t = t.replace(
            'test("country-level explicit destination clarifies before any Brain or wardrobe call", async () => {',
            'test("country-level explicit destination preserves scenario context before clarification", async () => {',
            1,
          )
          t = t.replace(
            '  assert.equal(calls.brain, 0, "broad explicit country must not depend on a model choosing the location tool");\n',
            '  assert.equal(calls.brain, 1, "Brain parses the original scenario before runtime commits the location clarification");\n',
            1,
          )
          marker = '  assert.equal(calls.weather, 0);\n});\n\ntest("layering contract rejects warmth-by-stacking logic for thin sports outerwear", () => {'
          insert = '''  assert.equal(calls.weather, 0);
  const saved = await repository.get({uid: "u_general_country", chatId: "chat_general_location"});
  assert.equal(saved.state.context.activity.key, "hiking");
  assert.equal(saved.state.context.date.dateKey, "2026-09-17");
  assert.equal(saved.state.context.environment, "outdoor");
});

test("pending location answer cannot dead-end as bare acknowledgement", async () => {
  const repository = createMemoryStylistSessionRepositoryV2({now: () => NOW});
  const calls = {brain: 0, location: 0, wardrobe: 0, weather: 0, shopping: 0, queries: []};
  const engine = createStylistOneBrainEngineV2({
    sessionRepository: repository,
    wardrobeTool: {
      async retrieve() {
        calls.wardrobe += 1;
        return [];
      },
    },
    locationResolver: {
      async resolve(query) {
        calls.location += 1;
        calls.queries.push(query);
        if (calls.location === 1) {
          return {providerId: "geo:ch", label: "Švajčiarsko", lat: 46.8, lng: 8.2,
            source: "fake-geocoder", granularity: "country", countryCode: "CH"};
        }
        return {providerId: "geo:alps", label: "Alpy", lat: 46.5, lng: 10.0,
          source: "fake-geocoder", granularity: "region", countryCode: "CH"};
      },
    },
    weatherTool: {
      async getForecast() {
        calls.weather += 1;
        return {locationProviderId: "geo:alps", dateKey: "2026-09-16", timeWindowKey: "day",
          fetchedAt: "2026-09-11T12:00:00.000Z", source: "fake-weather", snapshot: {}};
      },
    },
    shoppingTool: {async search() { calls.shopping += 1; return {candidateIds: [], reply: ""}; }},
    stylistBrain: {
      async brainTurn(input) {
        calls.brain += 1;
        if (calls.brain === 1) {
          return {
            kind: "final",
            pendingReplyDisposition: "none",
            statePatch: {
              scenarioMode: "current",
              context: {
                activity: {key: "hiking", label: "turistika", source: "user"},
                date: {dateKey: "2026-09-16", label: "o týždeň v stredu", source: "user"},
                timeWindow: {key: "day", label: "cez deň", source: "one_brain_default"},
                environment: "outdoor",
                groundingRequirements: {weatherRequired: true, weatherLocationField: "destination", terrainRequiredFields: []},
              },
            },
            result: {action: "chat", assistantText: "placeholder", display: {kind: "none", itemIds: []}},
          };
        }
        if (input.stage === "tools") {
          return {
            kind: "final",
            pendingReplyDisposition: "answer",
            statePatch: {scenarioMode: "current", context: {}},
            result: {action: "chat", assistantText: "Rozumiem.", display: {kind: "none", itemIds: []}},
          };
        }
        return {
          kind: "final",
          statePatch: {scenarioMode: "current", context: {}},
          result: {action: "chat", assistantText: "Pokračujem po location a wardrobe tooloch.", display: {kind: "none", itemIds: []}},
        };
      },
    },
    clock: () => NOW,
  });

  const first = await engine.resolveTurn({
    uid: "u_pending_location",
    request: request("o tyzden v stredu ideme do svajciarska na turu a ja neviem co si obliect"),
    bootstrapInput: {currentOutfitItemIds: [], persistedSelectionReasonsByItemId: {}, knownExplicitDurableChoices: {}},
  });
  assert.equal(first.action, "clarify");

  const second = await engine.resolveTurn({
    uid: "u_pending_location",
    request: request("do alp :D", {turnId: "t2", revision: 1}),
  });
  assert.equal(second.action, "chat");
  assert.equal(second.assistantText, "Pokračujem po location a wardrobe tooloch.");
  assert.notEqual(second.assistantText, "Rozumiem.");
  assert.equal(calls.brain, 3);
  assert.equal(calls.location, 2);
  assert.equal(calls.queries[1], "do alp");
  assert.equal(calls.wardrobe, 1);
});

test("layering contract rejects warmth-by-stacking logic for thin sports outerwear", () => {'''
          assert marker in t
          t = t.replace(marker, insert, 1)
          testf.write_text(t)
          PY

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test functions/stylist/v2/stylist_general_location_layering_v2.test.js
          node --test functions/stylist/v2/stylist_one_brain_runtime_v2.test.js
          git diff --check

      - name: Commit clean product diff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp-stylist-pending-location-context-fix.yml
          git add functions/stylist/v2/stylist_one_brain_engine_v2.js \
                  functions/stylist/v2/openai_one_brain_model_port_v2.js \
                  functions/stylist/v2/open_meteo_ports_v2.js \
                  functions/stylist/v2/stylist_general_location_layering_v2.test.js \
                  .github/workflows/_tmp-stylist-pending-location-context-fix.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve Stylist context through location follow-up"
          git push origin HEAD:fix/stylist-pending-location-context-20260911
