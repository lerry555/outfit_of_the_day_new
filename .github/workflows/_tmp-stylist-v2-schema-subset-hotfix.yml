name: AI Stylist V2 schema subset hotfix

on:
  push:
    branches:
      - ai-stylist-v2-schema-subset-hotfix
    paths:
      - .github/workflows/_tmp-stylist-v2-schema-subset-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard target refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment ai-stylist-v2-schema-subset-hotfix
          test "$(git rev-parse origin/stylist-simple-agent)" = "53c3b09421e6688f38ab57ab54b6e300467b2133"
          test "$(git rev-parse origin/brain-v1-experiment)" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
      - name: Remove unsupported Structured Outputs keywords
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('functions/stylist/v2/openai_stylist_model_port_v2.js')
          text = path.read_text(encoding='utf-8')
          max_length_count = len(re.findall(r',\s*maxLength:\s*\d+', text))
          unique_count = text.count('uniqueItems: true, ')
          if max_length_count != 16:
              raise SystemExit(f'expected 16 maxLength schema keywords, found {max_length_count}')
          if unique_count != 1:
              raise SystemExit(f'expected 1 uniqueItems schema keyword, found {unique_count}')
          text = re.sub(r',\s*maxLength:\s*\d+', '', text)
          text = text.replace('uniqueItems: true, ', '')
          if 'maxLength:' in text or 'uniqueItems:' in text:
              raise SystemExit('unsupported schema keyword remained after patch')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Add permanent schema-subset regression
        shell: bash
        run: |
          set -euo pipefail
          cat > functions/stylist/v2/stylist_openai_schema_subset_v2.test.js <<'EOF'
          "use strict";

          const test = require("node:test");
          const assert = require("node:assert/strict");
          const {PLAN_SCHEMA, FINAL_SCHEMA} = require("./openai_stylist_model_port_v2");

          const FORBIDDEN_STRICT_SCHEMA_KEYWORDS = new Set([
            "maxLength",
            "minLength",
            "uniqueItems",
            "allOf",
            "not",
            "dependentRequired",
            "dependentSchemas",
            "if",
            "then",
            "else",
          ]);

          function findForbidden(value, path = "$") {
            const hits = [];
            if (Array.isArray(value)) {
              value.forEach((item, index) => hits.push(...findForbidden(item, `${path}[${index}]`)));
              return hits;
            }
            if (!value || typeof value !== "object") return hits;
            for (const [key, child] of Object.entries(value)) {
              if (FORBIDDEN_STRICT_SCHEMA_KEYWORDS.has(key)) hits.push(`${path}.${key}`);
              hits.push(...findForbidden(child, `${path}.${key}`));
            }
            return hits;
          }

          test("V2 strict response schemas stay inside the OpenAI Structured Outputs subset", () => {
            assert.deepEqual(findForbidden(PLAN_SCHEMA), []);
            assert.deepEqual(findForbidden(FINAL_SCHEMA), []);
          });
          EOF
      - name: Add regression to permanent V2 CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/stylist-v2-ci.yml')
          text = path.read_text(encoding='utf-8')
          anchor = '          functions/stylist/v2/stylist_production_bridge_v2.test.js\n'
          addition = anchor + '          functions/stylist/v2/stylist_openai_schema_subset_v2.test.js\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one CI anchor, found {text.count(anchor)}')
          path.write_text(text.replace(anchor, addition), encoding='utf-8')
          PY
      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          cd functions
          npm ci --ignore-scripts
          node --check stylist/v2/openai_stylist_model_port_v2.js
          node --test stylist/v2/stylist_openai_schema_subset_v2.test.js stylist/v2/stylist_production_bridge_v2.test.js stylist/v2/stylist_grounding_policy_v2.test.js stylist/v2/stylist_v2_phase3_ports.test.js
      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lerry555"
          git config user.email "132705754+lerry555@users.noreply.github.com"
          git add functions/stylist/v2/openai_stylist_model_port_v2.js functions/stylist/v2/stylist_openai_schema_subset_v2.test.js .github/workflows/stylist-v2-ci.yml
          git commit -m "fix: keep V2 structured schemas provider-compatible"
          git push origin HEAD:ai-stylist-v2-schema-subset-hotfix
