name: Stylist consistency v4 patch

on:
  push:
    branches:
      - brain-v1-experiment
    paths:
      - .github/workflows/_tmp-stylist-consistency-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: brain-v1-experiment
          fetch-depth: 2

      - name: Guard exact patch base and master
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "brain-v1-experiment"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "b56b03e3d81e9534e65bcd2eb18569a18cdaeb2b"
          git fetch origin master --depth=1
          test "$(git rev-parse origin/master)" = "00bd52fa20f1e5b281d66850758c465dc2b00098"

      - name: Validate and apply patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tool/_tmp_patch_stylist_consistency_v4.py
          python tool/_tmp_patch_stylist_consistency_v4.py
          git diff --check
          git status --short

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lerry555"
          git config user.email "132705754+lerry555@users.noreply.github.com"
          git add \
            lib/utils/stylist_semantic_activity.dart \
            lib/models/outfit_context_state.dart \
            lib/utils/stylist_swap_request.dart \
            lib/domain/wardrobe_v2/flexible_candidate_matrix_v2.dart \
            lib/screens/stylist_chat_screen.dart \
            functions/stylist/chat_prompts.js \
            functions/stylist/conversation_brain_v1.js \
            test/brain_v1_v2_offline_bundle_test.dart \
            test/stylist_semantic_activity_test.dart \
            test/stylist_conversation_grounding_eval_test.dart
          git diff --cached --quiet && { echo "patch produced no changes"; exit 1; }
          git commit -m "fix: keep stylist recommendations consistent"
          git push origin HEAD:brain-v1-experiment
