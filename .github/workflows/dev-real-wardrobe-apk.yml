name: Android real Wardrobe DEV
# Rebuild after Firebase secret correction

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/dev-mobile
    paths:
      - 'lib/main_dev_wardrobe.dart'
      - 'lib/screens/wardrobe_read_only_cover_flow.dart'
      - '.github/workflows/dev-real-wardrobe-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: true
      - name: Verify required DEV signing and Firebase secrets
        env:
          KEYSTORE_B64: ${{ secrets.DEV_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing DEV_KEYSTORE_B64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing DEV_KEYSTORE_PASSWORD'; exit 1; }
      - name: Diagnose signing secret format safely
        env:
          KEYSTORE_B64: ${{ secrets.DEV_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, base64, binascii, subprocess, tempfile, pathlib, sys
          raw = os.environ['KEYSTORE_B64']
          compact = ''.join(raw.split())
          print(f'Secret characters: {len(raw)}; whitespace removed: {len(raw)-len(compact)}')
          try:
              data = base64.b64decode(compact, validate=True)
          except (binascii.Error, ValueError):
              print('ERROR: Secret is not valid Base64 text (contents hidden)')
              sys.exit(1)
          print(f'Decoded bytes: {len(data)}')
          import hashlib
          print('Decoded keystore SHA256:', hashlib.sha256(data).hexdigest())
          print('Keystore header type:', 'PKCS12' if data[:1] == bytes.fromhex('30') else ('JKS' if data[:4] == bytes.fromhex('feedfeed') else 'other'))
          print('Password character count:', len(os.environ['KEYSTORE_PASSWORD']))
          if not data.startswith(b'0\\x82') and not data.startswith(bytes.fromhex('fe ed fe ed')):
              print('WARNING: decoded content does not have a typical PKCS12/JKS header')
          with tempfile.TemporaryDirectory() as folder:
              file = pathlib.Path(folder)/'key.jks'
              file.write_bytes(data)
              p = subprocess.run(['keytool','-list','-keystore',str(file),
                                  '-storepass',os.environ['KEYSTORE_PASSWORD']],
                                 capture_output=True,text=True)
              if p.returncode:
                  print('ERROR: keytool could not open decoded keystore; check format/password')
                  sys.exit(1)
              print('Keystore opens with configured password')
          PY
      - name: Configure isolated DEV Android package and signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DEV_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/dev-signing.jks
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('android/app/google-services.json').read_text())
          from copy import deepcopy
          original = next(client for client in config['client']
                          if client['client_info']['android_client_info']['package_name']
                          == 'com.krist.outfitoftheday')
          dev = deepcopy(original)
          dev['client_info']['android_client_info']['package_name'] = 'com.krist.outfitoftheday.devpreview'
          dev['client_info']['mobilesdk_app_id'] = '1:221686818701:android:8b138d260ae88387973fc4'
          dev['oauth_client'] = [entry for entry in dev.get('oauth_client', [])
                                 if entry.get('client_type') != 1]
          config['client'].append(dev)
          Path('android/app/google-services.json').write_text(json.dumps(config))
          p = Path('android/app/build.gradle.kts')
          source = p.read_text()
          old = 'applicationId = "com.krist.outfitoftheday"'
          assert old in source
          source = source.replace(old, 'applicationId = "com.krist.outfitoftheday.devpreview"')
          source = source.replace(
            'signingConfig = signingConfigs.getByName("debug")',
            'signingConfig = signingConfigs.getByName("devPreview")')
          anchor = '    buildTypes {'
          assert anchor in source
          source = source.replace(anchor, '''    signingConfigs {
              create("devPreview") {
                  storeFile = file("dev-signing.jks")
                  storePassword = System.getenv("DEV_SIGN_PASSWORD")
                  keyAlias = "outfitdev"
                  keyPassword = System.getenv("DEV_SIGN_PASSWORD")
              }
          }
          ''' + anchor)
          p.write_text(source)
          PY
          keytool -list -v -keystore android/app/dev-signing.jks -storepass "$KEYSTORE_PASSWORD" | grep SHA1
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Build signed real Wardrobe DEV APK
        env:
          DEV_SIGN_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --target lib/main_dev_wardrobe.dart
      - name: Upload real Wardrobe DEV APK
        uses: actions/upload-artifact@v4
        with:
          name: outfit-real-wardrobe-dev-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
