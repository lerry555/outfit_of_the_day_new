name: AI Stylist V2 prod fail-closed diagnostics

on:
  push:
    branches:
      - ai-stylist-v2-prod-failclosed-diagnose
    paths:
      - .github/workflows/_tmp-stylist-v2-prod-failclosed-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Read exact AI usage events for failed V2 turns
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read 'timestamp>="2026-09-09T06:35:30Z" AND timestamp<="2026-09-09T06:37:10Z" AND jsonPayload.message="AI_USAGE_V1"' \
            --project outfitoftheday-4d401 \
            --limit 30 \
            --order asc \
            --format='table(timestamp,jsonPayload.feature,jsonPayload.model,jsonPayload.providerStatus,jsonPayload.modelAttempt,jsonPayload.providerAttempt,jsonPayload.providerResponseId,jsonPayload.inputTokens,jsonPayload.outputTokens)'
