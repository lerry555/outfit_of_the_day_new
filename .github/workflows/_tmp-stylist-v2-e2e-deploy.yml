name: AI Stylist V2 guarded production deploy

on:
  push:
    branches:
      - deploy-stylist-v2-e2e-speed-polish-20260909
    paths:
      - .github/workflows/_tmp-stylist-v2-e2e-deploy.yml

permissions:
  contents: read

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact deploy ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact production candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment deploy-stylist-v2-e2e-speed-polish-20260909
          TARGET="$(git rev-parse origin/stylist-simple-agent)"
          BRAIN="$(git rev-parse origin/brain-v1-experiment)"
          DEPLOY="$(git rev-parse origin/deploy-stylist-v2-e2e-speed-polish-20260909)"
          test "$TARGET" = "35a64f19ced603841e6eaeadb7f1a04e3a62b2ee"
          test "$BRAIN" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$DEPLOY" = "$GITHUB_SHA"
          test "$(git merge-base origin/stylist-simple-agent HEAD)" = "$TARGET"
          DIFF="$(git diff --name-only origin/stylist-simple-agent...HEAD)"
          test "$DIFF" = ".github/workflows/_tmp-stylist-v2-e2e-deploy.yml"

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Install Function dependencies
        working-directory: functions
        run: npm ci --ignore-scripts

      - name: Generate deploy taxonomy artifacts
        shell: bash
        run: |
          set -euo pipefail
          node functions/scripts/generate_deploy_taxonomy_artifacts.js
          test -s functions/artifacts/vision_canonical_family_registry_v1.manifest.json
          test -s functions/artifacts/vision_canonical_family_registry_v1.json
          test -s functions/artifacts/canonical_resolver_structured_taxonomy_v1.manifest.json
          test -s functions/artifacts/canonical_resolver_structured_taxonomy_v1.json
          test -s functions/artifacts/clothing_knowledge_base_prior_v1.manifest.json
          test -s functions/artifacts/clothing_knowledge_base_prior_v1.json

      - name: Re-run production-critical Stylist gates
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/index_v2.js
          node --check functions/stylist/v2/stylist_turn_coordinator_v2.js
          node --check functions/stylist/v2/stylist_grounding_policy_v2.js
          node --check functions/stylist/v2/stylist_turn_contract_v2.js
          node --check functions/stylist/v2/stylist_production_bridge_v2.js
          node --check functions/stylist/v2/stylist_production_smoke_v2.js
          node --test \
            functions/stylist/v2/stylist_release_gate_v2.test.js \
            functions/stylist/v2/stylist_adversarial_conversation_v2.test.js \
            functions/stylist/v2/stylist_help_first_contract_v2.test.js \
            functions/stylist/v2/stylist_pending_location_v2.test.js \
            functions/stylist/v2/stylist_grounding_policy_v2.test.js

      - name: Deploy only stylistChatV2
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools deploy \
            --only functions:stylistChatV2 \
            --project outfitoftheday-4d401 \
            --non-interactive

      - name: Production callable smoke
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE_WEB_API_KEY="$(node -e "const j=require('./android/app/google-services.json');process.stdout.write(j.client[0].api_key[0].current_key)")"
          echo "::add-mask::$FIREBASE_WEB_API_KEY"
          export FIREBASE_WEB_API_KEY
          export GOOGLE_CLOUD_PROJECT=outfitoftheday-4d401
          export STYLIST_PROD_SMOKE_MAX_CALL_MS=20000
          export STYLIST_PROD_SMOKE_MAX_COST_USD=0.02
          node functions/stylist/v2/stylist_production_smoke_v2.js
