name: AI Stylist V2 production model smoke

on:
  push:
    branches:
      - deploy-stylist-v2-e2e-speed-polish-20260909
    paths:
      - .github/workflows/_tmp-stylist-v2-e2e-deploy.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact deploy ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard deployed production candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stylist-simple-agent brain-v1-experiment deploy-stylist-v2-e2e-speed-polish-20260909
          TARGET="$(git rev-parse origin/stylist-simple-agent)"
          BRAIN="$(git rev-parse origin/brain-v1-experiment)"
          DEPLOY="$(git rev-parse origin/deploy-stylist-v2-e2e-speed-polish-20260909)"
          test "$TARGET" = "35a64f19ced603841e6eaeadb7f1a04e3a62b2ee"
          test "$BRAIN" = "7a465683ea20bfb6c5feab2dd1c645f82ff5f754"
          test "$DEPLOY" = "$GITHUB_SHA"
          test "$(git merge-base origin/stylist-simple-agent HEAD)" = "$TARGET"
          DIFF="$(git diff --name-only origin/stylist-simple-agent...HEAD)"
          test "$DIFF" = ".github/workflows/_tmp-stylist-v2-e2e-deploy.yml"

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate for local custom-token signing
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BRAIN_V1 }}

      - name: Install Function dependencies
        working-directory: functions
        run: npm ci --ignore-scripts

      - name: Call deployed Stylist through real Luna model path
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE_WEB_API_KEY="$(node -e "const j=require('./android/app/google-services.json');process.stdout.write(j.client[0].api_key[0].current_key)")"
          echo "::add-mask::$FIREBASE_WEB_API_KEY"
          export FIREBASE_WEB_API_KEY
          export GOOGLE_CLOUD_PROJECT=outfitoftheday-4d401
          cd functions
          node <<'NODE'
          "use strict";
          const assert = require("node:assert/strict");
          const admin = require("firebase-admin");

          const projectId = process.env.GOOGLE_CLOUD_PROJECT;
          const apiKey = process.env.FIREBASE_WEB_API_KEY;
          const uid = "stylist_prod_smoke_model_only";
          const chatId = "stylist_prod_smoke_model_only_chat";

          function bratislavaDateKeys() {
            const parts = new Intl.DateTimeFormat("en-US", {
              timeZone: "Europe/Bratislava", year: "numeric", month: "2-digit", day: "2-digit",
            }).formatToParts(new Date());
            const value = Object.fromEntries(parts.filter((p) => p.type !== "literal").map((p) => [p.type, p.value]));
            const base = new Date(Date.UTC(Number(value.year), Number(value.month) - 1, Number(value.day)));
            const key = (offset) => new Date(base.getTime() + offset * 86400000).toISOString().slice(0, 10);
            return {todayDateKey: key(0), tomorrowDateKey: key(1)};
          }

          async function exchange(customToken) {
            const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${encodeURIComponent(apiKey)}`, {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({token: customToken, returnSecureToken: true}),
            });
            const json = await response.json();
            if (!response.ok) throw new Error(`token_exchange_failed:${response.status}:${json?.error?.message || "unknown"}`);
            return json.idToken;
          }

          async function deleteOwnAuthUser(idToken) {
            await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:delete?key=${encodeURIComponent(apiKey)}`, {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({idToken}),
            }).catch(() => {});
          }

          (async () => {
            if (!admin.apps.length) admin.initializeApp({projectId});
            const customToken = await admin.auth().createCustomToken(uid);
            const idToken = await exchange(customToken);
            try {
              const stamp = Date.now();
              const started = Date.now();
              const response = await fetch(`https://us-east1-${projectId}.cloudfunctions.net/stylistChatV2`, {
                method: "POST",
                headers: {"Content-Type": "application/json", Authorization: `Bearer ${idToken}`},
                body: JSON.stringify({data: {
                  v2SessionId: chatId,
                  turnId: `model_smoke_${stamp}`,
                  message: "Aké farby sa hodia k modrej?",
                  history: [],
                  currentOutfitItemIds: [],
                  currentSelectionReasons: [],
                  shoppingEnabled: false,
                  clientContext: {...bratislavaDateKeys(), timezoneOffsetMinutes: -new Date().getTimezoneOffset()},
                }}),
              });
              const latencyMs = Date.now() - started;
              const json = await response.json().catch(() => ({}));
              if (!response.ok || !json.result) {
                throw new Error(`callable_failed:${response.status}:${JSON.stringify(json).slice(0, 500)}`);
              }
              const result = json.result;
              assert.equal(result.failClosed, false, JSON.stringify(result));
              assert.equal(result.action, "chat", JSON.stringify(result));
              const reply = String(result.reply || result.stylistComment || "").trim();
              assert.ok(reply.length >= 20 && reply.length <= 700, `bad_reply_length:${reply.length}`);
              assert.doesNotMatch(reply, /fail.?closed|validator|toolResults|grounding/i);
              assert.ok(latencyMs <= 20000, `callable_latency_budget_exceeded:${latencyMs}`);
              console.log(JSON.stringify({ok: true, action: result.action, latencyMs, replyLength: reply.length}));
            } finally {
              await deleteOwnAuthUser(idToken);
            }
          })().catch((error) => {
            console.error(`STYLIST_MODEL_ONLY_PRODUCTION_SMOKE_FAILED ${error?.message || error}`);
            process.exitCode = 1;
          });
          NODE
